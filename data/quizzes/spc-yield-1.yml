  source: '대학 학부 전공 표준 범위(공개 강의목차·교재 기반, exa 리서치 + 멀티에이전트 생성). 특정 상용 교재 본문 미복제.'

questions:
  - type: mcq
    q: '표본분산 s^2을 모분산 σ^2의 불편추정량(unbiased estimator)으로 만들기 위해 편차제곱합을 나누는 값은?'
    choices:
      - 'n-1'
      - 'n'
      - 'n+1'
      - '√n'
    answer: 0
    glossary:
      - '불편추정량｜｜추정량의 기댓값이 참 모수와 일치하여 체계적 편향이 없는 추정량'
    explanation: '표본분산을 s^2 = Σ(xi - x̄)^2 / (n-1)로 정의하면 E[s^2] = σ^2가 되어 불편추정량이 된다. n으로 나누면 표본평균 x̄을 사용하면서 자유도가 1 줄어드는 효과를 보정하지 못해 σ^2을 과소추정(편향)한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '다음 중 ''통계량(statistic)''이 아니라 ''모수(parameter)''에 해당하는 것은?'
    choices:
      - '표본평균 x̄'
      - '모평균 μ'
      - '표본표준편차 s'
      - '표본비율 p̂'
    answer: 1
    glossary:
      - '모수｜｜모집단 전체를 기술하는 고정된 값(예: 모평균, 모분산)'
    explanation: '모수는 모집단의 고정된(보통 미지의) 값으로 μ, σ가 대표적이다. x̄, s, p̂은 모두 표본에서 계산되어 표본마다 값이 변하는 통계량이며, 모수를 추정하는 데 쓰인다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'X ~ N(50, 4^2)일 때 X=58을 표준화한 Z값은? (σ=4)'
    choices:
      - '1.5'
      - '8.0'
      - '2.0'
      - '0.5'
    answer: 2
    glossary:
      - '표준화｜｜관측값에서 평균을 빼고 표준편차로 나누어 Z 척도로 바꾸는 변환'
    explanation: 'Z = (X - μ) / σ = (58 - 50) / 4 = 2.0. 표준화는 평균을 빼고 표준편차로 나누어 평균 0, 분산 1인 표준정규분포 Z ~ N(0,1)로 변환하는 절차다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '표준정규분포에서 P(-1 ≤ Z ≤ 1)에 가장 가까운 값은?'
    choices:
      - '0.500'
      - '0.954'
      - '0.997'
      - '0.683'
    answer: 3
    glossary:
      - '경험적 규칙｜｜정규분포에서 ±1σ·±2σ·±3σ 구간에 각각 약 68%·95%·99.7%가 포함된다는 법칙'
    explanation: '경험적 규칙(68-95-99.7)에 따라 평균 ±1σ 구간에는 약 68.3%가 들어간다. ±2σ는 약 95.4%, ±3σ는 약 99.7%다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '모분포가 정규가 아니어도 표본크기 n이 충분히 크면 표본평균 x̄의 분포가 근사적으로 정규분포를 따른다는 정리는?'
    choices:
      - '중심극한정리(CLT)'
      - '큰수의 법칙'
      - '체비셰프 부등식'
      - '베이즈 정리'
    answer: 0
    glossary:
      - '중심극한정리｜｜표본크기가 커질수록 표본평균의 분포가 정규분포에 근사한다는 정리'
    explanation: '중심극한정리(CLT)는 모분포 형태와 무관하게 n이 커질수록 x̄의 분포가 N(μ, σ^2/n)에 근사함을 보장한다. 큰수의 법칙은 x̄이 μ에 수렴함을 말할 뿐 분포의 정규성은 다루지 않는다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '모표준편차 σ=12인 모집단에서 크기 n=36인 표본을 뽑을 때 표본평균 x̄의 표준편차(표준오차)는?'
    choices:
      - '12'
      - '2'
      - '6'
      - '0.33'
    answer: 1
    glossary:
      - '표준오차｜｜표본평균 같은 추정량의 표준편차, 추정의 정밀도를 나타냄'
    explanation: '표본평균의 표준오차는 SE = σ/√n = 12/√36 = 12/6 = 2이다. 표본크기가 커질수록 √n에 반비례하여 x̄의 산포가 줄어든다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '어떤 측정값들의 표준편차가 5 mm라면 분산은 얼마이며 단위는?'
    choices:
      - '5 mm'
      - '2.24 mm'
      - '25 mm^2'
      - '25 mm'
    answer: 2
    explanation: '분산은 표준편차의 제곱이므로 5^2 = 25이고 단위도 제곱되어 mm^2가 된다. 표준편차는 분산의 양의 제곱근으로 원래 데이터와 같은 단위(mm)를 가진다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '변동계수(CV)에 대한 설명으로 옳은 것은?'
    choices:
      - 'CV는 항상 표준편차보다 큰 값을 가진다'
      - 'CV는 단위를 가지며 보통 mm로 표시한다'
      - 'CV가 클수록 데이터가 평균에 더 집중되어 있다'
      - 'CV = σ/μ로, 단위가 다른 두 집단의 상대적 산포를 비교할 때 유용하다'
    answer: 3
    glossary:
      - '변동계수｜｜표준편차를 평균으로 나눈 상대적 산포 척도(무차원)'
    explanation: '변동계수 CV = σ/μ (흔히 ×100%)는 무차원량으로, 평균 대비 상대적 산포를 나타내 단위·척도가 다른 집단 간 산포 비교에 쓰인다. CV가 클수록 상대 산포가 크다(평균에 덜 집중).'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '이항분포 B(n=20, p=0.1)의 평균과 분산은 각각 얼마인가?'
    choices:
      - '평균 2, 분산 1.8'
      - '평균 2, 분산 2'
      - '평균 0.1, 분산 0.09'
      - '평균 20, 분산 1.8'
    answer: 0
    glossary:
      - '이항분포｜｜성공확률 p인 베르누이 시행을 n번 반복할 때 성공 횟수의 분포'
    explanation: '이항분포의 평균은 np = 20×0.1 = 2, 분산은 np(1-p) = 20×0.1×0.9 = 1.8이다. 분산은 항상 (1-p) 인자 때문에 평균보다 작거나 같다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '포아송분포 Poisson(λ)의 분산은?'
    choices:
      - 'λ^2'
      - 'λ'
      - '√λ'
      - 'λ(1-λ)'
    answer: 1
    glossary:
      - '포아송분포｜｜단위 시간·공간에서 드물게 발생하는 사건의 횟수를 모형화하는 분포'
    explanation: '포아송분포는 평균과 분산이 모두 λ로 같다는 특징이 있다. 이 성질 때문에 단위당 결함수 c-chart의 표준편차를 √c̄로 추정한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '95% 신뢰구간에 대한 올바른 해석은?'
    choices:
      - '모평균이 이 구간에 들어갈 확률이 정확히 95%이다'
      - '표본의 95%가 이 구간 안에 있다'
      - '동일 방법으로 구간을 반복 생성하면 약 95%가 참 모평균을 포함한다'
      - '신뢰수준을 높이면 구간 폭이 좁아진다'
    answer: 2
    glossary:
      - '신뢰수준｜｜동일 절차로 구간을 반복 생성할 때 참 모수를 포함하는 구간의 비율'
    explanation: '신뢰수준은 절차의 장기적 포함 비율을 뜻한다. 즉 같은 방법으로 구간을 많이 만들면 약 95%가 참값을 포함한다. 참 모평균은 고정값이므로 특정 구간이 그것을 포함할 ''확률''을 말하기 어렵고, 신뢰수준을 높이면 구간은 오히려 넓어진다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '모평균에 대한 신뢰구간의 폭을 절반으로 줄이려면(σ, 신뢰수준 고정) 표본크기를 어떻게 해야 하는가?'
    choices:
      - '2배로 늘린다'
      - '절반으로 줄인다'
      - '√2배로 늘린다'
      - '4배로 늘린다'
    answer: 3
    explanation: '구간 폭은 표준오차 σ/√n에 비례하므로 폭을 1/2로 하려면 √n을 2배, 즉 n을 4배로 늘려야 한다. 표준오차는 √n에 반비례하기 때문이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '정규확률지(normal probability plot)에서 데이터가 정규분포를 잘 따른다고 판단하는 근거는?'
    choices:
      - '점들이 거의 직선 위에 놓임'
      - '점들이 좌상향으로 휘어진 곡선을 이룸'
      - '점들이 종 모양 곡선을 이룸'
      - '점들이 수평선을 이룸'
    answer: 0
    glossary:
      - '정규확률지｜｜데이터가 정규분포를 따르면 점들이 직선이 되도록 눈금을 변환한 그래프'
    explanation: '정규확률지는 누적분포를 선형화한 축에 데이터를 표시하므로, 정규분포를 따르면 점들이 직선에 가깝게 놓인다. 곡선·S자·꼬리 휨은 치우침이나 두꺼운 꼬리 같은 비정규성을 시사한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '히스토그램이 오른쪽으로 긴 꼬리를 가지며 비대칭일 때의 설명으로 옳은 것은?'
    choices:
      - '좌측으로 치우친(left-skewed) 분포다'
      - '우측으로 치우친(right-skewed) 분포이며 평균이 중앙값보다 크다'
      - '완전한 정규분포다'
      - '분산이 0인 분포다'
    answer: 1
    glossary:
      - '왜도｜｜분포의 비대칭 정도, 양수면 오른쪽 꼬리가 긺'
    explanation: '오른쪽 꼬리가 긴 분포는 우측(양의) 왜도(right/positive skew)를 가지며, 큰 값들이 평균을 끌어올려 일반적으로 평균 > 중앙값이 된다. 이런 경우 정규성을 가정하기 어렵다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'Shewhart 관리도에서 관리한계를 중심선 ±3σ로 설정하는 주된 이유는?'
    choices:
      - '계산이 가장 간단하기 때문'
      - '규격한계(USL/LSL)와 항상 일치하기 때문'
      - '공정이 안정일 때 점이 한계를 벗어날 거짓경보 확률이 약 0.27%로 작기 때문'
      - '표본크기와 무관하게 한계를 고정하기 위해'
    answer: 2
    glossary:
      - '관리한계｜｜공정의 자연 변동 범위를 나타내는 ±3σ 경계, 규격한계와 다름'
      - '거짓경보｜｜공정이 정상인데도 한계를 벗어나 이상으로 오판하는 것'
    explanation: '정규근사 하에서 ±3σ 밖에 점이 떨어질 확률은 약 0.0027(0.27%)로 매우 작다. 따라서 점이 한계를 벗어나면 우연이 아니라 이상원인이 있다고 판단하며, 거짓경보는 드물다. 관리한계는 규격한계와 별개 개념이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '관리한계(control limit)와 규격한계(specification limit)의 관계로 옳은 것은?'
    choices:
      - '둘은 항상 같은 값이다'
      - '규격한계는 표본범위 R̄로 계산한다'
      - '관리한계는 고객이 지정한다'
      - '관리한계는 공정 데이터에서 계산되고, 규격한계는 고객·설계 요구에서 정해진다'
    answer: 3
    glossary:
      - '규격한계｜｜제품이 합격으로 인정되는 허용 범위, 설계·고객이 정함'
    explanation: '관리한계는 실제 공정 변동(±3σ)에서 산출되어 ''공정이 안정한가''를 본다. 규격한계는 제품 요구사항(설계·고객)에서 나와 ''제품이 합격인가''를 본다. 둘은 출처와 목적이 다르며 같다고 가정하면 안 된다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '우연원인(common cause)과 이상원인(assignable cause)에 대한 설명으로 옳은 것은?'
    choices:
      - '이상원인은 식별·제거 가능한 특정 원인으로 관리도에서 신호로 나타난다'
      - '우연원인은 제거 대상이고 이상원인은 항상 존재한다'
      - '우연원인이 있으면 공정은 불안정 상태다'
      - '이상원인은 공정에 내재된 자연적 변동이다'
    answer: 0
    glossary:
      - '우연원인｜｜공정에 항상 존재하는 작고 무수한 자연 변동의 합'
      - '이상원인｜｜식별·제거 가능한 특정 원인에 의한 변동'
    explanation: '이상원인(특수원인)은 식별·제거 가능한 특정 원인(설비 고장, 원료 변경 등)으로, 관리도에서 한계 이탈이나 비정상 패턴으로 신호된다. 우연원인은 공정에 내재된 무수한 작은 변동의 합으로, 시스템 개선 없이는 줄일 수 없다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '공정이 ''통계적 관리상태(in statistical control)''에 있다는 것의 의미로 가장 적절한 것은?'
    choices:
      - '모든 점이 규격한계 안에 있다'
      - '이상원인이 없고 우연원인에 의한 변동만 존재한다'
      - '불량이 전혀 발생하지 않는다'
      - '공정평균이 0이다'
    answer: 1
    glossary:
      - '통계적 관리상태｜｜이상원인 없이 우연원인 변동만 존재하는 예측 가능한 공정 상태'
    explanation: '통계적 관리상태는 이상원인이 제거되어 우연원인에 의한 변동만 남은 안정적·예측 가능한 상태다. 이는 규격 만족(능력)과 다른 개념이며, 관리상태여도 규격을 벗어날 수 있다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'Western Electric 런 규칙 중 ''연속 8점이 모두 중심선의 같은 쪽에 위치''할 때의 판정으로 옳은 것은?'
    choices:
      - '우연변동이므로 정상이다'
      - '한 점이라도 ±3σ를 넘지 않았으므로 무시한다'
      - '비정상 패턴(공정평균 이동 등)으로 이상원인 조사를 시사한다'
      - '관리한계를 다시 ±3σ로 넓혀야 한다'
