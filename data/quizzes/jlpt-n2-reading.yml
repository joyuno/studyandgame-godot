  - type: mcq
    passage: |
      私たちが毎日出すごみのうち、きちんと分別すれば再び資源として生まれ変わるものは意外に多い。ペットボトルは細かく砕かれ、繊維に加工されて衣類になることもある。しかし、中身が残っていたり、ラベルがはがされていなかったりすると、せっかく回収しても再利用できず、燃やすしかなくなってしまう。分別の手間を惜しまないことが、資源を無駄にしない第一歩なのだ。
    q: 'ペットボトルが再利用されてできるものとして本文に挙げられているのはどれか。'
    choices:
      - '衣類などの繊維製品'
      - '新しいペットボトル'
      - 'ノートなどの紙製品'
      - 'びんなどのガラス製品'
    answer: 0
    explanation: '本文に「ペットボトルは細かく砕かれ、繊維に加工されて衣類になることもある」とある。'
    time: 60
    reward: 2
    tags: [jlpt, n2, reading]

