      - '通勤を完全になくしてしまうこと'
      - '意識して休憩を取り、定期的に同僚と連絡を取り合う仕組みを整えること'
      - 'できるだけ一人で作業に集中し続けること'
    answer: 2
    explanation: |
      정답:「意識して休憩を取り、定期的に同僚と連絡を取り合う仕組みを整えること」.
      마지막 단락에 전문가의 말로 「各自が意識して休憩を取り、定期的に同僚と連絡を取り合う仕組みを整えることが欠かせない」고 직접 제시된다.
      「制度を導入しさえすればそれで十分である」: 본문은 「制度を導入するだけでは不十分」이라고 하여 정면으로 모순됨.
      「通勤を完全になくしてしまうこと」: 통근 폐지는 성공 조건으로 언급된 적 없음.
      「できるだけ一人で作業に集中し続けること」: 본문은 오히려 「定期的に同僚と連絡を取り合う」을 강조하므로 모순됨.
    time: 90
    reward: 3
    tags: [jlpt, n2, reading]

  - type: mcq
    passage: |
      私たちが毎日出すごみのうち、きちんと分別すれば再び資源として生まれ変わるものは意外に多い。ペットボトルは細かく砕かれ、繊維に加工されて衣類になることもある。しかし、中身が残っていたり、ラベルがはがされていなかったりすると、せっかく回収しても再利用できず、燃やすしかなくなってしまう。分別の手間を惜しまないことが、資源を無駄にしない第一歩なのだ。
    q: 'ペットボトルが再利用されてできるものとして本文に挙げられているのはどれか。'
    choices:
      - '衣類などの繊維製品'
      - '新しいペットボトル'
      - 'ノートなどの紙製品'
      - 'びんなどのガラス製品'
    answer: 0
    explanation: |
      정답:「衣類などの繊維製品」.
      본문에 「ペットボトルは細かく砕かれ、繊維に加工されて衣類になることもある」고 명시된다.
      「新しいペットボトル」: 본문에 페트병으로 다시 만들어진다는 언급 없음.
      「ノートなどの紙製品」: 종이 제품은 본문에 전혀 언급 없음.
      「びんなどのガラス製品」: 유리 제품도 본문에 등장하지 않음.
    time: 60
    reward: 2
    tags: [jlpt, n2, reading]

  - type: mcq
    passage: |
      私たちが毎日出すごみのうち、きちんと分別すれば再び資源として生まれ変わるものは意外に多い。ペットボトルは細かく砕かれ、繊維に加工されて衣類になることもある。しかし、中身が残っていたり、ラベルがはがされていなかったりすると、せっかく回収しても再利用できず、燃やすしかなくなってしまう。分別の手間を惜しまないことが、資源を無駄にしない第一歩なのだ。
    q: '回収しても再利用できなくなる原因として本文に挙げられているものはどれか。'
    choices:
      - 'ボトルに色がついていること'
      - 'ボトルの形が変わってしまっていること'
      - '製造から時間がたちすぎていること'
      - '中身が残っていたり、ラベルがはがされていなかったりすること'
    answer: 3
    explanation: |
      정답:「中身が残っていたり、ラベルがはがされていなかったりすること」.
      본문에 「中身が残っていたり、ラベルがはがされていなかったりすると、せっかく回収しても再利用できず」라고 원인이 직접 제시된다.
      「ボトルに色がついていること」: 색에 관한 언급은 본문에 없음.
      「ボトルの形が変わってしまっていること」: 형태 변형은 본문에 언급 없음.
      「製造から時間がたちすぎていること」: 제조 후 경과 시간은 본문에 등장하지 않음.
    time: 60
    reward: 2
    tags: [jlpt, n2, reading]

  - type: mcq
    passage: |
      地方には、何百年も受け継がれてきた伝統工芸が数多く存在する。職人が一つひとつ手作業で仕上げる品は、機械では決して真似のできない温かみを持っている。だが今、その多くが消えようとしている。最大の原因は、技術を受け継ぐ若い世代がいないことだ。
      修業には長い年月がかかり、一人前になるまで十年以上を要する分野も珍しくない。その間の収入は決して多くなく、生活の不安から途中であきらめてしまう人も多い。さらに、安価な大量生産品が市場に出回り、手作りの品は値段の高さから敬遠されがちだ。
      しかし、伝統工芸が一度途絶えてしまえば、その技術を再び取り戻すことはほぼ不可能である。私は、職人が安心して修業に専念できるよう、行政や企業が修業中の生活を支える仕組みを作るべきだと考える。文化を守るのは、消費者の関心だけに頼っていてはならない。社会全体で支える覚悟が、今こそ求められているのだ。
    q: '伝統工芸が消えようとしている最大の原因は何だと筆者は述べているか。'
    choices:
      - '機械で作った製品の品質が向上したから'
      - '技術を受け継ぐ若い世代がいないから'
      - '材料が手に入らなくなったから'
      - '技術が海外に流出してしまったから'
    answer: 1
    explanation: |
      정답:「技術を受け継ぐ若い世代がいないから」.
      본문에 「最大の原因は、技術を受け継ぐ若い世代がいないことだ」라고 最大の原因이 직접 명시된다.
      「機械で作った製品の品質が向上したから」: 본문은 「機械では決して真似のできない温かみ」라 하여 기계 품질 향상은 언급 없음.
      「材料が手に入らなくなったから」: 재료 부족은 본문에 전혀 언급 없음.
      「技術が海外に流出してしまったから」: 기술의 해외 유출도 본문에 등장하지 않음.
    time: 120
    reward: 3
    tags: [jlpt, n2, reading]

