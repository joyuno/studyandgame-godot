    q: '在宅勤務の問題点として本文で述べられているものはどれか。'
    choices:
      - '静かすぎてかえって集中できないこと'
      - '通勤の負担がこれまでより増えること'
      - '家事や趣味の時間がまったく取れなくなること'
      - '同僚に気軽に相談できず、大きなミスにつながることがあること'
    answer: 3
    explanation: |
      정답:「同僚に気軽に相談できず、大きなミスにつながることがあること」.
      본문에 「同僚と気軽に相談できないため…後で大きなミスにつながる例も報告されている」고 하여 問題点으로 명시된다.
      「静かすぎてかえって集中できないこと」: 본문은 「静かな環境で…集中力が高まった」고 하므로 오히려 정반대로 모순됨.
      「通勤の負担がこれまでより増えること」: 본문은 「通勤に費やしていた時間がなくなり」라고 하여 모순됨.
      「家事や趣味の時間がまったく取れなくなること」: 본문은 「家事や趣味に充てられるようになった」고 하여 모순되며 「まったく取れない」는 과장임.
    time: 90
    reward: 3
    tags: [jlpt, n2, reading]

  - type: mcq
