  title: '물리전자공학 6'
  version: '1.0.0'
  default_time: 45
  set_time: 1750
  tags: [engineering, semiconductor, device-physics]
  source: '대학 학부 전공 표준 범위(공개 강의목차·교재 기반, exa 리서치 + 멀티에이전트 생성). 특정 상용 교재 본문 미복제.'

questions:
  - type: mcq
    q: 'n채널 enhancement형 MOSFET에서 게이트 전압이 V_T를 넘을 때 채널이 형성되는 원리로 옳은 것은?'
    choices:
      - '산화막이 도체로 변해 전류가 흐른다'
      - '기판 전체가 n형으로 바뀐다'
      - 'p형 기판 표면이 전자로 반전되어 소스-드레인을 잇는 n형 도전 채널이 생긴다'
      - '게이트 금속에서 채널로 전자가 직접 주입된다'
    answer: 2
    glossary:
      - '반전층｜｜게이트 전계로 기판 표면 캐리어 종류가 뒤바뀌어 형성된 얇은 도전층'
    explanation: '양의 게이트 전압이 V_T를 넘으면 p형 표면이 전자로 반전되어 소스와 드레인을 연결하는 얇은 n형 반전층(채널)이 생긴다. 이 채널을 통해 다수 전자가 흐른다. 산화막은 절연을 유지하고, 기판 벌크는 여전히 p형이며 게이트는 전기적으로 절연된다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'n채널 enhancement형과 depletion형 MOSFET의 문턱전압 부호 차이로 옳은 것은?'
    choices:
      - 'enhancement형은 V_T<0, depletion형은 V_T>0'
      - '둘 다 항상 V_T=0이다'
      - '둘 다 항상 V_T>0이다'
      - 'enhancement형은 V_T>0(게이트에 양전압 인가해야 채널 형성), depletion형은 V_T<0(0V에서도 채널 존재)'
    answer: 3
    glossary:
      - 'depletion형｜｜0V 게이트에서도 채널이 존재해 정상-온(normally-on)인 MOSFET'
    explanation: 'n채널 enhancement형은 V_T>0으로 양의 게이트 전압을 주어야 채널이 생긴다. depletion형은 미리 채널(주입된 n형층)이 있어 V_T<0이고 V_GS=0에서도 전류가 흐르며, 음전압으로 채널을 공핍시켜 끈다. 두 형은 V_T 부호로 구분된다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'n채널 depletion형 MOSFET을 ''OFF''(채널 차단)시키려면 게이트에 어떤 전압을 인가해야 하는가?'
    choices:
      - '충분히 큰 음(-)의 게이트 전압을 인가해 기존 채널을 공핍시킨다'
      - '양(+)의 게이트 전압을 인가한다'
      - '게이트를 개방(floating)한다'
      - '드레인 전압만 높인다'
    answer: 0
    explanation: 'depletion형은 V_GS=0에서 이미 채널이 있어 정상-온이므로, 음의 게이트 전압(< V_T<0)을 인가해 채널 전자를 밀어내 공핍시켜야 OFF가 된다. 양전압은 채널을 더 강화하고, 개방은 제어 불능 상태다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'n채널 MOSFET의 선형(트라이오드) 영역 드레인 전류 식으로 옳은 것은? (W:폭, L:길이, μ_n:이동도)'
    choices:
      - 'I_D = (1/2)·μ_n·C_ox·(W/L)·(V_GS - V_T)^2'
      - 'I_D = μ_n·C_ox·(W/L)·[(V_GS - V_T)·V_DS - V_DS^2/2]'
      - 'I_D = μ_n·C_ox·(W/L)·V_DS^2'
      - 'I_D = μ_n·C_ox·(W/L)·(V_GS - V_T)'
    answer: 1
    glossary:
      - '트라이오드(선형) 영역｜｜V_DS가 작아 드레인 전류가 V_DS에 거의 비례하는 동작 영역'
    explanation: '선형 영역(V_DS < V_GS - V_T)에서는 I_D=μ_n·C_ox·(W/L)·[(V_GS-V_T)·V_DS - V_DS^2/2] 이다. (1/2)·μ_n·C_ox·(W/L)·(V_GS-V_T)^2 은 포화 영역 식이고, 나머지는 차원/형태가 맞지 않는다. V_DS^2/2 항이 채널 전하의 위치 의존성을 반영한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'V_DS가 (V_GS - V_T)에 비해 매우 작을 때, 선형 영역의 MOSFET은 어떤 소자처럼 동작하는가?'
    choices:
      - '이상적 전류원처럼 동작한다'
      - '다이오드처럼 한 방향만 도통한다'
      - 'V_GS로 저항값이 제어되는 전압제어 저항(가변저항)처럼 동작한다'
      - 'V_DS와 무관한 정전류원처럼 동작한다'
    answer: 2
    explanation: 'V_DS가 매우 작으면 V_DS^2/2 항이 무시되어 I_D≈μ_n·C_ox·(W/L)·(V_GS-V_T)·V_DS 로 V_DS에 선형 비례한다. 즉 채널이 V_GS로 컨덕턴스가 조절되는 전압제어 저항처럼 동작한다. 정전류원/포화 거동은 V_DS가 클 때(포화 영역) 나타난다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '선형 영역에서 작은 V_DS로 측정한 채널 컨덕턴스 g_d = I_D/V_DS 를 V_GS에 대해 그렸을 때, 그 기울기와 V_GS축 절편으로 각각 무엇을 추출할 수 있는가?'
    choices:
      - '기울기에서 산화막 두께, 절편에서 도핑 농도'
      - '기울기에서 V_T, 절편에서 이동도'
      - '둘 다 기판 도핑만 결정한다'
      - '기울기에서 μ_n·C_ox·(W/L), 절편에서 문턱전압 V_T'
    answer: 3
    glossary:
      - '컨덕턴스(g_d)｜｜드레인 전류를 드레인 전압으로 나눈 채널의 전도도, 작은 V_DS에서 채널 저항의 역수'
    explanation: '작은 V_DS에서 g_d≈μ_n·C_ox·(W/L)·(V_GS-V_T) 이므로 g_d 대 V_GS 직선의 기울기는 μ_n·C_ox·(W/L), V_GS축 절편은 V_T를 준다. 이렇게 선형 영역 전달특성으로 유효 이동도와 문턱전압을 동시에 추출한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '장채널 NMOS에서 채널이 드레인 단에서 핀치오프(pinch-off)되어 소자가 포화 영역에 진입하기 시작하는 조건은? (V_GS>V_th 가정)'
    choices:
      - 'V_DS = V_GS - V_th'
      - 'V_DS = V_GS + V_th'
      - 'V_DS = V_th'
      - 'V_DS = 0'
    answer: 0
    glossary:
      - '핀치오프｜｜드레인 근처 채널 반전층이 사라져 끊기는 현상'
      - 'V_ov｜｜오버드라이브 전압 V_GS-V_th'
    explanation: '드레인 쪽 채널의 유효 게이트-채널 전압이 V_GS - V_DS이고, 이것이 V_th로 떨어지는 순간(V_DS = V_GS - V_th = V_ov) 드레인 단 반전층이 사라져 핀치오프가 일어나며 포화 영역에 진입한다. V_DS가 이보다 커지면 핀치오프점이 소스 쪽으로 약간 이동할 뿐 전류는 거의 일정해진다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '다음 중 NMOS가 ''선형(triode/저항) 영역''이 아니라 ''포화 영역''에서 동작함을 나타내는 설명으로 옳은 것은?'
    choices:
      - 'V_DS가 작아 채널이 소스에서 드레인까지 연속적으로 존재한다'
      - 'I_D가 V_DS에 거의 무관하고 주로 V_GS에 의해 결정된다'
      - 'I_D가 V_DS에 비례하여 선형으로 증가한다'
      - '게이트 전압이 V_th보다 낮아 채널이 형성되지 않는다'
    answer: 1
    glossary:
      - 'triode 영역｜｜저항처럼 동작하는 선형 영역'
    explanation: '포화 영역에서는 드레인 단이 핀치오프되어 I_D가 V_DS에 거의 둔감하고 V_GS(정확히는 V_ov)에 의해 지배된다. 선형 영역은 V_DS가 작아 채널이 연속적이고 I_D가 V_DS에 거의 선형으로 증가하는 영역이며, V_GS<V_th는 차단 영역이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '장채널 NMOS의 포화 영역 전류 근사식 I_D = (1/2)·μ_n·C_ox·(W/L)·(V_GS-V_th)² 에서, V_GS-V_th를 2배로 키우면 I_D는 어떻게 변하는가? (다른 조건 동일)'
    choices:
      - '2배'
      - '√2배'
      - '4배'
      - '변화 없음'
    answer: 2
    glossary:
      - 'C_ox｜｜단위면적당 게이트 산화막 정전용량'
    explanation: '포화전류는 오버드라이브 전압의 제곱에 비례하므로(I_D ∝ V_ov²), V_ov를 2배로 하면 전류는 2²=4배가 된다. 이 제곱 법칙은 장채널·강반전 가정에서 성립한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '포화 NMOS 전류식 I_D=(1/2)μ_n C_ox (W/L)(V_GS-V_th)²에서 게이트 산화막 두께 t_ox를 절반으로 줄이면(다른 조건 동일) I_D는?'
    choices:
      - '1/2배'
      - '4배'
      - '변화 없음'
      - '2배'
    answer: 3
    glossary:
      - 't_ox｜｜게이트 산화막 두께'
      - 'ε_ox｜｜산화막 유전율'
    explanation: 'C_ox = ε_ox/t_ox 이므로 t_ox를 절반으로 하면 C_ox가 2배가 되고, I_D는 C_ox에 1차 비례하므로 2배가 된다. 산화막을 얇게 하면 게이트 제어력이 커져 같은 V_ov에서 더 큰 전류가 흐른다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'μ_n C_ox = 200 μA/V², W/L = 10, V_th = 0.5 V 인 NMOS에 V_GS = 1.5 V, V_DS = 2 V를 인가했을 때 포화 영역 I_D는 약 얼마인가? (채널길이 변조 무시)'
    choices:
      - '1.0 mA'
      - '0.5 mA'
      - '2.0 mA'
      - '4.0 mA'
    answer: 0
    explanation: 'V_ov = 1.5-0.5 = 1.0 V, V_DS(2V) > V_ov 이므로 포화. I_D = (1/2)(200μ)(10)(1.0)² = 1000 μA = 1.0 mA. 단위면적 이동도-용량 곱과 W/L, V_ov²를 곱해 구한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'MOSFET의 트랜스컨덕턴스 g_m의 정의로 옳은 것은?'
    choices:
      - '∂I_D/∂V_DS (V_GS 고정)'
      - '∂I_D/∂V_GS (V_DS 고정)'
      - '∂V_GS/∂I_D (V_DS 고정)'
      - '∂I_D/∂V_BS (V_GS 고정)'
    answer: 1
    glossary:
      - 'g_ds｜｜출력(드레인-소스) 컨덕턴스'
    explanation: 'g_m은 게이트 전압 변화에 대한 드레인 전류의 변화율, 즉 g_m = ∂I_D/∂V_GS (V_DS 일정)로 정의되며 입력 전압을 출력 전류로 바꾸는 증폭 능력을 나타낸다. ∂I_D/∂V_DS는 출력 컨덕턴스 g_ds, ∂I_D/∂V_BS는 기판 트랜스컨덕턴스 g_mb이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '장채널 포화 NMOS에서 제곱법칙을 미분하면 g_m을 여러 형태로 쓸 수 있다. 다음 중 옳지 않은 표현은? (β=μ_n C_ox(W/L))'
    choices:
      - 'g_m = β(V_GS - V_th)'
      - 'g_m = 2·I_D/(V_GS - V_th)'
      - 'g_m = I_D/(V_GS - V_th)²'
      - 'g_m = √(2·β·I_D)'
    answer: 2
    glossary:
      - 'β｜｜전류이득 계수 μ_n C_ox (W/L)'
    explanation: 'I_D=(1/2)β V_ov²를 V_GS로 미분하면 g_m=β V_ov. 이를 I_D로 정리하면 g_m=2I_D/V_ov, 또 g_m=√(2β I_D)로도 쓸 수 있다. 그러나 g_m = I_D/V_ov² 는 차원·계수가 맞지 않는 틀린 표현이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '포화 영역 장채널 MOSFET에서 바이어스 전류 I_D를 4배로 늘렸을 때(W/L, 소자 동일) g_m은 약 몇 배가 되는가?'
    choices:
      - '4배'
      - '8배'
      - '16배'
      - '2배'
    answer: 3
    glossary:
      - 'g_m/I_D｜｜단위 전류당 트랜스컨덕턴스(설계 효율 지표)'
    explanation: 'g_m = √(2β I_D) 이므로 g_m ∝ √I_D. 따라서 I_D를 4배로 하면 g_m은 √4 = 2배가 된다. 즉 전류를 키워도 g_m은 제곱근으로만 증가해 효율(g_m/I_D)은 오히려 감소한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'MOSFET의 g_m/I_D는 약반전(subthreshold)에서 최대가 되며 그 이론적 상한은 온도 T=300K에서 약 얼마인가? (n≈1)'
    choices:
      - '약 38~40 V⁻¹'
      - '약 1 V⁻¹'
      - '약 4 V⁻¹'
      - '약 600 V⁻¹'
    answer: 0
    glossary:
      - '약반전｜｜V_GS<V_th에서 확산 전류가 지배하는 영역'
      - 'kT/q｜｜300K에서 약 25.9 mV'
    explanation: '약반전에서 I_D는 V_GS에 지수적으로 의존(I_D∝exp(qV_GS/nkT))하므로 g_m/I_D = q/(nkT) ≈ 1/(n·0.0259V). n≈1이면 약 38.6 V⁻¹로 이것이 효율의 상한이다. 강반전에서는 2/V_ov로 이보다 작아진다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '소스-기판이 접지된 NMOS에서 기판(body)을 소스보다 더 낮게(즉 소스-기판 접합을 역바이어스) 만들면 문턱전압 V_th는 어떻게 변하는가?'
    choices:
      - '감소한다(더 음으로)'
      - '증가한다(더 양으로)'
      - '변하지 않는다'
      - '0이 된다'
    answer: 1
    glossary:
      - 'V_SB｜｜소스-기판 전압'
      - '공핍층｜｜가동 캐리어가 없는 공간전하 영역'
    explanation: '기판 바이어스 효과(body effect)로, 소스-기판 접합이 역바이어스(V_SB>0)되면 공핍층이 넓어져 더 많은 게이트 전하가 공핍전하 상보에 쓰이므로 NMOS의 V_th가 더 양의 값으로 증가한다. PMOS에서는 반대로 더 음으로 간다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '기판 바이어스 효과를 포함한 NMOS 문턱전압식 V_th = V_th0 + γ(√(2φ_F + V_SB) − √(2φ_F)) 에서 body-effect 계수 γ를 작게(약하게) 만드는 방법은?'
    choices:
      - '기판 도핑 농도 N_A를 높인다'
      - '게이트 산화막을 두껍게 한다'
      - '게이트 산화막 정전용량 C_ox를 크게 한다'
      - '온도를 낮춘다'
    answer: 2
    glossary:
      - 'φ_F｜｜페르미 전위'
      - 'γ｜｜body-effect 계수'
      - 'ε_si｜｜실리콘 유전율'
    explanation: 'γ = √(2 q ε_si N_A)/C_ox 이므로 γ는 C_ox에 반비례하고 N_A의 제곱근에 비례한다. 따라서 C_ox를 키우면(산화막을 얇게) body effect가 약해진다. N_A를 높이거나 산화막을 두껍게 하면 γ가 커진다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'MOSFET의 문턱전압 이하(subthreshold) 영역에서 드레인 전류 I_D와 게이트 전압 V_GS의 관계로 옳은 것은?'
    choices:
      - 'I_D ∝ (V_GS - V_th)²'
