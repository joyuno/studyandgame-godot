  title: '반도체 신뢰성·불량분석 3'
  version: '1.0.0'
  default_time: 45
  set_time: 1750
  tags: [engineering, semiconductor, reliability]
  source: '대학 학부 전공 표준 범위(공개 강의목차·교재 기반, exa 리서치 + 멀티에이전트 생성). 특정 상용 교재 본문 미복제.'

questions:
  - type: mcq
    q: 'TDDB 수명 데이터를 Weibull 분포로 분석할 때, 형상모수(shape parameter) β가 1보다 작은 경우가 의미하는 것으로 가장 적절한 것은?'
    choices:
      - '고장률이 시간에 따라 감소하는 초기고장(infant mortality) 영역'
      - '고장률이 일정한 우발고장(random failure) 영역'
      - '고장률이 시간에 따라 증가하는 마모고장(wear-out) 영역'
      - '고장이 전혀 발생하지 않는 무고장 영역'
    answer: 0
    glossary:
      - '순간고장률(hazard rate)｜｜단위시간당 아직 살아있는 소자가 그 순간 고장 날 확률밀도'
      - '형상모수(shape parameter)｜｜Weibull 분포 곡선의 기울기를 결정하는 무차원 모수 β'
    explanation: 'Weibull 분포의 순간고장률(hazard rate)은 t^(β-1)에 비례하므로 β<1이면 시간에 따라 감소하여 초기고장(욕조곡선의 앞부분)을 나타낸다. β=1은 일정 고장률(지수분포), β>1은 증가하는 마모고장에 해당한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'TDDB의 Weibull 통계에서 산화막 면적 A가 커질수록 동일 누적고장확률(예: 63.2%)에 도달하는 시간이 변하는 경향과 그 이유로 옳은 것은?'
    choices:
      - '면적은 Weibull 기울기만 바꾸고 수명에는 영향이 없다'
      - '면적이 커지면 약한 지점(weak spot)을 포함할 확률이 커져 수명이 짧아진다'
      - '면적이 커지면 결함 포함 확률이 낮아져 수명이 길어진다'
      - '면적이 커지면 형상모수 β가 1보다 커진다'
    answer: 1
    glossary:
      - 'Poisson 면적 스케일링｜｜결함이 면적당 무작위 분포한다는 가정 아래 면적에 따라 수명분포가 이동하는 법칙'
    explanation: 'TDDB는 가장 약한 결함이 파괴를 좌우하는 ''최약 링크(weakest-link)'' 통계를 따른다. 면적이 커지면 그만큼 취약 결함을 포함할 확률이 높아져 동일 고장확률 수명이 짧아진다(Poisson 면적 스케일링). 기울기 β는 보존되고 수명 축이 이동한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '반도체 신뢰성에서 일반적으로 lognormal 분포가 Weibull 분포보다 더 자연스럽게 적용되는 고장 메커니즘은?'
    choices:
      - '산화막 절연파괴(TDDB)'
      - '초기고장 스크리닝 대상 불량'
      - 'electromigration(EM)에 의한 배선 단선'
      - 'ESD 단발 과전압 파괴'
    answer: 2
    glossary:
      - '곱셈적 과정(multiplicative process)｜｜여러 무작위 비율이 곱해져 결과가 결정되는 과정, 로그를 취하면 합이 되어 정규분포에 수렴'
    explanation: 'EM이나 부식처럼 다수의 곱셈적(multiplicative) 열화 단계가 누적되는 마모형 고장은 중심극한정리에 의해 로그 수명이 정규분포를 따라 lognormal로 잘 기술된다. 반면 TDDB는 최약 링크 특성 때문에 Weibull이 적합하다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '수명 T가 lognormal 분포를 따를 때, ln(T)의 표준편차에 해당하는 형상모수 σ가 클수록 나타나는 현상으로 옳은 것은?'
    choices:
      - '중앙값(median) 수명 자체가 항상 증가한다'
      - '분포가 대칭 정규분포로 바뀐다'
      - '수명 산포가 작아져 고장 시점이 좁게 모인다'
      - '수명 산포가 커져 중앙값 대비 조기/만기 고장 폭이 넓어진다'
    answer: 3
    glossary:
      - '중앙값(median)｜｜누적분포가 50%가 되는 값, lognormal에서는 exp(μ)'
    explanation: 'lognormal에서 σ는 ln(T)의 표준편차이므로 σ가 클수록 수명의 상대 산포가 커진다. 중앙값(=exp(μ))은 σ와 독립이며, 원 척도의 분포는 오른쪽으로 긴 꼬리를 갖는 비대칭이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '두꺼운(>4 nm) 게이트 산화막의 저전계 TDDB를 설명하는 열화학적 E-model에 대한 설명으로 옳은 것은?'
    choices:
      - '고장시간이 전계가 커질수록 지수적으로 감소한다(TTF ∝ exp(-γ·E_ox))'
      - '고장시간이 산화막 전계 E_ox에 지수적으로 증가한다'
      - '고장시간이 ln(E_ox)에 선형으로 의존한다'
      - '고장시간이 E_ox와 무관하다'
    answer: 0
    glossary:
      - 'E-model｜｜전계가 결합 파괴 활성화에너지를 낮춘다고 보는 열화학적 TDDB 모델'
      - 'TTF｜｜time-to-failure, 고장까지 걸리는 시간'
    explanation: 'E-model에서는 전계가 Si-O 결합의 열적 파괴 활성화에너지를 낮춰 고장반응을 가속하므로 TTF ∝ exp(-γ·E_ox), 즉 전계가 커질수록 수명이 지수적으로 감소한다. 1/E 의존은 별개의 anode hole injection(1/E) 모델이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'TDDB의 1/E 모델(anode hole injection model)이 가정하는 물리적 손상 기구로 가장 적절한 것은?'
    choices:
      - '산화막 내 이온성 불순물(Na+)의 드리프트'
      - 'Fowler-Nordheim 터널링 전자가 양극에서 hot hole을 생성해 산화막으로 재주입하며 트랩 생성'
      - '패키지 습기에 의한 배선 부식'
      - '전계에 의한 Si-O 결합의 직접 열적 절단'
    answer: 1
    glossary:
      - 'Fowler-Nordheim tunneling｜｜고전계에서 삼각형 장벽을 전자가 터널링하는 전도'
      - 'TBD｜｜time to breakdown, 절연파괴까지의 시간'
    explanation: '1/E 모델은 FN 터널링으로 주입된 전자가 양극에서 충돌이온화로 hot hole을 만들고, 이 정공이 산화막으로 다시 주입되어 트랩을 누적시켜 파괴에 이른다고 본다. 그 결과 log(TBD)가 1/E_ox에 비례한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'MOSFET의 HCI(hot carrier injection) 열화가 가장 심해지는 동작 조건으로 일반적으로 알려진 것은?'
    choices:
      - '낮은 V_DS, 낮은 온도'
      - '게이트만 강한 음의 바이어스 인가, 드레인 0 V'
      - '최대 기판전류(I_sub) 조건 부근, 즉 채널 측방 전계가 큰 고 V_DS'
      - '소자가 완전히 꺼진 차단(cut-off) 상태'
    answer: 2
    glossary:
      - '충돌이온화(impact ionization)｜｜고에너지 캐리어가 격자와 충돌해 전자-정공쌍을 만드는 현상'
      - '기판전류(I_sub)｜｜충돌이온화로 생긴 정공이 기판으로 흐르는 전류, HCI 강도의 지표'
    explanation: 'HCI는 드레인 근처의 큰 측방 전계로 가속된 캐리어가 충돌이온화·게이트 산화막 주입을 일으키며 발생하며, 전통적으로 기판전류 I_sub가 최대가 되는 바이어스에서 가장 심하다. 차단 상태나 저전압에서는 가속 캐리어가 부족하다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'NBTI(negative bias temperature instability) 열화가 주로 영향을 주는 소자와 스트레스 조건으로 옳은 것은?'
    choices:
      - '양의 게이트 바이어스 하의 NMOS'
      - '드레인 고전압 하의 NMOS'
      - '역바이어스 PN 접합'
      - '음의 게이트 바이어스·고온 하의 PMOS'
    answer: 3
    glossary:
      - '계면 트랩(interface trap)｜｜Si/SiO2 계면의 미결합 결함, 전하를 포획해 V_th를 이동시킴'
    explanation: 'NBTI는 PMOS가 음의 게이트 바이어스와 고온에 노출될 때 계면 트랩 생성과 정공 트래핑으로 문턱전압 크기가 증가(|V_th| 상승)하며 열화한다. NMOS의 양 바이어스 열화는 PBTI로 구분한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'PBTI(positive bias temperature instability)가 특히 두드러지게 관찰되기 시작한 공정 변화와 그 주된 기구는?'
    choices:
      - 'HfO2 등 high-k 금속게이트 도입으로 NMOS 유전체 내 전자 트래핑이 커졌기 때문'
      - '알루미늄 배선에서 구리 배선으로 전환되었기 때문'
      - '순수 SiO2 게이트에서 정공 트래핑이 강화되었기 때문'
      - 'ESD 보호회로가 제거되었기 때문'
    answer: 0
    glossary:
      - 'high-k｜｜SiO2보다 유전율이 높은 게이트 절연막(예: HfO2)'
      - 'metal gate｜｜폴리실리콘 대신 금속을 쓰는 게이트 전극'
    explanation: 'PBTI는 NMOS에 양의 게이트 바이어스가 걸릴 때 유전체 내 전자 트래핑/트랩 생성으로 V_th가 상승하는 열화로, HfO2 기반 high-k/metal-gate가 도입되면서 벌크 산화막 전자 트랩이 늘어 NMOS PBTI가 신뢰성 이슈로 부각되었다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'NBTI 측정 시 스트레스 바이어스를 제거하면 V_th 이동의 일부가 빠르게 되돌아가는 ''회복(recovery)'' 현상이 측정·평가에 주는 시사점으로 옳은 것은?'
    choices:
      - '회복은 영구적이므로 NBTI는 무시해도 된다'
      - '측정 지연시간(delay)에 따라 열화량이 달라져, 측정 방법을 표준화하지 않으면 수명을 잘못 평가할 수 있다'
      - '회복은 EM에서만 나타나는 현상이다'
      - '회복 때문에 NBTI 수명은 측정 지연과 무관하게 일정하다'
    answer: 1
    glossary:
      - '측정 지연(measurement delay)｜｜스트레스 제거 후 V_th를 읽기까지 걸린 시간, 회복으로 결과가 달라짐'
    explanation: 'NBTI에는 빠르게 되돌아가는 회복 성분이 있어 측정 지연이 길수록 관측 열화가 작게 보인다. 따라서 측정 지연을 표준화하지 않으면 열화를 과소·과대 평가할 수 있어 on-the-fly나 초고속 측정이 권장된다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '금속 배선에서 electromigration(EM)에 의한 원자 이동을 일으키는 주된 구동력은?'
    choices:
      - '온도 구배에 의한 열확산만'
      - '기계적 외부 압력'
      - '전도 전자가 금속 이온에 운동량을 전달하는 ''전자풍(electron wind)'' 힘'
      - '광자 흡수에 의한 광기전력'
    answer: 2
    glossary:
      - '전자풍(electron wind)｜｜전도 전자의 운동량 전달로 금속 원자를 미는 EM의 주된 힘'
      - 'void｜｜원자 결핍으로 생긴 빈 공간(단선 원인)'
      - 'hillock｜｜원자 축적으로 솟은 돌기(단락 원인)'
    explanation: 'EM은 높은 전류밀도에서 전도 전자가 금속 이온과 충돌해 운동량을 전달하는 전자풍 힘이 직접 정전기력을 능가하여 원자를 음극→양극 방향으로 이동시켜 void(단선)와 hillock(단락)을 만든다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '짧은 배선이 긴 배선보다 EM에 강해지는 ''Blech length(immortality)'' 효과를 가장 잘 설명하는 것은?'
    choices:
      - '짧은 배선은 저항이 작아 전류밀도가 0이 되기 때문'
      - '짧은 배선은 온도가 항상 낮기 때문'
      - '짧은 배선에는 전자풍이 작용하지 않기 때문'
      - '배선이 짧으면 EM으로 쌓인 응력의 역방향 원자 흐름(back-stress)이 전자풍과 균형을 이뤄 순 질량수송이 멈추기 때문'
    answer: 3
    glossary:
      - 'Blech length｜｜(전류밀도×길이)가 임계값 이하면 EM 고장이 안 나는 임계 배선 길이'
      - 'back-stress｜｜원자 축적으로 생긴 응력 구배가 만드는 역방향 원자 흐름'
    explanation: 'EM으로 원자가 한쪽에 쌓이면 응력 구배가 생겨 back-stress에 의한 역확산이 일어난다. 배선이 (j·L)이 임계값 이하로 충분히 짧으면 back-stress가 전자풍과 균형을 이뤄 순 질량수송이 0이 되어 사실상 불멸(immortal)이 된다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'EM 수명을 기술하는 Black 방정식 MTTF = A·j^(-n)·exp(E_a/kT) 에서 각 항의 영향으로 옳은 것은?'
    choices:
      - '전류밀도 j가 클수록, 온도 T가 높을수록 MTTF가 짧아진다'
      - '전류밀도 j가 클수록, 온도 T가 높을수록 MTTF가 길어진다'
      - 'j와 T 모두 MTTF에 영향을 주지 않는다'
      - 'j가 클수록 MTTF는 짧아지지만 T가 높으면 항상 길어진다'
    answer: 0
    glossary:
      - 'MTTF｜｜mean time to failure, 평균 고장시간'
      - 'E_a｜｜활성화에너지, 확산 기구에 따라 달라지는 EM 온도 가속 지표'
    explanation: 'Black 방정식에서 MTTF는 j^(-n)에 비례하므로 전류밀도가 크면 짧아지고, exp(E_a/kT)는 T가 커지면 작아지므로 고온일수록 MTTF가 짧아진다. 두 항 모두 가속 인자로 작용한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'Black 방정식의 전류밀도 지수 n에 대한 설명으로 가장 적절한 것은?'
    choices:
      - '이론적으로 항상 정확히 0.5로 고정된다'
      - 'Black의 원 실험은 n≈2를 보고했고, 이후 보고된 값은 대체로 1~2 범위로 void 핵생성·성장 단계 지배에 따라 달라진다'
      - 'n은 음수여야 물리적으로 타당하다'
      - 'n은 활성화에너지와 동일한 물리량이다'
    answer: 1
    glossary:
