    explanation: '마모로 생성된 산화막 트랩은 trap-assisted tunneling(TAT) 경로를 만들어 SILC를 키운다. 이 누설로 플로팅게이트/전하저장층의 전하가 빠져나가 V_T가 이동하고, P/E 사이클이 많을수록 retention 시간이 대략 지수적으로 짧아진다. SILC는 누설을 늘리는 방향이며, 저장 중에도 작용하고 retention과 직접 관련된다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '다수 P/E 사이클을 거친 NAND 어레이에서 프로그램/소거 상태의 문턱전압(V_T) 분포가 보이는 변화로 가장 옳은 것은?'
    choices:
      - '분포 폭이 좁아지고 상태 간 간격이 넓어져 마진이 커진다'
      - '트랩 충전·SILC로 분포가 넓어지고(tail 발생) 상태 간 read margin이 줄어든다'
      - 'V_T 분포는 사이클과 무관하게 항상 일정하다'
      - '프로그램 상태만 이동하고 소거 상태는 절대 변하지 않는다'
    answer: 1
    glossary:
      - 'V_T 분포｜｜어레이 내 셀들의 문턱전압이 퍼진 통계 분포, 상태 구분 마진을 결정'
      - 'read margin｜｜서로 다른 저장 상태를 안정적으로 구분할 수 있는 전압 여유'
    explanation: '사이클이 누적되면 산화막·계면 트랩의 충방전, 셀 간 불균일한 마모, SILC에 의한 전하손실 때문에 V_T 분포가 넓어지고 꼬리(tail bit)가 생긴다. 그 결과 프로그램/소거 상태 사이의 read margin이 줄어 오류율이 오른다(특히 MLC/TLC에서 심각). 분포가 좁아지거나, 변화가 없거나, 소거 상태만 불변이라는 설명은 틀리다.'
    tags: [engineering, semiconductor]
