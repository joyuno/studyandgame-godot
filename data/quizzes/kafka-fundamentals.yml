    explanation: |
      partition마다 replica 중 하나가 leader. producer/consumer는 leader
      에만 통신. follower들은 leader의 로그를 따라 복제 (catchup). leader
      가 죽으면 ISR(In-Sync Replicas) 중 하나가 새 leader로 선출.
