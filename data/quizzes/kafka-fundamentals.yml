meta:
  category: data-eng
  title: Kafka 기초 — 용어 그래프
  version: 0.1.0
  default_time: 35
  set_time: 900
  tags: [kafka, event-streaming, fundamentals, pkg]

# Prerequisite Knowledge Graph pack — 주니어 1년차 범위.
# 깊이 안 가는 것: ZooKeeper 내부, Kafka Streams stateful 처리,
# Schema Registry, Connect connector 코드. 1년차가 Kafka를 처음 도입할
# 때 알아야 할 broker/topic/partition + consumer group + 메시지 보장
# 수준까지.

questions:

  # ──────────────────────────────────────────────────────────────────
  # ROOT — what is Kafka, why is it not just a message queue
  # ──────────────────────────────────────────────────────────────────
  - type: mcq
    q: 'Apache Kafka는 무엇인가?'
    choices:
      - '데이터베이스'
      - '운영체제'
      - '분산 이벤트 스트리밍 플랫폼 — 메시지를 받아 durable한 로그로 저장하고 여러 소비자가 읽을 수 있게 함'
      - 'CI/CD 도구'
    answer: 2
    glossary:
      - 'durable｜｜디스크에 영속 저장되어 사라지지 않는 성질'
      - '로그(log)｜｜추가만 되는 순차 기록 자료구조'
    explanation: |
      Kafka = LinkedIn에서 시작 (2011 오픈소스화), 현재 Apache 재단 프로젝트.
      "분산 이벤트 스트리밍 플랫폼" 카테고리. 핵심 동작: 메시지를 받아
      디스크에 append-only 로그로 저장 + 여러 소비자가 독립적으로 그 로그를
      읽음. 대규모 실시간 데이터 파이프라인의 중추로 자주 쓰임.
    concept: kafka-is-event-streaming-platform
    prereq: []
    bloom: recall
    tags: [intro]

  - type: mcq
    q: 'Pub-Sub(발행-구독) 메시징 모델의 핵심 특징은?'
    choices:
      - '한 producer가 한 consumer에게만 직접 보냄'
      - 'producer가 채널(topic)에 발행하고 그 채널을 구독한 모든 consumer가 받음'
      - 'consumer가 producer에 polling으로 요청해 받음'
      - 'producer와 consumer는 같은 프로세스여야 함'
    answer: 1
    glossary:
      - 'broker｜｜메시지를 받아 저장·전달하는 Kafka 서버'
      - 'topic｜｜메시지를 분류하는 이름 붙은 채널'
      - 'fan-out｜｜한 메시지를 여러 수신자에게 퍼뜨림'
    explanation: |
      pub-sub = "발행자는 누가 받는지 모름, 구독자는 누가 보냈는지 모름".
      중간에 broker가 채널(Kafka의 topic) 단위로 분리. 한 message가 N명의
      consumer에게 동시에 보일 수 있음 (fan-out). 1:1 직접 전달은 point-
      to-point queue 모델로, pub-sub과 다름.
    concept: pub-sub-model
    prereq: []
    bloom: recall
    tags: [intro, messaging]

  - type: mcq
    q: 'Kafka가 전통 메시지 큐(RabbitMQ 같은 point-to-point 큐)와 다른 핵심 차이는?'
    choices:
      - 'Kafka는 메시지를 읽어도 사라지지 않는 durable log로 저장 — 여러 소비자가 같은 메시지를 독립적으로 다시 읽을 수 있음'
      - 'Kafka는 무료, 메시지 큐는 유료다'
      - 'Kafka는 메모리, 메시지 큐는 디스크에 저장한다'
      - '둘은 같은 것의 다른 이름'
    answer: 0
    glossary:
      - 'RabbitMQ｜｜대표적 전통 메시지 큐 브로커'
      - 'point-to-point｜｜메시지가 한 소비자에게만 가는 큐 모델'
      - 'offset｜｜partition 내 메시지 위치 번호'
      - 'retention｜｜메시지를 보관하는 기간·용량 정책'
    explanation: |
      전통 큐: consumer가 읽으면 메시지가 큐에서 제거됨.
      Kafka: 메시지는 retention 정책으로 정해진 시간/사이즈 동안 그대로 남음.
      Consumer는 자신의 offset(읽은 위치)을 관리하며, 같은 메시지를 다시
      읽거나 새 consumer가 처음부터 읽을 수도 있다. = "queue가 아니라 log".
    concept: kafka-as-log-not-queue
    prereq: [pub-sub-model, kafka-is-event-streaming-platform]
    bloom: understand
    tags: [intro, vs-queue]

  # ──────────────────────────────────────────────────────────────────
  # CLUSTER + BROKER — Kafka 서버 단위
  # ──────────────────────────────────────────────────────────────────
  - type: mcq
    q: 'Kafka에서 "broker"란?'
    choices:
      - 'Kafka 클라이언트 라이브러리'
      - '메시지를 자동 번역하는 서비스'
      - 'Kafka의 관리자 UI'
      - 'Kafka 서버 프로세스 한 개 (메시지를 받아 디스크에 저장하고 소비자에게 제공)'
    answer: 3
    glossary:
      - 'cluster｜｜여러 broker가 모인 묶음'
      - 'producer｜｜메시지를 발행하는 클라이언트'
      - 'consumer｜｜메시지를 읽는 클라이언트'
    explanation: |
      Kafka 서버 1대 = 1 broker. 보통 하나의 host(VM/K8s pod)에 1 broker.
      여러 broker가 모여 cluster를 이룸. 클라이언트(producer/consumer)는
      broker와 TCP로 통신.
    concept: broker
    prereq: [kafka-is-event-streaming-platform]
    bloom: recall
    tags: [cluster]

  - type: mcq
    q: '"Kafka cluster"란?'
    choices:
      - '여러 topic의 집합'
      - 'consumer 그룹의 다른 이름'
      - '여러 broker가 협력해서 함께 동작하는 묶음 (분산 시스템 단위)'
      - '하나의 데이터센터 전체'
    answer: 2
    glossary:
      - 'broker｜｜Kafka 서버 프로세스 한 개'
      - 'replica｜｜partition 데이터의 복제본'
      - 'fail-over｜｜장애 시 다른 노드로 전환'
      - 'replication-factor｜｜partition을 복제할 broker 수'
    explanation: |
      cluster = broker 여러 대가 메타데이터를 공유하며 같이 동작하는 단위.
      replica 분산 / leader 선출 / 장애 시 fail-over가 cluster 안에서 일어남.
      운영 환경은 보통 3 broker 이상(replication-factor=3 권장).
    concept: kafka-cluster
    prereq: [broker]
    bloom: understand
    tags: [cluster]

  # ──────────────────────────────────────────────────────────────────
  # TOPIC + PARTITION — 메시지 분류와 병렬 처리 단위
  # ──────────────────────────────────────────────────────────────────
  - type: mcq
    q: 'Kafka에서 "topic"이란?'
    choices:
      - '메시지의 우선순위 등급'
      - '메시지를 분류하기 위한 이름 붙은 채널 (예: `orders`, `payments`, `user-clicks`)'
      - '클러스터 안의 한 broker'
      - '한 producer의 ID'
    answer: 1
    glossary:
      - 'producer｜｜메시지를 발행하는 클라이언트'
      - 'consumer｜｜메시지를 읽는 클라이언트'
    explanation: |
      topic = 메시지를 카테고리별로 분류하기 위한 명명된 채널. producer는
      어떤 topic에 발행할지 고르고, consumer는 어떤 topic을 구독할지 고름.
      naming convention: lowercase + hyphen 권장 (예: `user-clicks`,
      `payments.failed`).
    concept: topic
    prereq: [pub-sub-model, broker]
    bloom: recall
    tags: [topic]

  - type: mcq
    q: 'Kafka의 "partition"이란?'
    choices:
      - 'topic을 더 작은 단위로 나눈 정렬된 메시지 로그 — 병렬 처리·확장의 기본 단위'
      - 'broker의 디스크 파티션'
      - '메시지의 boolean 분기'
      - 'consumer 그룹의 이름'
    answer: 0
    glossary:
      - 'topic｜｜메시지를 분류하는 이름 붙은 채널'
      - 'broker｜｜Kafka 서버 프로세스 한 개'
      - 'leader｜｜읽기·쓰기를 받는 partition 주 복제본'
    explanation: |
      partition = topic을 N개로 쪼갠 정렬 로그. 한 topic = 여러 partition.
      각 partition은 broker 한 대가 leader로 담당 → partition 수를 늘리면
      병렬 처리량 증대. partition 안에서는 메시지 순서 보장, partition
      간에는 순서 없음.
    concept: partition
    prereq: [topic, broker]
    bloom: understand
    tags: [partition]

  - type: mcq
    q: 'Kafka의 "offset"이란?'
    choices:
      - '클러스터의 IP 주소'
      - '메시지의 timestamp'
      - 'consumer의 ID'
      - 'partition 안에서 각 메시지의 순차 번호 (그 partition 안 위치)'
    answer: 3
    glossary:
      - 'partition｜｜topic을 나눈 정렬 로그 단위'
      - 'timestamp｜｜메시지 생성 시각'
    explanation: |
      partition 내 각 메시지는 0부터 시작하는 단조 증가 정수 offset을 가짐.
      Consumer는 offset 기준으로 "어디까지 읽었는지" 추적. offset은
      partition 단위로만 의미 있음 — 다른 partition의 offset과 비교 X.
    concept: offset
    prereq: [partition]
    bloom: recall
    tags: [offset]

  - type: mcq
    q: 'Kafka의 message record가 보통 가지는 필드는?'
    choices:
      - 'sender, receiver, body — 셋뿐'
      - 'JSON object 하나만 — 다른 필드 없음'
      - 'key, value, timestamp, headers (옵션) + 시스템이 부여하는 partition + offset'
      - 'SQL row와 동일'
    answer: 2
    glossary:
      - 'partition｜｜topic을 나눈 정렬 로그 단위'
      - 'headers｜｜메시지의 부가 메타데이터'
      - 'key｜｜partition 분배에 쓰는 메시지 식별값'
    explanation: |
      Kafka 메시지(record): producer가 보낸 key(bytes, optional) + value
      (bytes, 본문) + timestamp + headers(key-value 메타, optional). 시스템
      이 추가로 partition 번호와 그 partition 내 offset을 부여.
    concept: message-record
    prereq: [partition, offset]
    bloom: recall
    tags: [message, schema]

  # ──────────────────────────────────────────────────────────────────
  # PRODUCER + CONSUMER — 클라이언트
  # ──────────────────────────────────────────────────────────────────
  - type: mcq
    q: 'Kafka의 "producer"란?'
    choices:
      - 'broker의 다른 이름'
      - 'topic에 메시지를 발행하는 클라이언트 애플리케이션 (또는 라이브러리)'
      - '메시지를 자동 생성하는 봇'
      - 'cluster의 관리자'
    answer: 1
    glossary:
      - 'topic｜｜메시지를 분류하는 이름 붙은 채널'
      - 'partition｜｜topic을 나눈 정렬 로그 단위'
      - 'librdkafka｜｜C로 된 Kafka 클라이언트 라이브러리'
    explanation: |
      producer = topic에 메시지를 보내는 측. 라이브러리 형태(예: Java
      KafkaProducer, librdkafka, Python kafka-python)로 제공. producer는
      어떤 topic의 어떤 partition으로 갈지 결정 (또는 key 기반 자동 분배).
    concept: producer
    prereq: [topic]
    bloom: recall
    tags: [client]

  - type: mcq
    q: 'Kafka의 "consumer"란?'
    choices:
      - 'topic에서 메시지를 읽어 처리하는 클라이언트 애플리케이션'
      - '메시지를 소비하지 않는 백업 서비스'
      - 'broker의 자식 프로세스'
      - 'cluster 매니저'
    answer: 0
    glossary:
      - 'topic｜｜메시지를 분류하는 이름 붙은 채널'
      - 'offset｜｜partition 내 메시지 위치 번호'
      - 'polling｜｜클라이언트가 주기적으로 가져오는 방식'
    explanation: |
      consumer = topic을 구독해서 메시지를 가져오는 측. 자신의 offset을
      관리하며 원하는 위치부터 읽을 수 있음 (earliest / latest / 특정
      offset). pull 방식 — broker가 push하지 않고, consumer가 polling.
    concept: consumer
    prereq: [topic, offset]
    bloom: recall
    tags: [client]

  - type: mcq
    q: 'Producer가 key 없이 메시지를 보낼 때 partition 선택 방식의 일반적 동작은?'
    choices:
      - '항상 partition 0번으로 감'
      - 'consumer가 결정'
      - '에러 발생'
      - 'sticky 또는 round-robin 방식으로 partition을 분배 (라이브러리·버전 의존)'
    answer: 3
    glossary:
      - 'partition｜｜topic을 나눈 정렬 로그 단위'
      - 'round-robin｜｜순서대로 돌아가며 분배하는 방식'
      - 'sticky partitioning｜｜한 partition에 몰아 batch 효율 높이기'
      - 'hash｜｜값을 고정 길이 숫자로 변환'
    explanation: |
      key가 없으면 producer 라이브러리는 partition을 자동 분배. 옛 round-
      robin → 현대 Java client(2.4+)는 "sticky partitioning" (한 partition
      에 잠시 몰아 보내 batch 효율↑). key가 있으면 hash(key) % partition_
      count로 결정 → 같은 key는 항상 같은 partition.
    concept: key-based-partitioning
    prereq: [partition, producer, message-record]
    bloom: apply
    tags: [partition, producer]

  - type: ox
    q: 'Producer가 같은 key를 가진 두 메시지를 보내면 둘은 항상 같은 partition에 들어간다.'
    answer: true
    glossary:
      - 'key｜｜partition 분배에 쓰는 메시지 식별값'
      - 'partition｜｜topic을 나눈 정렬 로그 단위'
      - 'hash｜｜값을 고정 길이 숫자로 변환'
    explanation: |
      hash(key) % partition_count 공식이 결정적이므로 같은 key는 항상 같은
      partition으로 감. 이걸 이용해 "같은 사용자의 이벤트는 같은 partition
      → 그 partition 한 곳에서 순서대로 처리" 패턴이 흔함. 단 partition
      수를 늘리면 해시 결과가 바뀌어 기존 key→partition 매핑이 깨짐 (재
      파티션 비용).
    concept: same-key-same-partition
    prereq: [key-based-partitioning, partition]
    bloom: apply
    time: 25
    tags: [partition, key]

  # ──────────────────────────────────────────────────────────────────
  # CONSUMER GROUP — 여러 consumer가 함께 partition을 분담
  # ──────────────────────────────────────────────────────────────────
  - type: mcq
    q: 'Kafka의 "consumer group"이란?'
    choices:
      - '하나의 회사 안 모든 consumer'
      - '같은 메시지를 받는 consumer들'
      - '같은 group ID를 공유하는 consumer들의 묶음 — broker가 partition을 그 안에서 분배해 줌'
      - 'broker 내부 캐시 그룹'
    answer: 2
    glossary:
      - 'consumer｜｜메시지를 읽는 클라이언트'
      - 'partition｜｜topic을 나눈 정렬 로그 단위'
      - 'group ID｜｜같은 묶음 consumer를 묶는 식별자'
    explanation: |
      consumer 시작 시 `group.id` 설정. 같은 group.id를 공유하면 한 묶음.
      Kafka는 한 topic의 partition들을 그 group의 consumer들에게 분배 —
      한 partition은 한 group 내에서 한 consumer만 읽는다 (group 간엔
      독립적, 같은 메시지를 또 받음).
    concept: consumer-group
    prereq: [consumer, partition]
    bloom: understand
    tags: [consumer-group]

  - type: ox
    q: '한 topic의 한 partition은 같은 consumer group 안에서 동시에 두 consumer가 함께 읽을 수 있다.'
    answer: false
    glossary:
      - 'consumer group｜｜partition을 나눠 읽는 consumer 묶음'
      - 'partition｜｜topic을 나눈 정렬 로그 단위'
      - 'idle｜｜할당 partition 없어 노는 상태'
    explanation: |
      안 됨. 한 group 안에서 partition 하나는 정확히 한 consumer가 담당
      (소유). 같은 group의 다른 consumer는 다른 partition을 담당. 만약
      consumer 수가 partition 수보다 많으면 남는 consumer는 idle. 따라서
      병렬도의 상한 = partition 수.
    concept: partition-assignment-exclusive
    prereq: [consumer-group, partition]
    bloom: apply
    time: 25
    tags: [consumer-group, partition]

  - type: mcq
    q: 'Consumer group "rebalance"란?'
    choices:
      - 'broker가 메모리를 정리하는 GC'
      - 'consumer가 합류·이탈하거나 partition이 추가될 때 partition 소유권을 group 안에서 다시 분배하는 과정'
      - '메시지를 partition 간에 옮기는 작업'
      - 'producer가 partition을 새로 만드는 작업'
    answer: 1
    glossary:
      - 'consumer｜｜메시지를 읽는 클라이언트'
      - 'partition｜｜topic을 나눈 정렬 로그 단위'
      - 'GC｜｜불필요 메모리를 회수하는 가비지 컬렉션'
      - 'latency｜｜요청부터 응답까지 지연 시간'
    explanation: |
      consumer가 새로 join하거나, crash로 빠지거나, partition 수가 늘면
      "누가 어떤 partition을 담당할지" 다시 결정해야 함 = rebalance.
      rebalance 동안 consumer들은 메시지 처리 중단 (latency spike). 너무
      자주 일어나면 처리량 저하 → consumer가 안정되게 유지하는 게 중요.
    concept: consumer-group-rebalance
    prereq: [consumer-group, partition-assignment-exclusive]
    bloom: understand
    tags: [consumer-group, rebalance]

  - type: mcq
    q: 'Consumer의 "committed offset"이란?'
    choices:
      - 'consumer가 마지막으로 broker에 등록한 진행 위치 — 재시작 시 이 위치부터 다시 읽기 시작'
      - '메시지의 hash 값'
      - 'producer가 보낸 offset'
