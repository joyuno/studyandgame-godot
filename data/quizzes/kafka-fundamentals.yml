      - 'exactly-once｜｜정확히 1번, 중복 없음'
    explanation: |
      - at-most-once: 최대 1번, 실패 시 손실 가능 (재전송 없음)
      - at-least-once: 최소 1번, 실패 시 재전송으로 중복 가능 (기본·흔함)
      - exactly-once: 정확히 1번, 중복 없음 (Kafka는 별도 설정으로 partition
        안에서 보장 — 그 설정은 다음 문항에서)
