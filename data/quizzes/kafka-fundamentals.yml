    explanation: |
      `enable.idempotence=true` (현대 client 기본값) — producer가 보낸
      메시지에 sequence 번호를 붙여 broker가 중복을 detect. retry로 인한
      중복 기록을 한 partition 안에서 막아줌. exactly-once 의미체계의
