questions:
  - type: mcq
    q: '단결정(single crystal), 다결정(polycrystalline), 비정질(amorphous) 고체의 원자 배열 특성으로 옳은 것은?'
    choices:
      - '단결정은 시료 전체에 걸쳐 장거리 규칙성(long-range order)을 가진다'
      - '다결정은 장거리 규칙성이 전혀 없고 입계(grain boundary)도 없다'
      - '비정질은 장거리 규칙성은 있으나 단거리 규칙성이 없다'
      - '단결정과 비정질은 모두 입계로 나뉜 여러 결정립으로 구성된다'
    answer: 0
    glossary:
      - '장거리 규칙성｜｜원자 배열이 결정 전체에 걸쳐 주기적으로 반복되는 성질'
    explanation: '단결정은 시료 전체에 단일한 격자 방향이 유지되어 장거리 규칙성을 가진다. 다결정은 여러 결정립이 입계로 나뉜 구조이고, 비정질은 단거리 규칙성만 있고 장거리 규칙성이 없다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '비정질 실리콘(a-Si)이 단결정 실리콘과 비교했을 때 보이는 특징으로 옳은 것은?'
    choices:
      - '장거리 규칙성이 완전하여 결함 밀도가 단결정보다 낮다'
      - '원자 배열에 장거리 규칙성이 없어 dangling bond 결함 밀도가 높다'
      - '결정립계가 명확히 존재하여 입계 산란이 지배적이다'
      - '비정질이므로 화학결합 자체가 존재하지 않는다'
    answer: 1
    glossary:
      - 'dangling bond｜｜결합 상대가 없어 비어 있는 미결합 손, 결함 준위를 만든다'
    explanation: '비정질 실리콘은 장거리 규칙성이 없고 결합이 불완전해 dangling bond 같은 결함이 많다. 단거리 규칙성(인접 결합)은 유지되므로 결합 자체는 존재하며, 입계 개념은 다결정에 해당한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '결정학에서 ''단위격자(unit cell)''에 대한 설명으로 가장 적절한 것은?'
    choices:
      - '결정 내에서 항상 원자 1개만 포함하는 단위이다'
      - '거시적 결정 시료 전체를 가리키는 용어이다'
      - '결정 전체를 평행이동만으로 채울 수 있는 반복 최소 단위이다'
      - '단위격자는 항상 입방(cubic) 형태여야 한다'
    answer: 2
    glossary:
      - '격자점｜｜결정의 주기성을 나타내는 추상적 점, 동일한 주변 환경을 가진다'
    explanation: '단위격자는 평행이동(translation)만으로 결정 전체를 빈틈없이 채우는 최소 반복 단위다. 격자점당 원자 수는 구조에 따라 다르고, 모양도 입방에 한정되지 않으며, 시료 전체와는 다른 개념이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '3차원 공간에서 가능한 Bravais 격자의 총 개수는 몇 개인가?'
    choices:
      - '7개'
      - '32개'
      - '230개'
      - '14개'
    answer: 3
    glossary:
      - 'Bravais 격자｜｜격자점들의 평행이동 대칭만으로 분류한 3차원 격자 유형'
    explanation: '3차원 Bravais 격자는 7개 결정계(crystal system)를 격자점 위치(P, I, F, C 등)로 세분하여 총 14개다. 7은 결정계 수, 32는 점군(point group), 230은 공간군(space group) 수에 해당한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '결정구조를 ''격자(lattice) + 기저(basis)''로 기술할 때, 다이아몬드 구조에 대한 올바른 설명은?'
    choices:
      - 'FCC 격자에 원자 2개로 이루어진 기저가 결합된 구조이다'
      - '단순입방(SC) 격자에 원자 1개 기저가 결합된 구조이다'
      - 'BCC 격자에 원자 1개 기저가 결합된 구조이다'
      - '격자 없이 기저만으로 정의되는 비주기적 구조이다'
    answer: 0
    glossary:
      - '기저(basis)｜｜각 격자점에 반복적으로 붙는 원자(들)의 묶음'
    explanation: '다이아몬드 구조는 FCC Bravais 격자의 각 격자점에 (0,0,0)과 (1/4,1/4,1/4)에 놓인 원자 2개짜리 기저를 결합한 것으로 기술된다. 결정구조 = 격자 + 기저라는 일반 정의의 대표 예다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '면심입방(FCC) 단위격자 1개에 포함된 원자의 유효 개수는?'
    choices:
      - '2개'
      - '4개'
      - '8개'
      - '14개'
    answer: 1
    explanation: 'FCC는 꼭짓점 8개(각 1/8 기여 = 1개)와 면 중심 6개(각 1/2 기여 = 3개)를 합쳐 유효 4개의 원자를 갖는다. 14는 격자점 위치 개수(꼭짓점+면심)일 뿐 유효 원자 수가 아니다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '체심입방(BCC) 구조의 단위격자당 유효 원자 수와 배위수(coordination number)는 각각 얼마인가?'
    choices:
      - '원자 4개, 배위수 12'
      - '원자 1개, 배위수 6'
      - '원자 2개, 배위수 8'
      - '원자 8개, 배위수 4'
    answer: 2
    glossary:
      - '배위수｜｜한 원자에 가장 가까이 접하는 이웃 원자의 수'
    explanation: 'BCC는 꼭짓점 8개(합 1개)와 체심 1개로 유효 2개 원자를 가지며, 체심 원자가 8개 꼭짓점 원자와 접하므로 배위수는 8이다. 배위수 12는 FCC/HCP, 4는 다이아몬드에 해당한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'FCC, BCC, 다이아몬드 구조의 원자 충진율(atomic packing factor)을 큰 순서대로 올바르게 나열한 것은?'
    choices:
      - '다이아몬드(0.74) > FCC(0.68) > BCC(0.34)'
      - 'BCC(0.74) > FCC(0.68) > 다이아몬드(0.52)'
      - 'FCC(0.68) > 다이아몬드(0.52) > BCC(0.34)'
      - 'FCC(0.74) > BCC(0.68) > 다이아몬드(0.34)'
    answer: 3
    glossary:
      - '충진율(APF)｜｜단위격자 부피 중 원자(강체 구)가 차지하는 부피 비율'
    explanation: '충진율은 FCC가 0.74(최조밀), BCC가 0.68, 다이아몬드는 배위수 4의 개방 구조라 0.34로 가장 낮다. 따라서 FCC > BCC > 다이아몬드 순이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'FCC 구조에서 원자들은 면 대각선을 따라 서로 접한다. 격자상수 a와 원자 반지름 r의 관계로 옳은 것은?'
    choices:
      - 'a = 4r/√2 = 2√2·r'
      - 'a = 2r'
      - 'a = 4r/√3'
      - 'a = 8r/√3'
    answer: 0
    explanation: 'FCC는 면 대각선(길이 √2·a)을 따라 원자 4r이 늘어서므로 √2·a = 4r, 즉 a = 4r/√2 = 2√2·r이다. a=2r은 단순입방, a=4r/√3은 BCC(공간 대각선 접촉)에 해당한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '실리콘(Si)과 게르마늄(Ge)이 갖는 다이아몬드 결정구조의 특징으로 옳은 것은?'
    choices:
      - '각 원자가 6개의 인접 원자와 결합하는 단순입방 구조이다'
      - '각 원자가 4개의 인접 원자와 정사면체(tetrahedral) 공유결합을 한다'
      - '배위수가 12로 최조밀 충전 구조이다'
      - '이온결합으로만 이루어진 NaCl형 구조이다'
    answer: 1
    glossary:
      - '정사면체 결합｜｜한 원자가 사면체 꼭짓점 방향의 4개 이웃과 이루는 공유결합'
    explanation: '다이아몬드 구조는 각 원자가 sp3 혼성에 의해 4개의 이웃과 정사면체 방향 공유결합을 하며 배위수가 4다. Si, Ge가 이 구조를 가지며, 배위수 12(최조밀)나 NaCl형 이온결합과는 다르다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '결정면을 밀러 지수(Miller index)로 표기하는 절차로 옳은 것은?'
    choices:
      - '축 절편을 그대로 정수비로 적으면 된다'
      - '면의 법선벡터 길이를 직접 지수로 사용한다'
      - '축 절편을 격자상수 단위로 구하고, 그 역수를 취해 정수비로 환산한다'
      - '절편의 제곱을 취한 뒤 합이 1이 되도록 규격화한다'
    answer: 2
    glossary:
      - '밀러 지수｜｜결정면·방향을 정수 (hkl)로 나타내는 표기법'
    explanation: '밀러 지수는 면이 각 결정축을 자르는 절편을 격자상수 단위로 구한 뒤 그 역수를 취하고 최소 정수비로 환산해 (hkl)로 표기한다. 절편을 그대로 쓰거나 제곱하는 방식이 아니다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '어떤 결정면이 x, y, z 축을 각각 격자상수 단위로 1, 2, 3에서 자른다. 이 면의 밀러 지수는?'
    choices:
      - '(1 2 3)'
      - '(3 2 1)'
      - '(1 1 1)'
      - '(6 3 2)'
    answer: 3
    explanation: '절편 1,2,3의 역수는 1, 1/2, 1/3이고, 공통분모 6을 곱해 정수비로 만들면 6,3,2가 되어 (632)이다. 역수를 취하지 않으면 안 되며 (123)은 흔한 오답이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '결정면이 z축에 평행하고 x축을 1, y축을 1에서 자를 때(즉 z 절편이 무한대), 밀러 지수는?'
    choices:
      - '(1 1 0)'
      - '(1 1 1)'
      - '(0 0 1)'
      - '(1 1 ∞)'
    answer: 0
    explanation: '어떤 축에 평행하면 절편이 무한대이고 그 역수는 0이 된다. 절편 1,1,∞의 역수는 1,1,0이므로 (110)이다. 밀러 지수에는 무한대를 직접 쓰지 않는다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '밀러 지수 표기에서 막대 표기(예: (1 1̄ 0))와 중괄호 표기 {hkl}의 의미로 옳은 것은?'
    choices:
      - '막대는 면의 두께를, {hkl}은 단일 특정 면을 뜻한다'
      - '막대(bar)는 음의 절편을, {hkl}은 대칭으로 등가인 면들의 집합을 뜻한다'
      - '막대는 양의 절편을, {hkl}은 결정 방향을 뜻한다'
      - '막대와 {hkl}은 모두 결정 방향 [hkl]을 가리킨다'
    answer: 1
    explanation: '지수 위의 막대는 해당 축의 음의 절편을 나타내고, {hkl}은 대칭에 의해 동등한 면들의 집합(예: 입방계에서 {100}은 6개 면)을 의미한다. 방향은 대괄호 [hkl]·<hkl>로 따로 표기한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '입방정(cubic) 결정에서 (hkl) 면들 사이의 면간 거리 d와 격자상수 a의 관계로 옳은 것은?'
    choices:
      - 'd = a·(h² + k² + l²)'
      - 'd = a·√(h + k + l)'
      - 'd = a / √(h² + k² + l²)'
      - 'd = a / (h + k + l)'
    answer: 2
    glossary:
      - '면간 거리｜｜평행한 같은 종류의 결정면들 사이의 수직 간격'
    explanation: '입방계에서 면간 거리는 d = a/√(h²+k²+l²)이다. 지수가 클수록(고차 면) 면간 거리가 작아진다. 따라서 (111)보다 (200)의 면간 거리가 더 작다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'FCC 구조에서 (100) 면의 면밀도(단위 면적당 원자 수) 계산에 대한 설명으로 옳은 것은?'
    choices:
      - '(100) 면에는 원자가 1개뿐이라 면밀도는 1/a²이다'
      - '(100) 면밀도는 a와 무관하게 일정하다'
      - '면밀도는 항상 단위격자당 원자 수와 같다'
      - '(100) 면 한 변 a²의 정사각형에 유효 원자 2개가 있어 면밀도는 2/a²이다'
    answer: 3
    glossary:
      - '면밀도｜｜특정 결정면의 단위 면적당 원자(중심) 개수'
    explanation: 'FCC의 (100) 면은 정사각형 a×a에 꼭짓점 4개(각 1/4=1개)와 면 중심 1개를 합쳐 유효 2개 원자를 포함하므로 면밀도는 2/a²이다. 면밀도는 a²에 반비례해 a와 무관하지 않다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '격자상수 a = 5.43 Å인 실리콘(다이아몬드 구조, 단위격자당 원자 8개)의 체적 원자 밀도(원자 수/cm³)에 가장 가까운 값은? (1 Å = 1e-8 cm)'
    choices:
      - '약 5.0 × 10²² /cm³'
      - '약 5.0 × 10²⁰ /cm³'
      - '약 5.0 × 10¹⁸ /cm³'
      - '약 5.0 × 10²⁵ /cm³'
    answer: 0
    explanation: '밀도 N = 8 / a³ = 8 / (5.43e-8 cm)³ ≈ 8 / (1.60e-22 cm³) ≈ 5.0×10²² /cm³. 실리콘의 잘 알려진 원자 밀도 약 5×10²² /cm³와 일치한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '플랑크가 도입한 에너지 양자 가설(E = nhν)이 해결한 고전 흑체복사 이론의 핵심 문제는?'
    choices:
      - '장파장에서 복사 강도가 0으로 수렴하지 않던 문제'
      - 'Rayleigh-Jeans 법칙이 단파장(고진동수)에서 복사 강도가 무한대로 발산하는 자외선 파탄(ultraviolet catastrophe)'
      - '흑체가 복사를 전혀 방출하지 않던 문제'
      - '복사 스펙트럼이 온도와 무관하다는 모순'
    answer: 1
    glossary:
      - '자외선 파탄｜｜고전 이론이 고진동수에서 복사 에너지를 무한대로 예측하는 오류'
    explanation: '고전 Rayleigh-Jeans 법칙은 단파장에서 에너지 밀도가 무한대로 발산하는 자외선 파탄을 낳았다. 플랑크는 에너지가 hν 단위로 양자화된다고 가정해 실험과 일치하는 분포를 유도했다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '플랑크 상수 h ≈ 6.63×10⁻³⁴ J·s를 사용할 때, 진동수가 2배인 광자(빛 알갱이)의 에너지는 어떻게 변하는가?'
    choices:
      - '변하지 않는다(에너지는 진동수와 무관)'
      - '1/2로 줄어든다'
      - '2배가 된다'
      - '4배가 된다'
    answer: 2
    explanation: '광자 한 개의 에너지는 E = hν로 진동수에 정비례한다. 따라서 진동수가 2배이면 에너지도 2배다. 파장으로 쓰면 E = hc/λ이므로 파장에는 반비례한다.'
