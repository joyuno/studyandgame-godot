questions:
  - type: mcq
    q: 'Six Sigma 프로젝트에서 CTQ(Critical to Quality)에 대한 설명으로 가장 옳은 것은?'
    choices:
      - '프로젝트 팀이 임의로 정한 내부 생산성 목표치이다'
      - '공정의 모든 입력변수를 빠짐없이 나열한 목록이다'
      - '고객의 요구(VOC)를 측정 가능한 품질 특성으로 변환한 핵심 지표이다'
      - '프로젝트 종료 후 재무 효과를 검증하는 회계 항목이다'
    answer: 2
    glossary:
      - 'VOC｜｜Voice of Customer, 고객의 요구·기대를 수집한 입력'
    explanation: 'CTQ는 고객의 소리(VOC)를 측정·관리 가능한 정량적 품질특성으로 번역한 것으로, 무엇을 개선해야 고객 만족이 오르는지를 규정한다. 내부 목표나 단순 변수 목록, 재무검증 항목과는 다르다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'DMAIC의 Define 단계에서 작성하는 핵심 산출물로 가장 적절한 것은?'
    choices:
      - '관리도(control chart)로 공정 안정성을 상시 모니터링한 결과'
      - '다중회귀로 도출한 핵심인자(vital few) 회귀식'
      - 'FMEA로 산정한 위험우선순위지수(RPN) 개선표'
      - '프로젝트 차터(charter): 문제 정의, 범위, 목표, 일정, 팀을 명시'
    answer: 3
    glossary:
      - 'DMAIC｜｜Define-Measure-Analyze-Improve-Control, Six Sigma 개선 절차'
    explanation: 'Define 단계의 대표 산출물은 프로젝트 차터로, 문제·범위·목표·일정·팀·기대효과를 합의한다. 관리도는 Control, 회귀식은 Analyze/Improve, FMEA 개선은 Improve 단계에 주로 해당한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '한 제품이 4개 공정을 순차로 통과하며 각 단계의 first pass yield(FPY)가 0.95, 0.90, 0.98, 0.99일 때 rolled throughput yield(RTY)에 가장 가까운 값은?'
    choices:
      - '0.829 (각 FPY의 곱)'
      - '0.99 (최댓값 단계 기준)'
      - '0.955 (단순 산술평균)'
      - '0.90 (최솟값 단계 기준)'
    answer: 0
    glossary:
      - 'FPY｜｜First Pass Yield, 한 단계를 재작업 없이 한 번에 통과한 비율'
    explanation: 'RTY는 각 단계 FPY의 곱이다. 0.95×0.90×0.98×0.99≈0.829로, 모든 단계를 무결점으로 통과할 확률을 뜻한다. 평균이나 최대/최소 단일값은 다단계 누적 효과를 반영하지 못한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '단위당 결함기회(opportunity)가 5개인 제품 200개를 검사해 총 결함 20개가 나왔다. DPMO(defects per million opportunities)는?'
    choices:
      - '100,000'
      - '20,000'
      - '4,000'
      - '40,000'
    answer: 1
    glossary:
      - 'opportunity｜｜한 단위에서 결함이 발생할 수 있는 독립적 기회의 수'
    explanation: 'DPMO = (총결함 / (단위수×단위당기회)) × 1,000,000 = 20/(200×5)×1e6 = 20/1000×1e6 = 20,000. 결함을 ''기회'' 단위로 정규화해 서로 다른 제품·공정을 같은 척도로 비교할 수 있다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '어떤 공정의 RTY가 약 0.905일 때, 단위당 결함수 DPU(defects per unit)의 근사치로 가장 옳은 것은? (Poisson 근사 사용)'
    choices:
      - 'DPU ≈ 0.905 (RTY와 동일)'
      - 'DPU ≈ 1.105 (RTY의 역수)'
      - 'DPU ≈ 0.10 (−ln RTY)'
      - 'DPU ≈ 0.095 (1−RTY)'
    answer: 2
    glossary:
      - 'DPU｜｜Defects Per Unit, 단위당 평균 결함 수'
    explanation: '결함이 Poisson을 따른다고 보면 RTY = e^(−DPU)이므로 DPU = −ln(RTY) = −ln(0.905) ≈ 0.0998 ≈ 0.10. 1−RTY(=0.095)는 결함이 드물 때만 근사가 비슷하지만 정의상으로는 −ln(RTY)가 정확하다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '신공정이 기존 평균 수율 μ₀=92%보다 ''향상되었는지''를 검정할 때 일반적인 가설 설정으로 옳은 것은?'
    choices:
      - 'H0: μ > 92%,  H1: μ = 92%'
      - 'H0: μ = 92%,  H1: μ ≠ 92% (양측, 향상 여부 무관)'
      - 'H0: μ ≥ 92%,  H1: μ < 92% (좌단측 검정)'
      - 'H0: μ ≤ 92%,  H1: μ > 92% (우단측 검정)'
    answer: 3
    glossary:
      - '단측검정｜｜효과의 방향을 한쪽으로만 검정하는 방식'
    explanation: '귀무가설에는 항상 등호(=, ≤, ≥)가 포함되고, ''향상=증가''를 입증하려는 주장은 대립가설에 둔다. 따라서 H0: μ≤92%, H1: μ>92%의 우단측 검정이 맞다. 입증하려는 효과는 H1에 둔다는 원칙이 핵심이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '가설검정에서 1종 오류(Type I)와 2종 오류(Type II)에 대한 설명으로 옳은 것은?'
    choices:
      - '1종 오류는 H0가 참인데 기각한 것이고 확률은 α이다'
      - '1종 오류는 H1이 참인데 기각하지 못한 것이고 확률은 α이다'
      - '2종 오류는 H0가 참인데 기각한 것이고 확률은 β이다'
      - '1종과 2종 오류 확률의 합은 항상 1이다'
    answer: 0
    glossary:
      - 'β｜｜2종 오류 확률, 거짓 귀무가설을 채택할 확률'
    explanation: '1종 오류는 참인 H0를 잘못 기각(α=유의수준), 2종 오류는 거짓인 H0를 기각하지 못함(β)이다. α와 β는 독립적으로 정의되며 합이 1이 되지는 않는다. 검정력은 1−β이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '표본크기를 고정한 채 유의수준 α를 0.05에서 0.01로 낮추면 일반적으로 일어나는 일은?'
    choices:
      - 'α와 β가 동시에 감소한다'
      - 'β(2종 오류 확률)가 증가하여 검정력이 떨어진다'
      - 'β가 감소하여 검정력이 올라간다'
      - '검정력은 α와 무관하므로 변하지 않는다'
    answer: 1
    glossary:
      - '기각역｜｜귀무가설을 기각하는 검정통계량의 영역'
    explanation: '표본크기가 고정이면 기각역을 좁히는(α↓) 만큼 거짓 H0를 기각하기 어려워져 β가 커지고 검정력(1−β)은 낮아진다. α와 β를 동시에 줄이려면 표본크기 n을 늘려야 한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'p-value의 정의로 가장 정확한 것은?'
    choices:
      - '귀무가설이 참일 확률'
      - '대립가설이 참일 확률'
      - 'H0가 참이라는 가정하에 관측값 이상으로 극단적인 결과가 나올 확률'
      - '검정에서 1종 오류를 범할 사전 확률인 유의수준'
    answer: 2
    glossary:
      - '극단적인 결과｜｜대립가설 방향으로 더 치우친 검정통계량 값'
    explanation: 'p-value는 ''H0가 참이라는 조건하에서'' 관측된 통계량만큼 또는 그보다 극단적인 결과가 나올 확률이다. H0/H1이 참일 확률이 아니며, 유의수준 α는 사전에 정한 판정 기준값으로 p-value와 구분된다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '유의수준 α=0.05에서 검정 결과 p-value=0.03을 얻었다. 올바른 결론은?'
    choices:
      - 'p>α이므로 귀무가설을 기각한다'
      - 'p<α이므로 귀무가설을 채택한다'
      - 'p와 α가 비슷하므로 판단을 보류하고 결론을 내릴 수 없다'
      - 'p<α이므로 귀무가설을 기각하고 대립가설을 채택한다'
    answer: 3
    explanation: '판정 규칙은 p ≤ α이면 H0 기각이다. 0.03 < 0.05이므로 H0를 기각하고 H1을 채택한다. p>α일 때만 ''기각하지 못함(채택)''이며, p가 α에 가깝다고 판단을 보류하지는 않는다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '검정력(power)에 대한 설명으로 옳은 것은?'
    choices:
      - '대립가설이 참일 때 귀무가설을 올바르게 기각할 확률, 즉 1−β이다'
      - '1종 오류를 범하지 않을 확률, 즉 1−α이다'
      - '표본평균이 모평균과 일치할 확률이다'
      - '유의수준을 높일수록 항상 감소한다'
    answer: 0
    glossary:
      - '효과크기｜｜귀무가설과 실제 모수 간 차이의 크기'
    explanation: '검정력은 H1이 참일 때 H0를 옳게 기각할 확률 1−β로, 실제 효과를 탐지하는 능력이다. 효과크기·표본크기·α가 클수록 커진다. 1−α는 신뢰수준에 해당하며 검정력과 다르다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '다른 조건이 동일할 때 검정력을 높이는 요인으로 옳지 않은 것은?'
    choices:
      - '표본크기 n을 늘린다'
      - '유의수준 α를 0.05에서 0.01로 낮춘다'
      - '탐지하려는 효과크기가 더 크다'
      - '모집단 표준편차 σ가 더 작다'
    answer: 1
    explanation: '검정력은 n↑, 효과크기↑, σ↓일 때 증가한다. 반면 α를 낮추면(엄격히 하면) 기각이 어려워져 검정력은 오히려 감소한다. 따라서 ''α를 낮춘다''가 검정력을 높이는 요인이 아니다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '두 독립 공정라인 A, B의 평균 수율이 같은지 비교할 때 적절한 검정은?'
    choices:
      - '1표본 t검정으로 A의 평균이 목표값과 같은지 검정'
      - '대응표본 t검정으로 같은 단위의 전후를 비교'
      - '2표본(독립표본) t검정으로 두 평균의 차이를 검정'
      - '카이제곱 적합도 검정'
    answer: 2
    glossary:
      - '독립표본｜｜서로 짝지어지지 않은 별개의 두 집단 표본'
    explanation: '서로 독립인 두 집단의 평균 차이를 보는 상황이므로 독립 2표본 t검정이 맞다. 1표본은 하나의 평균을 기준값과 비교할 때, 대응표본은 짝지어진 관측치(전후)일 때 쓴다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '2표본 t검정에서 두 집단의 분산이 크게 다르다고 판단될 때 권장되는 방법은?'
    choices:
      - '합동분산(pooled variance) t검정을 그대로 사용한다'
      - '표본을 합쳐 1표본 t검정으로 전환한다'
      - '분산이 다르면 t검정을 쓸 수 없으므로 평균 비교를 포기한다'
      - 'Welch의 t검정(분산 비동질을 가정한 t)을 사용한다'
    answer: 3
    glossary:
      - '합동분산｜｜두 집단이 같은 분산을 갖는다고 보고 가중평균한 분산 추정치'
    explanation: '등분산 가정이 깨지면 합동분산 대신 각 집단 분산을 따로 쓰는 Welch t검정이 적절하다(자유도는 근사식으로 보정). 표본을 합치거나 검정을 포기할 필요는 없다. 등분산 여부는 F검정·Levene 검정으로 점검한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '대응표본(paired) t검정을 적용하기에 가장 적절한 상황은?'
    choices:
      - '동일한 30개 웨이퍼에 대해 공정개선 전·후 결함수를 측정해 비교'
      - '서로 다른 두 공장에서 무작위로 뽑은 제품 평균을 비교'
      - '한 라인의 평균 수율이 95%인지 단일 기준과 비교'
      - '세 가지 촉매의 평균 반응수율을 동시에 비교'
    answer: 0
    glossary:
      - '대응(paired)｜｜같은 개체에서 짝지어 얻은 두 측정값'
    explanation: '대응표본 t검정은 같은 개체(또는 짝지어진 쌍)에서 두 조건(전·후)을 측정해 차이를 검정한다. 동일 웨이퍼의 개선 전·후 비교가 전형적 예다. 서로 다른 집단 비교는 독립 2표본, 단일 기준 비교는 1표본, 셋 이상은 ANOVA다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '일원분산분석(one-way ANOVA)에서 F검정 통계량의 구성으로 옳은 것은?'
    choices:
      - 'F = 처리 내 평균제곱(MSW) / 처리 간 평균제곱(MSB)'
      - 'F = 처리 간 평균제곱(MSB) / 처리 내 평균제곱(MSW)'
      - 'F = 총제곱합(SST) / 자유도'
      - 'F = 처리 간 제곱합(SSB) / 처리 내 제곱합(SSW)'
    answer: 1
    glossary:
      - 'MSB｜｜처리 간 평균제곱(between)'
      - 'MSW｜｜처리 내(오차) 평균제곱(within)'
    explanation: 'F = MSB/MSW로, 처리 간(집단 간) 변동을 처리 내(오차) 변동으로 나눈 비율이다. 평균제곱(MS)은 제곱합을 자유도로 나눈 값이며, 제곱합 자체의 비가 아니다. F가 클수록 집단 평균 차이가 유의하다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '처리(집단) 4개, 각 집단 표본 6개(총 N=24)인 일원분산분석에서 SSB=120, SSW=180일 때 F값은?'
    choices:
      - 'F = (120/4) / (180/24) = 30 / 7.5 = 4.0'
      - 'F = 120 / 180 ≈ 0.67'
      - 'F = (120/3) / (180/20) = 40 / 9 ≈ 4.44'
      - 'F = (180/3) / (120/20) = 60 / 6 = 10.0'
    answer: 2
    glossary:
      - '자유도｜｜독립적으로 변할 수 있는 값의 개수'
    explanation: '처리 간 자유도 = k−1 = 3, 처리 내(오차) 자유도 = N−k = 24−4 = 20. MSB=120/3=40, MSW=180/20=9, F=40/9≈4.44. 자유도를 k와 N로 잘못 쓰면 오답이 된다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '이원분산분석(two-way ANOVA)에서 교호작용(interaction) 효과가 유의하다는 것의 의미로 옳은 것은?'
    choices:
      - '두 요인의 주효과가 모두 0이다'
      - '두 요인이 서로 완전히 독립이며 효과가 단순히 더해진다'
      - '오차분산이 0이어서 모형이 자료를 완벽히 설명한다'
      - '한 요인의 효과가 다른 요인의 수준에 따라 달라진다'
