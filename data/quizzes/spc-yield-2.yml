    q: 'Gage R&R 결과에서 구별범주수(ndc, number of distinct categories)와 측정시스템 분산의 영향에 대한 설명으로 옳은 것은?'
    choices:
      - 'ndc는 클수록 나쁘며, AIAG는 ndc≤2를 권장한다'
      - 'AIAG는 ndc≥5를 권장하며, ndc는 부품변동을 측정변동으로 나눈 정도(분해능)를 나타낸다'
      - '측정시스템 분산이 커지면 관측되는 총분산이 작아진다'
      - '측정 분산은 부품 간 분산과 독립이 아니므로 분리할 수 없다'
    answer: 1
    glossary:
      - 'ndc(구별범주수)｜｜측정시스템이 부품 변동을 구분해 나눌 수 있는 범주의 수(클수록 좋음)'
    explanation: '관측 총분산 σ²_total=σ²_part+σ²_R&R로 측정 분산이 더해진다(가산적). 측정 분산이 커지면 총분산이 부풀려져(2번 오답) 공정능력이 실제보다 나쁘게 보인다. ndc는 측정시스템이 부품들을 구별해낼 수 있는 범주의 수로 ndc=1.41·(σ_part/σ_R&R)로 계산하며, AIAG는 ndc≥5를 적합 기준으로 권장한다(클수록 좋음).'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '로트별 합격판정 샘플링의 OC곡선(Operating Characteristic curve)과 위험에 대한 설명으로 옳은 것은?'
    choices:
      - '생산자 위험(α)은 불량률이 나쁜(LTPD) 로트가 합격될 확률이다'
      - '소비자 위험(β)은 양품(AQL) 로트가 불합격될 확률이다'
      - '생산자 위험(α)은 양품(AQL) 로트가 불합격될 확률, 소비자 위험(β)은 불량(LTPD) 로트가 합격될 확률이다'
      - '표본 크기 n을 늘리면 OC곡선이 완만해져 판별력이 떨어진다'
    answer: 2
    glossary:
      - 'OC곡선｜｜로트 불량률 대비 합격확률을 나타낸 곡선'
      - 'AQL｜｜합격품질수준(생산자가 보호받길 원하는 좋은 품질)'
      - 'LTPD｜｜로트 허용 불량률(소비자가 거부하길 원하는 나쁜 품질)'
    explanation: 'OC곡선은 로트 불량률 p에 대한 합격확률 Pa(p)를 나타낸다. 생산자 위험 α는 합격수준(AQL)의 좋은 로트가 불합격될 확률(1종 오류), 소비자 위험 β는 거부수준(LTPD)의 나쁜 로트가 합격될 확률(2종 오류)이다. n을 늘리면 OC곡선이 가팔라져 판별력이 좋아진다(4번 오답).'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '단일 샘플링 검사에서 표본크기 n과 합격판정개수 c를 조정할 때 OC곡선 변화로 옳은 것은?'
    choices:
      - 'c를 고정하고 n을 줄이면 OC곡선이 가팔라져 판별력이 좋아진다'
      - 'n과 c를 모두 0으로 하면 이상적 OC곡선(완전 판별)에 가까워진다'
      - 'OC곡선의 형태는 n, c와 무관하게 로트 크기 N에만 의존한다'
      - 'n을 고정하고 c를 키우면 OC곡선이 위로 올라가 같은 불량률에서 합격확률이 높아진다'
    answer: 3
    glossary:
      - '합격판정개수 c｜｜표본 중 허용되는 최대 불량 개수(이하면 로트 합격)'
    explanation: '합격확률 Pa(p)=Σ_{x=0}^{c} C(n,x)p^x(1-p)^(n-x)이므로, n을 고정하고 c(허용 불량 개수)를 키우면 합격이 쉬워져 OC곡선 전체가 위로 이동, 동일 p에서 합격확률이 커진다(소비자 보호 약화). n을 늘릴수록(줄이는 게 아님) OC곡선이 가팔라져 판별력이 좋아진다(2번 오답). 이상적 OC곡선은 100% 전수검사에 해당한다.'
    tags: [engineering, semiconductor]
