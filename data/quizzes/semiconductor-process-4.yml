  source: '대학 학부 전공 표준 범위(공개 강의목차·교재 기반, exa 리서치 + 멀티에이전트 생성). 특정 상용 교재 본문 미복제.'

questions:
  - type: mcq
    q: '1가(q=1.6×10^-19 C) 이온 빔을 빔전류 1 mA로 100 cm^2 면적에 100초간 주입했다면, 도즈는 약 얼마인가?'
    choices:
      - '약 6.25×10^12 ions/cm^2'
      - '약 6.25×10^16 ions/cm^2'
      - '약 6.25×10^14 ions/cm^2'
      - '약 1.6×10^15 ions/cm^2'
    answer: 2
    glossary:
      - '1가 이온｜｜전하수 1, 전하량이 전자전하 q와 같은 이온'
    explanation: 'Φ = I·t/(q·A) = (1×10^-3 A × 100 s)/(1.6×10^-19 C × 100 cm^2) = 0.1 C /(1.6×10^-17 C·cm^2) = 6.25×10^15/100 = 6.25×10^14 ions/cm^2. 따라서 약 6.25×10^14 ions/cm^2이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '이온주입 농도 분포(가우시안 근사)에서 사정거리 Rp와 종방향 straggle ΔRp의 의미로 옳은 것은?'
    choices:
      - 'Rp는 분포의 표준편차, ΔRp는 최대 농도 깊이이다'
      - 'Rp는 횡방향(lateral) 퍼짐, ΔRp는 표면 농도이다'
      - 'Rp는 도즈, ΔRp는 빔 에너지이다'
      - 'Rp는 농도가 최대가 되는 평균 투영 깊이, ΔRp는 그 깊이 주변 분포의 표준편차(폭)이다'
    answer: 3
    glossary:
      - 'Rp(투영 사정거리)｜｜빔 방향 평균 정지 깊이(농도 최대 깊이)'
      - 'ΔRp(종방향 straggle)｜｜Rp 주변 분포의 표준편차, 깊이 방향 퍼짐'
    explanation: '가우시안 근사 n(x)=n_peak·exp(-(x-Rp)^2/(2ΔRp^2))에서 Rp(투영 사정거리)는 농도가 최대가 되는 평균 깊이, ΔRp(종방향 straggle)는 그 주변 분포의 표준편차로 분포 폭을 나타낸다. 표준편차/최대깊이를 뒤바꾼 보기 2, 횡방향·도즈·에너지로 혼동한 보기 3·4는 틀리다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '도즈 Φ, straggle ΔRp인 가우시안 주입 분포의 피크 농도 n_peak를 옳게 나타낸 것은?'
    choices:
      - 'n_peak = Φ / (√(2π)·ΔRp)'
      - 'n_peak = Φ·√(2π)·ΔRp'
      - 'n_peak = Φ / Rp'
      - 'n_peak = Φ·ΔRp / Rp'
    answer: 0
    glossary:
      - '피크 농도｜｜깊이 방향 농도 분포의 최댓값(Rp 위치의 농도)'
    explanation: '가우시안 분포를 깊이에 대해 적분하면 면적이 도즈 Φ가 되어야 하므로, n_peak·√(2π)·ΔRp = Φ에서 n_peak = Φ/(√(2π)·ΔRp)이다. 즉 같은 도즈라도 straggle이 작을수록(샤프할수록) 피크 농도가 높다. 나머지 보기는 정규화 조건을 만족하지 않는다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '같은 표적(실리콘)에 주입할 때 사정거리 Rp의 일반적 경향으로 옳은 것은?'
    choices:
      - '주입 에너지가 높을수록 Rp가 작아진다'
      - '주입 에너지가 높을수록 Rp가 커지고, 같은 에너지에서는 가벼운 이온(예: B)이 무거운 이온(예: As)보다 Rp가 크다'
      - '이온 질량과 무관하게 Rp는 에너지에만 의존한다'
      - '같은 에너지에서 무거운 이온일수록 Rp가 더 크다'
    answer: 1
    glossary:
      - '핵정지｜｜표적 원자핵과의 충돌로 인한 에너지 손실(무거운 이온에서 큼)'
    explanation: '에너지가 클수록 이온이 더 깊이 정지하므로 Rp가 증가한다. 또 가벼운 이온(붕소)은 핵정지 효과가 작아 더 깊이 들어가 Rp가 크고, 무거운 이온(비소)은 핵충돌 손실이 커 얕게 멈춘다. 보기 2·4는 경향이 반대이고, 보기 3은 질량 의존성을 무시한 오류다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '이온주입 시 핵정지(nuclear stopping)와 전자정지(electronic stopping)의 차이로 옳은 것은?'
    choices:
      - '핵정지는 전자와의 충돌이고, 전자정지는 원자핵과의 충돌이다'
      - '둘 다 격자 손상을 동일하게 유발하며 구분할 필요가 없다'
      - '핵정지는 표적 원자핵(차폐된 핵)과의 탄성 충돌로 큰 각도 산란·격자 손상을 일으키고, 전자정지는 전자와의 비탄성 상호작용으로 점성 마찰처럼 거의 직진하며 에너지를 잃는다'
      - '전자정지는 항상 핵정지보다 큰 각도의 산란을 일으킨다'
    answer: 2
    glossary:
      - '핵정지(nuclear stopping)｜｜원자핵과 탄성 충돌, 격자 손상 유발'
      - '전자정지(electronic stopping)｜｜전자와 비탄성 상호작용, 점성 마찰형 손실'
      - '탄성/비탄성｜｜운동에너지 보존 여부에 따른 충돌 구분'
    explanation: '핵정지는 차폐된 표적 원자핵과의 탄성 충돌로 큰 각 산란과 변위(격자 손상)를 만들고, 저에너지·무거운 이온에서 우세하다. 전자정지는 전자 구름과의 비탄성 상호작용으로 점성 항력처럼 작용해 거의 산란 없이 에너지를 잃으며 고에너지·가벼운 이온에서 우세하다. 보기 2는 둘을 뒤바꿨고, 손상은 주로 핵정지가 유발한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '이온 에너지(속도)에 따른 정지 메커니즘의 우세 영역에 대한 설명으로 옳은 것은?'
    choices:
      - '저에너지에서 전자정지, 고에너지에서 핵정지가 우세하다'
      - '에너지와 무관하게 항상 핵정지만 작용한다'
      - '전자정지는 이온 속도에 반비례한다'
      - '저에너지(저속) 영역에서는 핵정지가, 고에너지(고속) 영역에서는 전자정지가 우세하다'
    answer: 3
    glossary:
      - 'Lindhard-Scharff｜｜저·중에너지에서 전자정지가 속도에 비례함을 기술한 모델'
    explanation: '저속에서는 이온이 핵과 오래 상호작용해 핵정지가 우세하고, 고속에서는 전자와의 비탄성 손실(전자정지)이 지배한다. 저에너지·중간 영역에서 전자정지는 이온 속도에 대략 비례한다(Lindhard-Scharff). 보기 2·4는 경향이 반대이고, 보기 3은 둘 다 작용함을 무시한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '주입 이온 경로를 따라 격자 손상이 가장 크게 누적되는 깊이는 대략 어디인가?'
    choices:
      - '이온이 멈추는 사정거리 Rp 부근'
      - '표면 바로 아래(이온 입사 직후) 영역'
      - '표적 두께의 정확히 절반 지점'
      - '손상은 깊이와 무관하게 균일하다'
    answer: 0
    glossary:
      - '변위(displacement)｜｜격자 원자가 충돌로 제자리에서 밀려나 결함을 만드는 것'
    explanation: '고에너지 초기에는 전자정지가 우세해 손상이 작고, 이온이 감속되면서 핵정지가 커져 변위가 집중된다. 따라서 격자 손상의 최대치는 대략 이온이 멈추는 Rp 부근에서 발생한다. 표면 직후·중간점·균일 분포는 모두 틀리다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '이온주입에서 채널링(channeling) 효과에 대한 설명으로 옳은 것은?'
    choices:
      - '채널링은 이온이 표면에서 모두 반사되어 전혀 주입되지 않는 현상이다'
      - '이온이 결정의 저밀도 격자 통로(채널)를 따라 진행하면 충돌이 적어 예상보다 훨씬 깊이 박혀 분포 꼬리가 길어진다'
      - '채널링은 비정질 표적에서만 발생한다'
      - '채널링이 일어나면 사정거리가 항상 짧아진다'
    answer: 1
    glossary:
      - '채널링(channeling)｜｜결정 축 정렬 시 이온이 격자 통로를 따라 깊이 진행하는 현상'
      - '채널링 테일｜｜농도 분포 깊은 쪽에 길게 끌리는 꼬리'
    explanation: '단결정 표적을 특정 결정축에 정렬해 주입하면 이온이 원자가 드문 채널을 따라가며 핵정지가 줄어, 깊은 위치까지 박혀 분포에 긴 꼬리(채널링 테일)가 생긴다. 비정질에는 채널이 없어 발생하지 않으며(보기 3 오류), 반사·항상 짧아짐(보기 2·4)도 틀리다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '채널링을 억제하기 위해 실제 공정에서 사용하는 방법으로 옳지 않은 것은?'
    choices:
      - '웨이퍼를 빔에 대해 약 7도 틸트(tilt)하고 회전(rotation)을 주어 주축 정렬을 피한다'
      - '표면에 얇은 스크린 산화막을 두어 입사 방향을 무작위화한다'
      - '웨이퍼를 결정 주축에 정확히 0도로 완벽 정렬하여 채널링을 줄인다'
      - '사전 비정질화(pre-amorphization) 주입으로 표면을 비정질로 만들어 채널을 없앤다'
    answer: 2
    glossary:
      - '틸트(tilt)｜｜빔과 결정축 사이의 입사 경사각(보통 약 7도)'
      - '사전 비정질화｜｜주입 전 표면을 비정질화해 채널을 제거하는 기법'
      - '스크린 산화막｜｜주입 전 표면에 두는 얇은 산화막'
    explanation: '주축에 0도로 정렬하면 오히려 채널링이 극대화된다. 실제로는 ~7도 틸트+회전, 스크린 산화막, 사전 비정질화(예: Si/Ge 주입)로 채널을 깨거나 입사각을 흩어 채널링을 억제한다. 따라서 ''0도 완벽 정렬''은 채널링 억제법이 아니라 그 반대다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '주입에 의한 비정질화(amorphization)에 대한 설명으로 옳은 것은?'
    choices:
      - '어떤 도즈에서도 비정질화는 일어나지 않는다'
      - '가벼운 이온이 무거운 이온보다 같은 도즈에서 비정질화를 더 잘 일으킨다'
      - '비정질화는 온도가 높을수록(고온 주입) 더 쉽게 일어난다'
      - '주입 손상이 임계 결함 밀도를 넘어 격자 무질서가 누적되면 표층이 결정성을 잃고 비정질층으로 변한다'
    answer: 3
    glossary:
      - '비정질화(amorphization)｜｜손상 누적으로 결정질이 무질서한 비정질로 변하는 것'
      - '임계 결함 밀도｜｜비정질화가 일어나는 손상 누적 한계'
      - '동적 회복｜｜주입 중 열에 의해 손상이 부분적으로 치유되는 현상'
    explanation: '핵충돌로 생긴 변위 손상이 누적되어 임계 결함 밀도를 넘으면 표층이 결정 질서를 잃고 비정질층이 된다. 무거운 이온은 핵정지가 커 같은 도즈에서 손상·비정질화를 더 잘 일으킨다(보기 3 반대). 고온 주입은 동적 회복(annealing)으로 비정질화를 오히려 억제한다(보기 4 반대).'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '이온주입 후 어닐링(annealing)을 수행하는 주된 두 가지 목적으로 가장 옳은 것은?'
    choices:
      - '주입 손상(결함)을 회복시키고, 격자 사이의 도펀트를 치환자리로 이동시켜 전기적으로 활성화한다'
      - '웨이퍼 표면에 산화막을 두껍게 성장시키고 도즈를 늘린다'
      - '도펀트를 모두 증발시켜 농도를 낮춘다'
      - '포토레지스트를 경화시켜 다음 주입을 준비한다'
    answer: 0
    glossary:
      - '어닐링｜｜주입 후 열처리로 손상 회복·도펀트 활성화를 수행하는 공정'
      - '치환자리(substitutional)｜｜도펀트가 격자 정위치를 차지해 캐리어를 내는 상태'
      - '전기적 활성화｜｜도펀트가 실제 캐리어를 만들어 도전에 기여하게 되는 것'
    explanation: '어닐링은 (1) 주입으로 생긴 격자 손상·비정질층을 재결정화로 회복시키고, (2) 격자간(interstitial) 위치의 도펀트를 치환(substitutional) 자리로 옮겨 전기적으로 활성화(캐리어 기여)한다. 산화막 성장·증발·레지스트 경화는 어닐링의 주목적이 아니다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '도펀트의 전기적 활성화에 대한 설명으로 옳은 것은?'
    choices:
      - '주입된 도펀트는 종류·농도와 무관하게 항상 100% 활성화된다'
      - '치환자리에 들어간 도펀트만 캐리어를 내며, 고체 용해도(solid solubility)를 초과한 도펀트는 활성화되지 못하고 석출·클러스터가 될 수 있다'
      - '격자간(interstitial) 위치의 도펀트가 치환자리보다 더 잘 활성화된다'
      - '활성화율은 도즈를 늘릴수록 항상 비례해 증가한다'
    answer: 1
    glossary:
      - '고체 용해도｜｜특정 온도에서 결정에 치환 형태로 녹아들 수 있는 도펀트 최대 농도'
      - '클러스터｜｜비활성 도펀트가 뭉쳐 캐리어를 내지 못하는 상태'
    explanation: '캐리어를 내는 것은 치환자리 도펀트뿐이며, 어닐 온도에서의 고체 용해도를 넘는 양은 활성화되지 못하고 석출·클러스터로 비활성화된다. 따라서 활성화율은 100%도, 도즈에 항상 비례하지도 않는다. 격자간 도펀트는 활성화에 기여하지 않는다(보기 3 오류).'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '주입 후 어닐링에서 관찰되는 과도 증속 확산(TED, Transient Enhanced Diffusion)의 원인으로 옳은 것은?'
