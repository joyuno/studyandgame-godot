    explanation: '마그네트론은 자력선이 폐곡선(터널)을 이루는 영역에 전자가 갇혀 플라즈마 밀도가 국소적으로 높아진다. 그 띠를 따라 이온 충격이 집중되어 race-track 모양의 침식이 발생하며, 이는 타깃 이용률(target utilization)을 낮추는 요인이다. 가장자리 전계·기판 회전·냉각수와는 무관하다.'
    tags: [engineering, semiconductor]
