  tags: [engineering, semiconductor, device]
  source: '대학 학부 전공 표준 범위(공개 강의목차·교재 기반, exa 리서치 + 멀티에이전트 생성). 특정 상용 교재 본문 미복제.'

questions:
  - type: mcq
    q: '정공 연속 방정식 ∂p/∂t = −(1/q)·∂J_p/∂x + (G_p − R_p) 에서 각 항에 대한 설명으로 옳지 않은 것은?'
    choices:
      - '∂p/∂t는 단위부피당 정공 농도의 시간 변화율이다'
      - '−(1/q)·∂J_p/∂x는 전류 발산에 의한 알짜 유입/유출을 나타낸다'
      - '정상상태에서는 ∂J_p/∂x 항이 항상 0이어야 한다'
      - '(G_p − R_p)는 생성에서 재결합을 뺀 알짜 생성률이다'
    answer: 2
    glossary:
      - '전류 발산｜｜∂J/∂x, 한 점에서 전류가 모이거나 흩어지는 정도'
    explanation: '정상상태(∂p/∂t=0)에서는 −(1/q)∂J_p/∂x + (G_p−R_p)=0이 성립할 뿐, 전류 발산 항 자체가 항상 0인 것은 아니다(재결합과 균형을 이룸). 나머지 세 설명은 연속 방정식 각 항의 올바른 해석이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '비평형 상태(예: 광조사)에서 도입하는 준 페르미 준위(quasi-Fermi level)에 관한 설명으로 옳은 것은?'
    choices:
      - '전자와 정공에 대해 항상 동일한 단일 준위로 표현된다'
      - '평형 상태에서만 정의되는 양이다'
      - '캐리어 농도와 무관하게 항상 진성 준위 E_i와 같다'
      - '전자(E_Fn)와 정공(E_Fp)에 각각 별도의 준위를 정의해 각 캐리어 농도를 기술한다'
    answer: 3
    glossary:
      - '준 페르미 준위｜｜비평형 상태에서 전자·정공 농도를 평형식 형태로 표현하기 위해 캐리어별로 도입한 유효 페르미 준위'
    explanation: '비평형에서 전자·정공은 각자 평형 분포에 가깝지만 서로 평형은 아니므로, 각 캐리어에 대해 E_Fn, E_Fp를 따로 정의해 n=n_i·exp((E_Fn−E_i)/kT), p=n_i·exp((E_i−E_Fp)/kT)로 쓴다. 평형에서는 둘이 합쳐져 하나의 E_F가 된다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '비평형에서 전자·정공 준 페르미 준위 분리가 E_Fn − E_Fp = ΔE_F일 때 np 곱은? (평형값 n_i²)'
    choices:
      - 'np = n_i² · exp(ΔE_F / kT)'
      - 'np = n_i²'
      - 'np = n_i² · exp(−ΔE_F / kT)'
      - 'np = n_i² · ΔE_F / kT'
    answer: 0
    explanation: 'n=n_i·exp((E_Fn−E_i)/kT), p=n_i·exp((E_i−E_Fp)/kT)를 곱하면 np=n_i²·exp((E_Fn−E_Fp)/kT)=n_i²·exp(ΔE_F/kT). 순방향 주입처럼 ΔE_F>0이면 np>n_i²(과잉), 평형(ΔE_F=0)이면 np=n_i²로 환원된다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '계단형 PN 접합의 내장전위는 V_bi=(kT/q)·ln(N_A·N_D/n_i²)이다. N_A와 N_D를 각각 10배씩(곱은 100배) 늘리면 상온에서 V_bi는 약 얼마나 증가하는가? (kT/q≈0.0259 V, ln10≈2.30)'
    choices:
      - '약 0.012 V 증가'
      - '약 0.119 V 증가'
      - '약 0.060 V 증가'
      - '약 0.26 V 증가'
    answer: 1
    glossary:
      - '내장전위｜｜열평형 PN 접합 양단에 형성되는 전위차(접촉 전위)'
      - '계단형 접합｜｜도핑이 접합면에서 급격히 바뀌는 이상화된 접합'
    explanation: 'ΔV_bi=(kT/q)·ln(100)=0.0259×ln(100)=0.0259×4.605≈0.119 V. ln 안의 곱이 100배이므로 ln100=2·ln10을 쓴다. 도핑을 곱으로 100배 올리면 V_bi는 약 119 mV 증가한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'PN 접합의 공핍 근사(depletion approximation)에서 공간전하영역(SCR)에 대한 설명으로 옳은 것은?'
    choices:
      - '공핍층 안은 가동 캐리어로 가득 차 전기장이 0이다'
      - '공핍층 밖(중성 영역)에 강한 전기장이 집중된다'
      - '공핍층 안에는 가동 캐리어가 거의 없고, 이온화된 도펀트의 고정 전하만 남는다'
      - '공핍층의 알짜 전하는 항상 양(+)이다'
    answer: 2
    glossary:
      - '공핍 근사｜｜공간전하영역 내 가동 캐리어를 0으로, 경계 밖은 완전 중성으로 단순화하는 모델'
      - '공간전하영역｜｜접합 부근에서 가동 캐리어가 비워지고 고정 이온 전하만 남은 영역'
    explanation: '공핍 근사에서는 SCR 내부의 가동 캐리어를 무시하고, n쪽 양이온(N_D⁺)·p쪽 음이온(N_A⁻)의 고정 전하만 남는다고 본다. 전기장은 SCR 안에 집중되고 중성 영역에서는 0이며, 알짜 전하는 영역 전체로는 0(전하 중성)이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '전하 중성 조건 N_A·x_p=N_D·x_n을 만족하는 계단형 접합에서, p쪽 도핑이 n쪽보다 훨씬 높다면(N_A ≫ N_D) 공핍층은 어떻게 분포하는가?'
    choices:
      - 'p쪽으로 더 깊게 확장된다(x_p > x_n)'
      - '양쪽으로 정확히 같게 확장된다(x_n = x_p)'
      - '공핍층이 전혀 형성되지 않는다'
      - 'n쪽으로 더 깊게 확장된다(x_n > x_p)'
    answer: 3
    explanation: '전하 중성 N_A·x_p=N_D·x_n에서 도핑이 높은 쪽일수록 폭이 좁다. N_A≫N_D이면 x_n/x_p=N_A/N_D≫1이므로 공핍층은 저농도 n쪽으로 훨씬 깊게 뻗는다(x_n>x_p). 즉 공핍층은 lightly doped 쪽으로 치우친다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '고종횡비(high-aspect-ratio) 트렌치 내벽에 균일한 두께로 막을 입혀야 할 때, 일반적으로 단차피복(step coverage)이 가장 우수한 증착 방식은?'
    choices:
      - 'ALD(Atomic Layer Deposition)'
      - '스퍼터링(sputtering) 등 PVD'
      - '열증발(thermal evaporation)'
      - '전자빔 증발(e-beam evaporation)'
    answer: 0
    glossary:
      - 'step coverage｜｜트렌치 옆벽·바닥과 평탄부의 막 두께 비. 클수록 등각성이 좋음'
      - 'self-limiting reaction｜｜표면이 포화되면 더 이상 반응이 진행되지 않는 자기제한 반응'
    explanation: 'ALD는 자기제한(self-limiting) 표면반응으로 1주기당 1단분자층 이하만 증착되어 깊은 트렌치·비아에서도 거의 100% 등각 피복을 준다. PVD(스퍼터링·증발)는 line-of-sight 방식이라 그림자 효과로 고종횡비 구조에서 단차피복이 나쁘다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'ALD가 원자층 수준의 두께 제어를 가능하게 하는 핵심 메커니즘으로 가장 옳은 것은?'
    choices:
      - '전구체 유량(flux)에 비례해 막 두께가 연속적으로 증가한다'
      - '두 전구체를 번갈아 펄스로 공급하고 사이를 퍼지하여 표면에서만 자기제한 반응을 일으킨다'
      - '두 전구체를 동시에 공급해 기상에서 빠르게 반응시킨다'
      - '타깃을 이온으로 스퍼터링해 원자를 기판에 응축시킨다'
    answer: 1
    glossary:
      - '전구체(precursor)｜｜막을 형성하기 위해 공급하는 반응성 기체 원료'
      - '퍼지(purge)｜｜반응 후 잔류 기체를 불활성 기체로 밀어내는 단계'
    explanation: 'ALD는 두 전구체를 시간적으로 분리해 펄스/퍼지를 반복하므로 기상에서 겹치지 않고 표면 반응이 포화되면 멈춘다. 따라서 주기 수가 두께를 결정한다. 유량 비례 성장은 CVD, 동시 공급 기상반응도 CVD, 타깃 스퍼터링은 PVD다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'PECVD(Plasma-Enhanced CVD)를 일반 열 CVD 대신 사용하는 가장 주된 이점은?'
    choices:
      - '막 두께를 원자 단위로 정확히 제어한다'
      - '막의 순도가 항상 PVD보다 높아진다'
      - '플라즈마가 반응을 활성화해 더 낮은 기판 온도에서 증착할 수 있다'
      - 'line-of-sight 특성으로 평탄부만 선택 증착한다'
    answer: 2
    glossary:
      - '패시베이션(passivation)｜｜소자 표면을 보호하는 절연막 형성 공정'
    explanation: 'PECVD는 플라즈마가 전구체를 활성화하므로 열 CVD보다 낮은 온도(예: 금속배선 위 패시베이션)에서도 증착이 가능하다. 원자 단위 제어는 ALD, line-of-sight는 PVD의 특징이며 PECVD 순도가 항상 더 높다고 말할 수 없다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '다음 중 CVD 계열 공정으로 통상 형성하는 막이 아닌 것은?'
    choices:
      - 'SiO2(실리콘 산화막)'
      - 'Si3N4(실리콘 질화막)'
      - 'polysilicon(다결정 실리콘)'
      - '단결정 Si 기판(잉곳에서 자른 웨이퍼 원판)'
    answer: 3
    glossary:
      - 'epitaxy(에피택시)｜｜기판 결정 방향을 이어받아 단결정 박막을 성장시키는 것'
      - 'Czochralski｜｜용융 실리콘에서 단결정 잉곳을 끌어올려 성장시키는 방법'
    explanation: 'SiO2, Si3N4, polysilicon, 텅스텐 등은 CVD로 흔히 증착한다. 그러나 단결정 웨이퍼 원판 자체는 Czochralski 단결정 성장으로 잉곳을 키워 절단해 만드는 것이지 CVD 박막 증착물이 아니다. (CVD 에피택시는 기판 위 단결정 박막 성장으로 별개 개념)'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '0.18 um 이하 첨단 배선에서 Al 대신 Cu를 주 배선 금속으로 채택한 핵심 이유로 가장 옳은 것은?'
    choices:
      - 'Cu가 Al보다 비저항이 낮고 일렉트로마이그레이션 내성이 좋아 RC 지연을 줄인다'
      - 'Cu는 SiO2와 자발적으로 결합해 배리어가 필요 없다'
      - 'Cu는 건식 식각(RIE)으로 패터닝이 매우 쉽다'
      - 'Cu는 Si로의 확산이 전혀 없어 접합을 오염시키지 않는다'
    answer: 0
    glossary:
      - '일렉트로마이그레이션(electromigration)｜｜전류로 금속 원자가 이동해 보이드/힐록을 만들어 단선시키는 현상'
      - 'RC 지연｜｜배선 저항 R과 정전용량 C에 의한 신호 전파 지연'
    explanation: 'Cu는 Al보다 비저항이 낮고 일렉트로마이그레이션 수명이 길어 미세 배선의 RC 지연·신뢰성에 유리하다. 다만 Cu는 식각이 어려워 다마신 공정을 쓰고, Si/유전체로 빠르게 확산해 Ta/TaN 배리어가 반드시 필요하다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'Cu 배선의 듀얼 다마신(dual-damascene) 공정 흐름으로 가장 옳은 것은?'
    choices:
      - 'Cu막을 전면 증착 후 RIE로 식각해 배선 패턴을 남긴다'
      - '유전체에 트렌치·비아를 먼저 식각하고 배리어/시드 후 Cu로 채운 뒤 CMP로 평탄화한다'
      - 'Al 배선을 만든 뒤 표면만 Cu로 도금한다'
      - 'Cu를 ALD로 한 층씩 쌓아 배선 전체를 형성한다'
    answer: 1
    glossary:
      - 'CMP｜｜화학적·기계적 연마로 표면을 평탄화하는 공정'
      - 'seed layer(시드층)｜｜전기도금 전류를 흘리기 위한 얇은 Cu 종자막'
    explanation: 'Cu는 건식 식각이 어렵기 때문에 유전체에 홈(트렌치)과 비아를 먼저 파고 배리어·시드층을 올린 뒤 전기도금으로 Cu를 채우고 잉여 Cu를 CMP로 제거한다. 이것이 다마신(상감) 방식이며 Al의 식각 패터닝과 반대다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '콘택홀(contact hole)을 채우는 플러그 금속으로 텅스텐(W)을 CVD로 흔히 쓰는 이유로 가장 옳은 것은?'
    choices:
      - 'W이 Cu보다 비저항이 낮기 때문'
      - 'W이 실리콘과 옴 접촉을 형성하지 않기 때문'
      - 'W-CVD가 좁고 깊은 콘택홀을 보이드 없이 잘 채우고 열적 안정성이 높다'
      - 'W은 상온에서 증발해 자연히 홀에 응축되기 때문'
    answer: 2
    glossary:
      - 'plug(플러그)｜｜층간 콘택/비아 구멍을 채워 상하 배선을 잇는 금속 기둥'
      - 'WF6｜｜W-CVD에 쓰는 텅스텐 전구체 기체'
    explanation: 'WF6 환원 기반 W-CVD는 좁은 콘택홀을 등각으로 보이드 없이 메우고 후속 고온 공정에 안정적이어서 콘택 플러그에 표준적이다. W의 비저항은 Cu보다 높고, 옴 접촉은 하부 실리사이드가 담당한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '소스/드레인이나 게이트 위에 TiSi2·NiSi 같은 실리사이드(silicide)를 형성하는 주된 목적은?'
    choices:
      - '게이트 산화막 두께를 늘리기 위해'
      - '채널 도핑 농도를 높이기 위해'
      - '기판을 절연시키기 위해'
      - '콘택 저항과 소스/드레인·게이트의 면저항을 낮춰 옴 접촉을 개선하기 위해'
    answer: 3
    glossary:
      - 'silicide(실리사이드)｜｜금속과 Si가 반응해 형성된 저저항 화합물(TiSi2, NiSi 등)'
      - 'salicide｜｜self-aligned silicide, 자기정렬 실리사이드 공정'
      - '면저항(sheet resistance)｜｜박막 단위 정사각형당 저항, 단위 Ω/sq'
    explanation: '실리사이드는 금속과 실리콘이 반응한 저저항 화합물로, 소스/드레인·게이트의 면저항과 금속/실리콘 콘택 저항을 크게 낮춰 좋은 옴 접촉을 만든다(salicide 공정). 산화막 두께·채널 도핑·기판 절연과는 무관하다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '금속 배선의 일렉트로마이그레이션(EM) 수명을 다루는 Black 식에서, 평균고장시간 MTTF가 의존하는 핵심 인자로 옳게 묶인 것은?'
