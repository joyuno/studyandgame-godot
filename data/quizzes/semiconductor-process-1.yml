meta:
  title: '반도체공정 1'
  version: '1.0.0'
  default_time: 45
  set_time: 1750
  tags: [engineering, semiconductor, process]
  source: '대학 학부 전공 표준 범위(공개 강의목차·교재 기반, exa 리서치 + 멀티에이전트 생성). 특정 상용 교재 본문 미복제.'

questions:
  - type: mcq
    q: '다음 중 일반적으로 분류하는 반도체 ''8대 공정''에 직접 포함되지 않는 것은?'
    choices:
      - '결정 성장(Crystal Growth)'
      - '산화(Oxidation)'
      - '포토(Photolithography)'
      - '금속 배선(Metallization)'
    answer: 0
    glossary:
      - 'EDS｜｜Electrical Die Sorting, 웨이퍼 상태에서 칩의 양·불량을 전기적으로 선별하는 검사'
    explanation: '8대 공정은 보통 산화·포토·식각·증착(박막)·이온주입(도핑)·금속배선·EDS(테스트)·패키징으로 분류한다. 잉곳을 키우는 결정 성장은 웨이퍼 ''제조'' 단계로, 웨이퍼 위에서의 칩 제조 공정인 8대 공정에는 포함되지 않는다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '반도체 제조에서 전공정(Front-End)과 후공정(Back-End)을 가르는 기준으로 가장 적절한 것은?'
    choices:
      - '도핑 농도가 높은 공정(전)과 낮은 공정(후)으로 나눈다'
      - '웨이퍼 위에 회로를 형성하는 단계(전)와 칩을 잘라 패키징·검사하는 단계(후)로 나눈다'
      - '고온 공정(전)과 저온 공정(후)으로 나눈다'
      - '국내 공정(전)과 해외 공정(후)으로 나눈다'
    answer: 1
    glossary:
      - '다이싱｜｜완성된 웨이퍼를 개별 칩(die) 단위로 절단하는 공정'
    explanation: '전공정은 웨이퍼 위에 트랜지스터·배선을 만드는 산화~금속배선까지를, 후공정은 웨이퍼를 칩 단위로 분리(다이싱)해 패키징·테스트하는 단계를 말한다. 온도·도핑 농도는 분류 기준이 아니다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '무어의 법칙(Moore''s Law)에 대한 설명으로 가장 정확한 것은?'
    choices:
      - '트랜지스터 동작 속도가 매년 2배씩 빨라진다는 법칙'
      - '웨이퍼 가격이 18개월마다 절반으로 떨어진다는 법칙'
      - '집적회로 위 트랜지스터 집적도가 약 18~24개월마다 2배로 증가한다는 경험칙'
      - '소자의 누설 전류가 세대마다 2배씩 증가한다는 법칙'
    answer: 2
    glossary:
      - '경험칙｜｜이론적 증명이 아니라 관찰된 추세를 일반화한 규칙'
    explanation: '무어의 법칙은 1965년 Gordon Moore가 제시한 경험칙으로, 칩에 집적되는 트랜지스터 수가 약 2년(18~24개월)마다 2배가 된다는 것이다. 물리 법칙이 아니라 산업 발전 추세를 기술한 것이며, 속도·가격은 직접적 정의가 아니다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '고전적 Dennard 스케일링이 1/k 비율로 치수와 전압을 함께 줄일 때, 단위 면적당 전력밀도가 거의 일정하게 유지되는 이유로 옳은 것은?'
    choices:
      - '트랜지스터 수가 줄어들어 총 전력이 감소하기 때문'
      - '동작 주파수가 1/k로 낮아지기 때문'
      - '공급 전압을 일정하게 유지하기 때문'
      - '치수가 1/k이 되어 집적 밀도는 k^2배 늘지만, 소자당 전력이 1/k^2로 줄어 상쇄되기 때문'
    answer: 3
    glossary:
      - 'Dennard 스케일링｜｜치수와 전압을 함께 축소해 전력밀도를 일정하게 유지하던 고전적 미세화 규칙'
    explanation: 'Dennard 스케일링에서 길이·폭·전압을 모두 1/k로 줄이면 집적 밀도는 k^2배 증가하지만 소자당 소비 전력은 1/k^2로 감소해 단위 면적당 전력밀도가 일정하게 유지된다. 전압을 일정하게 두면(스케일링 종료 후) 전력밀도가 급증한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'MOSFET 채널 길이를 계속 줄일 때 나타나 스케일링을 어렵게 만드는 ''단채널 효과(short-channel effect)''의 대표적 현상이 아닌 것은?'
    choices:
      - '이동도(μ_n)가 무한히 커져 전류가 감소하는 현상'
      - 'DIBL(Drain-Induced Barrier Lowering)'
      - '문턱전압(V_T) 롤오프'
      - '펀치스루(punch-through) 증가'
    answer: 0
    glossary:
      - 'DIBL｜｜드레인 전압이 채널 장벽을 낮춰 V_T가 감소하는 단채널 효과'
      - '펀치스루｜｜소스·드레인 공핍층이 맞닿아 게이트 제어를 잃는 현상'
    explanation: '단채널 효과로는 DIBL, V_T 롤오프(채널이 짧아질수록 V_T 감소), 펀치스루, 누설 증가 등이 나타난다. ''이동도가 무한히 커진다''는 것은 물리적으로 성립하지 않는 오답이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '다층 배선 집적회로 제조에서 화학적 기계적 평탄화(CMP)를 수행하는 가장 핵심적인 이유는?'
    choices:
      - '웨이퍼 두께를 얇게 만들어 칩 무게를 줄이기 위해'
      - '표면 단차(topography)를 제거해 상위 층 노광의 초점 심도(DOF) 한계 내에서 패터닝하기 위해'
      - '도핑 농도를 균일하게 만들기 위해'
      - '산화막의 절연 내압을 높이기 위해'
    answer: 1
    glossary:
      - 'CMP｜｜Chemical Mechanical Planarization, 슬러리와 패드로 표면을 갈아 평탄화하는 공정'
      - 'DOF｜｜Depth of Focus, 노광 시 상이 선명하게 맺히는 초점 방향 허용 범위'
    explanation: '다층 배선을 쌓으면 표면 단차가 커지는데, 노광 장비의 초점 심도(DOF)가 매우 얕아 단차가 있으면 상위 층 패턴이 흐려진다. CMP로 글로벌 평탄화를 이뤄야 미세 패턴을 정확히 형성할 수 있다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '1959년 Jean Hoerni가 제안한 평면(planar) 기술이 집적회로 제조의 토대가 된 결정적 이유는?'
    choices:
      - '트랜지스터를 입체적으로 쌓아 3차원 집적을 처음 구현했다'
      - '실리콘 대신 갈륨비소를 사용하게 했다'
      - '웨이퍼 표면을 산화막으로 덮은 상태에서 선택적 확산·배선을 가능케 해 다수 소자를 한 칩에 집적할 수 있게 했다'
      - '포토리소그래피를 사용하지 않고 소자를 만들 수 있게 했다'
    answer: 2
    glossary:
      - 'planar 기술｜｜산화막으로 덮인 평탄 표면에서 선택 확산·배선을 수행하는 IC 제조 방식'
    explanation: 'planar 기술은 SiO2 보호막 위에 마스크 패턴을 만들고 창(window)을 통해 선택적으로 도핑·배선하는 방식으로, 평탄한 표면에서 반복 공정을 적용해 다수 소자를 한 칩에 집적하는 IC 제조의 기반이 되었다. 3D 적층이나 GaAs 도입과는 무관하다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '초크랄스키(Czochralski, CZ)법으로 단결정 실리콘 잉곳을 성장시키는 과정에 대한 설명으로 옳은 것은?'
    choices:
      - '다결정 봉을 통째로 가열해 통째로 단결정으로 만든다'
      - '기상의 실리콘을 기판 위에 증착해 결정을 키운다'
      - '용융액 없이 고체 분말을 압축해 결정을 만든다'
      - '석영 도가니의 용융 실리콘에 종자결정(seed)을 담갔다 회전시키며 천천히 끌어올려 단결정을 키운다'
    answer: 3
    glossary:
      - '종자결정(seed)｜｜원하는 결정 방위를 결정의 출발점으로 제공하는 작은 단결정'
      - '잉곳/boule｜｜원기둥 형태로 성장시킨 단결정 덩어리'
    explanation: 'CZ법은 석영 도가니 속 용융 실리콘에 정해진 방위의 종자결정을 접촉시킨 뒤 회전시키며 서서히 끌어올려, 종자결정의 결정 방위를 따라 큰 단결정 잉곳(boule)을 성장시키는 방법이다. 증착·분말 압축과는 무관하다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'CZ법으로 성장한 실리콘에 비교적 높은 농도(약 10^17~10^18 cm^-3)의 산소가 포함되는 주된 원인은?'
    choices:
      - '용융 실리콘이 석영(SiO2) 도가니를 미량 용해시켜 산소가 melt로 유입되기 때문'
      - '성장 분위기의 산소 가스가 결정에 직접 결합하기 때문'
      - '종자결정 자체에 산소가 많기 때문'
      - '다결정 원료에 산소가 의도적으로 첨가되기 때문'
    answer: 0
    glossary:
      - 'melt｜｜도가니 안에서 녹아 있는 용융 실리콘'
    explanation: 'CZ 성장에서 용융 실리콘이 석영(SiO2) 도가니 내벽을 조금씩 녹이면서 산소가 melt로 들어가 결정에 ~10^17~10^18 cm^-3 수준으로 혼입된다. 이 산소는 내부 게터링과 결정 강화에 활용되기도 한다. 성장은 보통 불활성/진공 분위기라 산소 가스 결합이 주원인은 아니다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '플로팅 존(Float Zone, FZ)법이 CZ법보다 훨씬 높은 순도·저(低)산소 결정을 얻을 수 있는 근본적 이유는?'
    choices:
      - '성장 온도가 훨씬 낮아 불순물 확산이 적기 때문'
      - '용융 영역이 도가니에 닿지 않고 떠 있어 도가니 오염이 없고, 좁은 용융대 이동으로 대역정제(zone refining)가 일어나기 때문'
      - '성장 속도가 매우 빨라 불순물이 들어갈 시간이 없기 때문'
      - '산소를 진공으로 모두 빨아내기 때문'
    answer: 1
    glossary:
      - '대역정제(zone refining)｜｜좁은 용융대를 한쪽으로 이동시켜 불순물을 끝으로 몰아 순도를 높이는 기법'
    explanation: 'FZ법은 다결정 봉의 좁은 영역만 RF로 녹여 용융대가 도가니 없이 떠 있는 상태로 봉을 따라 이동시킨다. 도가니 오염이 없어 산소가 매우 낮고(<~10^16 cm^-3), 용융대가 불순물을 끌고 이동하는 대역정제 효과로 고순도·고저항 결정을 얻는다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '다음 중 FZ 실리콘보다 CZ 실리콘이 일반적인 IC 제조용 웨이퍼로 선호되는 이유로 가장 적절한 것은?'
    choices:
      - 'FZ보다 저항률이 높아서'
      - 'FZ보다 항상 순도가 높아서'
      - '대구경(300mm) 결정 성장이 쉽고, 산소에 의한 내부 게터링과 기계적 강도 향상 이점이 있어서'
      - '도펀트 축방향 분포가 완전히 균일해서'
    answer: 2
    glossary:
      - '내부 게터링｜｜벌크 내 산소석출물로 금속 불순물을 포획해 소자 영역을 깨끗하게 하는 기법'
    explanation: 'CZ는 대구경 잉곳 성장이 용이하고 저렴하며, 포함된 산소가 내부 게터링과 열응력 저항(전위 고정)에 도움을 준다. FZ가 순도·저항률은 더 높지만 대구경화가 어렵고 비싸 고전압 파워소자 등 특수 용도에 주로 쓰인다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'MOS 공정에서 게이트 산화막 계면 특성(계면 결함밀도) 관점에서 <100> 방위 웨이퍼가 <111>보다 선호되는 주된 이유는?'
    choices:
      - '<100> 면이 식각 속도가 가장 빨라서'
      - '<100> 웨이퍼가 더 단단해서'
      - '<111>은 단결정으로 만들 수 없어서'
      - '<100> 면의 표면 결합(미결합손) 밀도가 낮아 Si-SiO2 계면 트랩 밀도와 고정전하가 더 작기 때문'
    answer: 3
    glossary:
      - '계면 트랩(D_it)｜｜Si-SiO2 경계의 미결합손에 의한 전기적 결함 준위'
      - '고정전하｜｜산화막 내 계면 근처에 고정된 양전하'
    explanation: '<100> 면은 단위 면적당 표면 미결합손 밀도가 <111>보다 낮아, 산화 후 Si-SiO2 계면의 트랩 밀도(D_it)와 고정 산화막 전하가 작다. 그래서 MOS 소자에는 <100>이 표준이다. 두 방위 모두 단결정 성장이 가능하다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '200mm 미만 구형 웨이퍼 플랫 규약에서 N-type <100> 웨이퍼의 표시로 옳은 것은?'
    choices:
      - '보조 플랫이 1차 플랫에서 시계방향 180°(반대편)'
      - '보조 플랫이 1차 플랫에서 시계방향 90°'
      - '보조 플랫이 1차 플랫에서 시계방향 45°'
      - '보조 플랫이 없음'
    answer: 0
    glossary:
      - '1차/보조 플랫｜｜웨이퍼 가장자리를 평평하게 깎아 결정 방위와 도핑형을 표시하는 표식'
    explanation: '구형 플랫 규약: P<111>은 보조 플랫 없음, P<100>은 90°, N<111>은 45°, N<100>은 180°(1차 플랫 반대편)이다. 따라서 N형 <100>은 180° 위치에 보조 플랫이 있다. (200mm 이상은 노치 하나만 사용하고 도핑은 표시하지 않는다.)'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '200mm 및 300mm 웨이퍼에서 플랫 대신 작은 ''노치(notch)'' 하나만 사용하는 이유로 가장 적절한 것은?'
    choices:
      - '플랫을 깎으면 결정 방위가 바뀌기 때문'
      - '플랫은 유효 면적(다이 수) 손실이 크고, 큰 웨이퍼에서는 노치만으로 방위 정렬이 충분하기 때문(도핑형은 별도 관리)'
