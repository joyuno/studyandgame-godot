questions:
  - type: mcq
    q: 'k'' = μ·Cox에서 단위면적 게이트 커패시턴스 Cox와 산화막 두께 tox의 관계로 옳은 것은? (εox: 산화막 유전율)'
    choices:
      - 'Cox = εox·tox 이므로 산화막이 두꺼울수록 k''이 커진다'
      - 'Cox = tox/εox 이므로 산화막 두께와 무관하다'
      - 'Cox = εox/tox 이므로 산화막이 얇을수록 k''이 커진다'
      - 'Cox는 산화막 면적에만 의존하고 두께와 무관하다'
    answer: 2
    glossary:
      - 'tox｜｜게이트 산화막 두께. high-k 유전체에서는 등가산화막두께 EOT로 환산한다'
    explanation: '단위면적 게이트 커패시턴스는 평행판 모형으로 Cox = εox/tox이다. 산화막을 얇게 하면 Cox가 커지고 k'' = μ·Cox도 커져 전류구동력이 향상된다. 이것이 고집적 공정에서 산화막(또는 high-k)을 얇게 가져가는 이유다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'MOSFET의 증가형(enhancement)과 공핍형(depletion) 구분에 관한 설명으로 옳은 것은?'
    choices:
      - '증가형 n채널은 VGS=0에서 이미 채널이 존재해 전류가 흐른다'
      - '공핍형은 양(+)의 VGS를 인가해야 비로소 채널이 생긴다'
      - '증가형과 공핍형은 동작 원리가 같고 명칭만 다르다'
      - '공핍형 n채널은 VGS=0에서도 채널이 존재하여 음(−)의 VGS로 채널을 줄여야 차단된다'
    answer: 3
    glossary:
      - '증가형｜｜채널을 게이트 전압으로 새로 유도(enhance)해야 하는 형식, 상시 OFF'
      - '공핍형｜｜이미 있는 채널을 게이트로 공핍(deplete)시켜 끄는 형식, 상시 ON'
    explanation: '공핍형 n채널은 제조 시 채널이 미리 형성되어 VGS=0에서도 ID가 흐르며(상시 ON), 음의 VGS로 채널을 공핍시켜 끈다. 증가형 n채널은 VGS=0에서 채널이 없고(상시 OFF) 양의 VGS로 채널을 유도해야 한다. 보기1·2는 두 형식을 뒤바꿔 설명한 것이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '문턱전압 Vt의 부호로 MOSFET 형식을 판별할 때 옳은 것은?'
    choices:
      - 'n채널 증가형은 Vt > 0, n채널 공핍형은 Vt < 0 이다'
      - 'n채널 증가형은 Vt < 0, n채널 공핍형은 Vt > 0 이다'
      - 'n채널은 형식과 무관하게 항상 Vt > 0 이다'
      - 'Vt의 부호는 형식과 관계가 없다'
    answer: 0
    explanation: 'n채널 증가형은 양의 VGS로 채널을 유도하므로 Vt > 0이고, n채널 공핍형은 VGS=0에서 이미 채널이 있어 음의 VGS로 꺼야 하므로 Vt < 0이다. (p채널은 부호가 모두 반대.) 형식 판별에 Vt 부호는 직접적 단서가 된다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'VGS=0에서 상당한 ID가 흐르고, VGS를 음의 방향으로 키울수록 ID가 점점 감소하여 0이 되는 전달특성을 보이는 소자는?'
    choices:
      - 'n채널 증가형 MOSFET'
      - 'n채널 공핍형 MOSFET'
      - 'p채널 증가형 MOSFET'
      - 'p채널 공핍형 MOSFET'
    answer: 1
    glossary:
      - '전달특성｜｜VDS를 고정하고 VGS에 대한 ID를 나타낸 곡선'
    explanation: 'VGS=0에서 전류가 흐른다는 것은 상시 ON, 즉 공핍형이라는 뜻이다. 음의 VGS로 채널을 공핍시켜 ID를 줄여 끄는 것은 n채널 공핍형의 특징이다. 증가형(보기1·2)은 VGS=0에서 ID≈0이라 조건을 만족하지 못한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'n채널과 p채널 enhancement MOSFET의 정상(포화) 동작 시 전압 극성에 대한 설명으로 옳은 것은?'
    choices:
      - 'n채널은 VGS<0, VDS<0 으로 동작하고 캐리어는 전자이다'
      - 'p채널은 VGS>0, VDS>0 으로 동작하고 캐리어는 정공이다'
      - 'n채널은 VGS>0, VDS>0 으로 동작하고 캐리어는 전자이다'
      - 'n채널과 p채널 모두 VGS>0에서만 동작한다'
    answer: 2
    explanation: 'n채널 증가형은 양의 VGS(>Vt)로 전자 채널을 만들고 양의 VDS로 전류를 흘리며 다수 캐리어는 전자다. p채널은 전압 극성이 모두 반대(VGS<0, VDS<0)이고 캐리어는 정공이다. 따라서 보기4가 옳고, 나머지는 극성을 뒤바꿨다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'p채널 MOSFET의 단자 정의와 전류 방향에 대한 설명으로 옳은 것은?'
    choices:
      - '정공이 다수 캐리어이며, 소스는 두 n+ 단자 중 전위가 더 높은 쪽이다'
      - '전자가 다수 캐리어이며, 드레인이 전위가 더 높은 쪽이다'
      - 'p채널은 바디가 p형이고 소스/드레인이 n형이다'
      - '정공이 다수 캐리어이며, 소스는 두 p+ 단자 중 전위가 더 높은 쪽이다'
    answer: 3
    glossary:
      - '소스/드레인 정의｜｜단자 명칭은 전위에 따라 결정된다. 캐리어가 출발하는 쪽이 소스'
    explanation: 'p채널은 n형 기판(바디)에 p+ 소스/드레인을 가지며 다수 캐리어는 정공이다. 정공은 높은 전위에서 낮은 전위로 흐르므로, 두 p+ 단자 중 전위가 높은 쪽이 소스가 된다. 보기2·4는 캐리어 종류나 도핑형을 뒤바꾼 설명이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'MOSFET이 포화영역에서 동작할 때 게이트-소스 커패시턴스 Cgs와 게이트-드레인 커패시턴스 Cgd의 채널 전하 분배 성분에 대한 설명으로 옳은 것은?'
    choices:
      - '포화에서 드레인 쪽 채널이 핀치오프되어 채널전하 성분은 대부분 Cgs에 기여한다'
      - '포화에서 Cgs와 Cgd는 정확히 같다'
      - '포화에서 채널전하 성분은 대부분 Cgd에 기여한다'
      - '포화에서는 Cgs, Cgd 모두 0이 된다'
    answer: 0
    glossary:
      - '핀치오프｜｜드레인 부근에서 채널 반전층이 사라져 채널이 끊기는 지점'
      - 'overlap 커패시턴스｜｜게이트가 소스/드레인 확산영역과 겹쳐 생기는 기생 커패시턴스'
    explanation: '포화영역에서는 드레인 단에서 채널이 핀치오프되어 게이트-드레인 사이 반전전하의 직접 결합이 약해진다. 따라서 채널전하에 의한 게이트 커패시턴스는 대부분 소스 쪽(Cgs)에 분배되며, 이상적 모형에서 Cgs ≈ (2/3)·W·L·Cox 정도다. Cgd에는 주로 중첩(overlap) 성분만 남는다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '공통소스 증폭기에서 게이트-드레인 커패시턴스 Cgd가 고주파 응답에 특히 큰 영향을 주는 이유로 옳은 것은?'
    choices:
      - 'Cgd가 출력단에만 보여 입력에 영향을 주지 않기 때문'
      - '밀러 효과로 Cgd가 입력측에서 (1+|Av|)배로 증폭되어 보이기 때문'
      - 'Cgd가 항상 Cgs보다 훨씬 크기 때문'
      - 'Cgd는 DC 바이어스에서만 작용하기 때문'
    answer: 1
    glossary:
      - '밀러 효과｜｜반전 증폭단의 입출력 사이 커패시턴스가 입력에서 (1+이득)배로 커 보이는 현상'
      - 'Av｜｜증폭기의 전압이득 크기'
    explanation: '공통소스단은 반전 증폭이라 Cgd가 입력-출력을 연결하는 피드백 경로가 되고, 밀러 효과에 의해 입력에서 본 등가 용량이 Cgd·(1+|Av|)로 커진다. 이 증폭된 용량이 입력 RC 극을 낮춰 대역폭을 제한한다. 따라서 작은 Cgd라도 고주파에서 지배적일 수 있다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'MOSFET의 단위이득 차단주파수 fT ≈ gm / [2π(Cgs+Cgd)] 에서 fT를 높이기 위한 방법으로 옳은 것은?'
    choices:
      - '채널길이 L을 길게 하여 Cgs를 키운다'
      - 'Cgs, Cgd를 키우면 fT가 올라간다'
      - 'gm을 키우고 (Cgs+Cgd)를 줄인다. 보통 L을 짧게 하면 fT가 올라간다'
      - 'gm을 줄여야 fT가 올라간다'
    answer: 2
    glossary:
      - 'fT｜｜소신호 전류이득이 1(0 dB)이 되는 주파수, 소자의 속도 척도'
    explanation: 'fT는 전류이득이 1이 되는 주파수로 gm/[2π(Cgs+Cgd)]에 비례한다. gm을 키우고 입력 커패시턴스를 줄이면 fT가 상승하며, 채널길이를 줄이면 Cgs(∝WLCox)가 작아지고 캐리어 주행시간이 짧아져 fT가 올라간다. 따라서 보기4가 옳고 나머지는 분모를 키워 fT를 낮춘다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'n채널 enhancement MOSFET의 동작영역 판별 조건으로 옳은 것은? (VOV = VGS − Vt)'
    choices:
      - 'VGS < Vt: 포화 / VDS < VOV: 선형 / VDS ≥ VOV: 차단'
      - 'VGS > Vt이면 VDS와 무관하게 항상 포화이다'
      - 'VDS = 0이면 포화영역이다'
      - 'VGS < Vt: 차단 / VDS < VOV: 선형(triode) / VDS ≥ VOV: 포화'
    answer: 3
    glossary:
      - 'VOV｜｜과구동전압(overdrive), VGS와 Vt의 차이로 채널 형성 여유분을 나타냄'
      - 'triode｜｜선형(저항성) 동작영역의 다른 이름'
    explanation: 'VGS<Vt이면 채널이 없어 차단(cutoff)이다. VGS>Vt에서 VDS가 작아(VDS<VOV) 채널이 양단에 모두 있으면 선형(triode)영역, VDS≥VOV로 드레인단이 핀치오프되면 포화영역이다. 따라서 보기3이 정확하며, ''VGS>Vt면 항상 포화''라는 보기는 VDS 조건을 무시한 오류다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'n채널 MOSFET에서 Vt=1 V, VGS=3 V, VDS=1.5 V일 때 이 소자의 동작영역은?'
    choices:
      - '선형(triode)'
      - '차단(cutoff)'
      - '포화(saturation)'
      - '항복(breakdown)'
    answer: 0
    explanation: 'VOV = VGS − Vt = 3 − 1 = 2 V이다. VGS>Vt이므로 채널은 존재한다. VDS=1.5 V < VOV=2 V이므로 드레인단이 아직 핀치오프되지 않아 선형(triode)영역이다. VDS가 2 V를 넘어야 포화로 진입한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'n채널 MOSFET이 선형영역에서 포화영역으로 막 진입하는 경계(VDS,sat)에 해당하는 조건은?'
    choices:
      - 'VDS = VGS'
      - 'VDS = VGS − Vt'
      - 'VDS = Vt'
      - 'VDS = VGS + Vt'
    answer: 1
    explanation: '드레인단에서의 채널 반전조건이 사라지는 지점이 포화 경계이며, 이는 VGD = Vt, 즉 VDS = VGS − Vt = VOV일 때이다. 이보다 VDS가 작으면 선형, 크거나 같으면 포화다. 따라서 VDS,sat = VGS − Vt가 정답이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '포화영역 MOSFET의 소신호 천이컨덕턴스 gm을 ID로 표현한 것으로 옳은 것은? (k = k''·W/L)'
    choices:
      - 'gm = (1/2)·k·(VGS−Vt)²'
      - 'gm = ID/(VGS−Vt)²'
      - 'gm = k·(VGS−Vt) = √(2·k·ID)'
      - 'gm = λ·ID'
    answer: 2
    glossary:
      - 'gm｜｜게이트 전압 변화에 대한 드레인 전류 변화율, 소신호 증폭의 핵심 파라미터'
    explanation: '포화에서 ID = (1/2)k(VGS−Vt)²이므로 gm = ∂ID/∂VGS = k(VGS−Vt)이다. 여기에 ID 표현을 대입하면 gm = 2ID/(VGS−Vt) = √(2·k·ID)로도 쓸 수 있다. 보기4의 λ·ID는 출력컨덕턴스(1/ro)이지 gm이 아니다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'MOSFET 소신호 등가모델에서 본질이득(intrinsic gain) gm·ro에 대한 설명으로 옳은 것은?'
    choices:
      - 'gm·ro는 항상 1보다 작다'
      - 'gm·ro는 ID에 정비례한다'
      - 'gm·ro는 Cox에만 의존하고 λ와 무관하다'
      - 'gm·ro ≈ 2/[λ(VGS−Vt)] 이며, 채널을 길게(λ↓) 하면 커진다'
    answer: 3
    glossary:
      - '본질이득｜｜이상적 부하에서 단일 트랜지스터가 낼 수 있는 최대 전압이득 gm·ro'
    explanation: 'gm = 2ID/(VGS−Vt), ro = 1/(λID)이므로 gm·ro = 2/[λ(VGS−Vt)]가 된다. ID가 상쇄되어 본질이득은 ID에 거의 무관하며, λ를 줄이면(긴 채널) 커진다. 보통 수십~수백으로 1보다 훨씬 크다(보기1 오류).'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '단채널 효과 중 문턱전압 롤오프(Vt roll-off)에 대한 설명으로 옳은 것은?'
    choices:
      - '채널길이 L이 짧아질수록 Vt가 감소하는 현상으로, 소스/드레인 공핍영역이 채널 제어전하를 분담하기 때문이다'
      - '채널길이 L이 짧아질수록 Vt가 증가하는 현상이다'
      - '채널폭 W가 좁아질 때만 나타나는 현상이다'
      - '게이트 전압이 채널 전하를 완전히 제어하므로 발생한다'
    answer: 0
    glossary:
      - 'Vt roll-off｜｜채널길이가 짧아질수록 문턱전압이 떨어지는 단채널 효과'
      - 'charge sharing｜｜소스/드레인 공핍영역이 채널 공핍전하를 나눠 갖는 현상'
    explanation: '단채널에서는 소스/드레인 접합의 공핍영역이 채널 아래 공핍전하의 상당 부분을 미리 분담(charge sharing)한다. 그만큼 게이트가 반전을 일으키는 데 필요한 전압이 줄어 L이 짧아질수록 Vt가 낮아진다. 이것이 Vt roll-off이며, 보기1처럼 증가하는 것이 아니다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '단채널 소자에서 드레인 전압을 높였더니 Vt가 추가로 더 낮아졌다. 이 현상의 이름과 본질로 가장 옳은 것은?'
