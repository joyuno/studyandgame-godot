  # ──────────────────────────────────────────────────────────────────
  # SORT KEY vs PRIMARY KEY — disambiguation
  # ──────────────────────────────────────────────────────────────────
  - type: mcq
    q: 'ClickHouse에서 `ORDER BY (a, b, c)` DDL은 어떤 효과를 갖는가?'
    choices:
      - 'SELECT 결과를 a,b,c 순으로 정렬'
      - '테이블 데이터를 디스크에 a,b,c 순으로 정렬해 저장하고 sparse index의 기준으로 사용'
      - '데이터를 a,b,c 컬럼만 저장하도록 제한'
      - 'a,b,c 컬럼에 자동 인덱스 생성'
    answer: 1
    glossary:
      - 'DDL｜｜테이블 구조를 정의하는 SQL'
      - 'sparse index｜｜드문드문 가리키는 인덱스'
      - 'prune｜｜불필요한 범위를 건너뜀'
    explanation: |
      DDL의 `ORDER BY`는 sort key. part 내부 데이터가 이 순서로 정렬되어
      디스크에 저장됨. primary key를 따로 명시하지 않으면 이 sort key의
      prefix가 자동 primary key. SELECT 시 a 조건은 강력한 prune 가능,
      b는 a 같을 때만, c는 a·b 같을 때만.
    concept: ddl-order-by
