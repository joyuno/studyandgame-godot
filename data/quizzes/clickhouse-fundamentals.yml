meta:
  category: clickhouse
  title: ClickHouse 기초 — 용어 그래프
  version: 0.2.0
  default_time: 35
  set_time: 900
  tags: [clickhouse, fundamentals, vocabulary, pkg]

# Prerequisite Knowledge Graph pack.
# Goal: build the vocabulary scaffold required to read clickhouse-mergetree-basics.yml.
# Concept IDs (kebab-case) form a DAG; every `prereq` ID is taught by an
# earlier question in this pack. Bloom progression: recall → understand →
# apply, with small backsteps when a new concept is introduced.

questions:

  # ──────────────────────────────────────────────────────────────────
  # ROOT LAYER — what kind of thing is ClickHouse?
  # ──────────────────────────────────────────────────────────────────
  - type: mcq
    q: 'ClickHouse는 어떤 종류의 소프트웨어인가?'
    choices:
      - '웹 브라우저'
      - '운영체제'
      - '메시지 큐'
      - '데이터베이스 관리 시스템 (DBMS)'
    answer: 3
    glossary:
      - 'DBMS｜｜데이터베이스 관리 시스템'
      - '메시지 큐｜｜메시지를 임시 저장·전달하는 미들웨어'
      - '오픈소스｜｜소스 코드가 공개된 소프트웨어'
    explanation: |
      ClickHouse = 대량의 데이터를 빠르게 집계·분석하기 위한 오픈소스 DBMS.
      러시아 Yandex가 2009년 사내용으로 시작 → 2016년 오픈소스화 (Apache 2.0).
      "data warehouse / analytics DB" 카테고리.
    concept: clickhouse-is-dbms
    prereq: []
    bloom: recall
    tags: [intro]

  - type: mcq
    q: '데이터베이스 분야에서 OLAP과 OLTP의 차이를 가장 잘 설명한 것은?'
    choices:
      - 'OLAP은 모바일용, OLTP은 서버용이다'
      - 'OLAP은 NoSQL, OLTP은 SQL'
      - 'OLAP은 분석·집계 (큰 SELECT), OLTP은 거래·트랜잭션 (작은 INSERT/UPDATE)'
      - '둘은 같은 말의 다른 표기'
    answer: 2
    glossary:
      - '트랜잭션｜｜한 번에 처리되는 작업 단위'
      - 'NoSQL｜｜비관계형 데이터베이스 계열'
      - 'SELECT｜｜데이터를 조회하는 SQL 명령'
      - 'INSERT｜｜데이터를 삽입하는 SQL 명령'
    explanation: |
      OLTP (Online Transaction Processing) = 은행 송금처럼 작은 단위 거래를
      빠르게. 예: PostgreSQL, MySQL의 주 용도.
      OLAP (Online Analytical Processing) = 수억 row 스캔해 집계·통계.
      예: ClickHouse, Druid, BigQuery, Snowflake.
    concept: olap-vs-oltp
    prereq: [clickhouse-is-dbms]
    bloom: understand
    tags: [intro, workload]

  - type: ox
    q: 'ClickHouse는 OLTP보다 OLAP 워크로드에 최적화되어 있다.'
    answer: true
    glossary:
      - 'OLTP｜｜작은 거래를 빠르게 처리하는 워크로드'
      - '워크로드｜｜시스템이 처리하는 작업 부하'
      - 'mutation｜｜무거운 백그라운드 수정 작업'
    explanation: |
      대량 SELECT + 집계가 ClickHouse의 강점. 행 단위 잦은 UPDATE/DELETE는
      약한 편이고, UPDATE/DELETE는 mutation이라는 무거운 백그라운드 작업으로
      처리된다 (즉시 반영이 아님).
    concept: clickhouse-is-olap
    prereq: [clickhouse-is-dbms, olap-vs-oltp]
    bloom: apply
    time: 20
    tags: [intro, workload]

  # ──────────────────────────────────────────────────────────────────
  # STORAGE LAYER — row vs column orientation, compression
  # ──────────────────────────────────────────────────────────────────
  - type: mcq
    q: 'Row-oriented(행 지향) 저장과 Column-oriented(컬럼 지향) 저장의 차이는?'
    choices:
      - '행 지향은 SQL 지원, 컬럼 지향은 NoSQL이다'
      - '행 지향은 한 행의 모든 컬럼을 붙여 저장, 컬럼 지향은 같은 컬럼 값을 모아 저장'
      - '행 지향은 메모리, 컬럼 지향은 디스크에만 저장된다'
      - '두 방식은 압축률이 같다'
    answer: 1
    glossary:
      - 'NoSQL｜｜비관계형 데이터베이스 계열'
      - 'IO｜｜디스크 입출력 작업'
      - '압축률｜｜원본 대비 압축된 크기 비율'
    explanation: |
      행 지향: [id=1,name="a",age=20][id=2,name="b",age=30]...
      컬럼 지향: [1,2,...][a,b,...][20,30,...]
      한 컬럼만 읽는 SELECT가 행 지향에선 모든 행 전체 IO 필요, 컬럼 지향
      에선 해당 컬럼 파일만 읽으면 됨 → 분석 쿼리에서 IO 격차 큼.
    concept: row-vs-columnar-storage
    prereq: [clickhouse-is-dbms]
    bloom: understand
    tags: [storage]

  - type: ox
    q: 'ClickHouse는 컬럼 지향(column-oriented) DBMS다.'
    answer: true
    glossary:
      - '집계｜｜여러 값을 합·평균 등으로 요약'
      - '압축률｜｜원본 대비 압축된 크기 비율'
    explanation: |
      ClickHouse 빠른 집계 성능의 근본 원인. 같은 타입 값이 연속이라 압축률
      높고, 필요한 컬럼만 디스크에서 읽으면 됨.
    concept: clickhouse-is-columnar
    prereq: [clickhouse-is-dbms, row-vs-columnar-storage]
    bloom: recall
    time: 15
    tags: [storage]

  - type: mcq
    q: '컬럼 지향 저장이 압축률을 높이는 핵심 이유는?'
    choices:
      - '같은 컬럼의 값들은 데이터 타입과 분포가 유사해 압축 알고리즘이 패턴을 잘 찾기 때문'
      - '컬럼 지향은 항상 zip을 사용하기 때문'
      - 'CPU가 컬럼 단위로만 압축할 수 있기 때문'
      - 'OS가 컬럼 파일을 자동 압축하기 때문'
    answer: 0
    glossary:
      - 'LZ4｜｜빠른 무손실 압축 알고리즘'
      - 'ZSTD｜｜고압축률 무손실 압축 알고리즘'
      - 'timestamp｜｜시각을 나타내는 값'
      - 'enum｜｜값 종류가 한정된 타입'
    explanation: |
      같은 컬럼 = 같은 타입 = 비슷한 분포 (예: timestamp 컬럼은 단조 증가,
      enum-like 문자열 컬럼은 값 종류가 적음). LZ4·ZSTD 같은 압축기가 이런
      반복 패턴을 매우 효율적으로 처리 → 컬럼당 5~10× 압축 흔함.
    concept: compression-from-columnar
    prereq: [clickhouse-is-columnar]
    bloom: understand
    tags: [storage, compression]

  # ──────────────────────────────────────────────────────────────────
  # SQL VOCABULARY — generic meanings before ClickHouse-specific twists
  # ──────────────────────────────────────────────────────────────────
  - type: mcq
    q: 'SQL의 `ORDER BY` 절은 일반적으로 무엇을 의미하나?'
    choices:
      - '테이블에 데이터를 삽입할 순서 지정'
      - '쿼리 실행 우선순위 지정'
      - '인덱스 종류 지정'
      - 'SELECT 결과를 어떤 컬럼 기준으로 정렬할지 지정'
    answer: 3
    glossary:
      - 'DDL｜｜테이블 구조를 정의하는 SQL'
      - 'ORDER BY｜｜결과 정렬 기준을 지정하는 절'
      - '인덱스｜｜검색 속도를 높이는 자료구조'
    explanation: |
      표준 SQL의 `SELECT ... ORDER BY col`은 결과 정렬용. ClickHouse의
      DDL `CREATE TABLE ... ORDER BY (col1, col2)`는 의미가 다르다 — 그건
      테이블 자체의 디스크 정렬 기준 (다음 문제).
    concept: sql-order-by-general
    prereq: []
    bloom: recall
    tags: [sql]

  - type: mcq
    q: '관계형 DB에서 일반적으로 `primary key`(기본 키)의 핵심 제약은?'
    choices:
      - '값이 항상 정수여야 함'
      - '자동 증가해야 함'
      - '같은 값을 가진 row가 여럿 있을 수 없음 (UNIQUE + NOT NULL)'
      - '외부 시스템에서 참조 가능해야 함'
    answer: 2
    glossary:
      - 'RDBMS｜｜관계형 데이터베이스 관리 시스템'
      - 'UNIQUE｜｜값 중복을 허용하지 않는 제약'
      - 'NOT NULL｜｜빈 값을 허용하지 않는 제약'
      - 'row｜｜테이블의 한 행'
    explanation: |
      표준 RDBMS(PostgreSQL, MySQL, Oracle)의 primary key 제약 = NOT NULL +
      UNIQUE. 한 row를 고유하게 식별. ClickHouse는 이름만 같고 의미가 다름.
    concept: rdb-primary-key
    prereq: []
    bloom: recall
    tags: [sql, rdb]

  - type: ox
    q: 'ClickHouse의 primary key는 PostgreSQL의 primary key처럼 row 유일성을 보장한다.'
    answer: false
    glossary:
      - 'primary key｜｜row를 고유 식별하는 키'
      - 'row｜｜테이블의 한 행'
      - '인덱스｜｜검색 속도를 높이는 자료구조'
    explanation: |
      이름은 같지만 의미가 다른 대표적 함정. ClickHouse primary key는
      디스크에 데이터를 정렬하는 기준일 뿐, 중복 row를 허용한다.
      "ClickHouse does not require a unique primary key" — 공식 docs.
      (그 정렬된 데이터 위에 어떤 인덱스가 얹히는지는 뒤에서 별도 학습.)
    concept: clickhouse-primary-key-not-unique
    prereq: [rdb-primary-key, clickhouse-is-dbms]
    bloom: apply
    time: 20
    tags: [primary-key, gotcha]

  # ──────────────────────────────────────────────────────────────────
  # TABLE ENGINE LAYER — what defines a ClickHouse table's behavior
  # ──────────────────────────────────────────────────────────────────
  - type: mcq
    q: 'ClickHouse에서 "테이블 엔진(table engine)"이란?'
    choices:
      - '테이블의 비주얼 테마'
      - '데이터를 어떻게 저장·읽기·복제·머지할지 정하는 동작 방식'
      - '데이터베이스 서버 프로세스의 이름'
      - 'SQL 파서의 종류'
    answer: 1
    glossary:
      - 'MergeTree｜｜파트 단위 정렬·머지하는 기본 엔진'
      - '복제｜｜데이터를 여러 노드에 복사'
      - '머지｜｜작은 파트를 큰 파트로 합치는 작업'
    explanation: |
      `CREATE TABLE ... ENGINE = MergeTree()` 처럼 모든 테이블이 엔진을
      명시. 엔진이 디스크 저장 방식·인덱싱·복제·머지 동작을 모두 결정.
    concept: table-engine
    prereq: [clickhouse-is-dbms]
    bloom: recall
    tags: [table-engine]

  - type: mcq
    q: '다음 중 ClickHouse의 MergeTree 계열에 속하지 않는 것은?'
    choices:
      - 'InnoDB (자동 트랜잭션)'
      - 'ReplacingMergeTree (같은 키 row 중복 제거)'
      - 'SummingMergeTree (같은 키 row를 합산)'
      - 'AggregatingMergeTree (사전 집계)'
    answer: 0
    glossary:
      - 'InnoDB｜｜MySQL의 트랜잭션 스토리지 엔진'
      - '트랜잭션｜｜한 번에 처리되는 작업 단위'
      - '사전 집계｜｜미리 계산해 두는 집계'
    explanation: |
      InnoDB는 MySQL의 엔진. ClickHouse와 무관.
      MergeTree 계열은 백그라운드 머지를 공유하면서 머지 시점의 추가 동작
      (중복 제거/합산/사전 집계)으로 차별화된다.
    concept: mergetree-family
    prereq: [table-engine]
    bloom: understand
    tags: [table-engine]

  - type: ox
    q: 'ClickHouse 테이블은 모두 어떤 엔진을 명시적으로 지정해야 한다.'
    answer: true
    glossary:
      - 'MergeTree｜｜파트 단위 정렬·머지하는 기본 엔진'
      - 'Memory｜｜RAM에만 두는 임시 엔진'
      - 'Distributed｜｜분산 라우팅용 엔진'
      - 'append-only｜｜추가만 가능한 저장 방식'
    explanation: |
      `CREATE TABLE ... ENGINE = X()` 구문에서 ENGINE 절은 필수. 가장 일반
      적인 선택이 MergeTree, 임시·캐시 용도엔 Memory, append-only 로그엔
      Log, 분산 라우팅엔 Distributed.
    concept: table-engine-required
    prereq: [table-engine]
    bloom: recall
    time: 15
    tags: [table-engine]

  # ──────────────────────────────────────────────────────────────────
  # DATA PART LAYER — physical units inside a MergeTree table
  # ──────────────────────────────────────────────────────────────────
  - type: mcq
    q: 'ClickHouse의 "data part"란 무엇인가?'
    choices:
      - '하나의 row'
      - '한 테이블의 컬럼 정의'
      - '백업 파일 단위'
      - '디스크 위 정렬된 데이터 묶음 한 덩어리 (INSERT마다 새로 만들어짐)'
    answer: 3
    glossary:
      - 'INSERT｜｜데이터를 삽입하는 SQL 명령'
      - 'primary key｜｜디스크 정렬 기준이 되는 키'
    explanation: |
      INSERT 한 번 → 새 part 하나 생성. part 안은 primary key 기준 정렬된
      상태로 저장. "테이블"은 결국 part들의 집합. ClickHouse가 디스크에서
      다루는 최소 단위는 row가 아니라 part다.
    concept: data-part
    prereq: [mergetree-family, clickhouse-is-columnar]
    bloom: recall
    tags: [part]

  - type: mcq
    q: 'ClickHouse의 partition은 part와 어떻게 다른가?'
    choices:
      - '같은 말의 다른 표기'
      - 'partition은 column 단위, part는 row 단위'
      - 'partition은 논리적 그룹, part는 그 그룹 안의 물리적 데이터 묶음'
      - 'partition은 SELECT용, part는 INSERT용'
    answer: 2
    glossary:
      - 'part｜｜디스크 위 정렬된 데이터 묶음'
      - 'PARTITION BY｜｜데이터를 그룹으로 묶는 절'
      - '머지｜｜작은 파트를 큰 파트로 합치는 작업'
    explanation: |
      partition = "이 데이터들을 같은 그룹으로 묶어 관리" 라는 논리적 구분.
      `PARTITION BY toYYYYMM(date)`로 정의. part = 그 partition 안의 실제
      정렬된 데이터 덩어리. 한 partition 안에 여러 part 가능. 머지는 같은
      partition 안에서만 일어남.
    concept: partition-vs-part
    prereq: [data-part]
    bloom: understand
    tags: [partition, part]

  - type: ox
    q: '서로 다른 partition에 속한 part들도 백그라운드에서 자동으로 머지된다.'
    answer: false
    glossary:
      - 'partition｜｜데이터를 묶는 논리적 그룹'
      - 'part｜｜정렬된 물리적 데이터 묶음'
      - 'OPTIMIZE TABLE｜｜강제 머지 실행 명령'
    explanation: |
      partition 경계는 머지의 절대 경계. `OPTIMIZE TABLE ... FINAL`로도 다른
      partition을 머지할 수 없음. partition을 잘게 자르면 머지가 안 일어나
      파일 수만 증가하므로 partition 수는 신중히.
    concept: partition-merge-boundary
    prereq: [partition-vs-part]
    bloom: apply
    time: 20
    tags: [partition, merge]

  - type: ox
    q: 'ClickHouse 테이블은 INSERT마다 새 part를 만들고, 이 part들을 백그라운드에서 더 큰 part로 합친다.'
    answer: true
    glossary:
      - 'part｜｜정렬된 물리적 데이터 묶음'
      - 'background merge｜｜작은 파트를 합치는 백그라운드 작업'
      - 'too many parts｜｜파트 과다 시 발생하는 에러'
    explanation: |
      INSERT → 작은 part 생성. 시간이 지나며 background merge 프로세스가
      작은 part들을 큰 part로 합쳐 파일 수를 줄이고 SELECT 효율을 높임.
      너무 잦은 작은 INSERT는 part 폭증 → "too many parts" 에러.
    concept: background-merge
    prereq: [data-part]
    bloom: recall
    time: 20
    tags: [merge]

  - type: mcq
    q: 'ClickHouse에서 너무 잦은 작은 INSERT가 성능 문제를 일으키는 이유는?'
    choices:
      - 'CPU 사용률이 100% 까지 오르기 때문'
      - 'INSERT마다 새 part가 생기고, part 수가 많아지면 머지가 못 따라잡아 파일/디스크/오버헤드 폭증'
      - 'ClickHouse는 INSERT를 거부한다'
      - '네트워크 대역폭 제한 때문'
    answer: 1
    glossary:
      - 'part｜｜정렬된 물리적 데이터 묶음'
      - '머지｜｜작은 파트를 큰 파트로 합치는 작업'
      - '배치 INSERT｜｜여러 row를 묶어 한 번에 삽입'
    explanation: |
      INSERT 1회 = part 1개. 매 row마다 INSERT 보내면 수십만 개의 작은 part
      → 머지가 못 따라잡음 → SELECT 성능 저하 + "too many parts" 에러.
      해결: 클라이언트 측 배치 INSERT (수천~수만 row 단위로 묶어서 1회).
    concept: insert-batch-pattern
    prereq: [data-part, background-merge]
    bloom: apply
    tags: [insert, performance]

