  source: '대학 학부 전공 표준 범위(공개 강의목차·교재 기반, exa 리서치 + 멀티에이전트 생성). 특정 상용 교재 본문 미복제.'

questions:
  - type: mcq
    q: '비평형 상태에서 전자·정공 농도 곱은 np = ni²·exp((EFn − EFp)/kT) 로 주어진다. 정상적인 과잉캐리어 주입(빛 조사 등)이 가해진 경우 np 곱은?'
    choices:
      - 'ni² 와 정확히 같다'
      - 'ni² 보다 작다 (EFn < EFp)'
      - 'ni² 보다 크다 (EFn > EFp)'
      - '도핑 농도와 무관하게 항상 0이다'
    answer: 2
    explanation: '과잉캐리어 주입은 EFn을 위로, EFp를 아래로 분리시켜 EFn−EFp>0 이 되므로 np=ni²·exp((EFn−EFp)/kT)>ni² 이다. 평형(EFn=EFp)에서만 np=ni²(질량작용의 법칙)이 성립한다. 역방향 추출 시에는 np<ni²가 될 수 있다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '균일한 빛 조사로 단위부피·단위시간당 균일한 생성률 G가 가해지는 시료에서, 정상상태(steady-state)의 과잉소수캐리어 농도 δp는 어떻게 표현되는가? (소수캐리어 수명 τp)'
    choices:
      - 'δp = G / τp'
      - 'δp = G / √τp'
      - 'δp = G² · τp'
      - 'δp = G · τp'
    answer: 3
    glossary:
      - '생성률 G｜｜단위부피·단위시간당 생성되는 전자-정공쌍 수'
    explanation: '균일 생성·균일 분포의 정상상태에서는 생성률과 재결합률(δp/τp)이 같다: G = δp/τp → δp = G·τp. 생성률이 클수록, 수명이 길수록 정상상태 과잉농도가 커진다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '빛을 조사하면 반도체의 전도도가 증가하는 광전도(photoconductivity) 현상에서, 과잉캐리어에 의한 전도도 증가분 Δσ는 어떻게 표현되는가? (Δn=Δp=δ)'
    choices:
      - 'Δσ = q·δ·(μn + μp)'
      - 'Δσ = q·δ·(μn − μp)'
      - 'Δσ = q·δ·μn·μp'
      - 'Δσ = q·δ / (μn + μp)'
    answer: 0
    glossary:
      - '광전도｜｜빛 흡수로 생성된 과잉캐리어가 전도도를 증가시키는 현상'
    explanation: '전도도 σ=q(nμn+pμp)이므로 과잉전자·정공(Δn=Δp=δ)이 함께 늘면 Δσ=q·δ·(μn+μp)로 두 캐리어의 이동도가 더해진다. 차(−)나 곱이 아니라 합으로 더해지는 것이 핵심이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '빛을 t=0에 켜서 일정 생성률 G로 균일 조사할 때 과잉캐리어 농도 δp(t)는 δp(t)=Gτp·(1 − exp(−t/τp)) 로 증가한다. 이 거동에 대한 설명으로 옳은 것은?'
    choices:
      - '농도는 시간에 선형으로 무한히 증가한다'
      - '정상상태 농도에 도달하는 시상수는 τp 이다'
      - '시상수는 확산길이 L에 의해 결정된다'
      - '빛을 꺼도 농도는 즉시 0이 된다'
    answer: 1
    explanation: 'δp(t)=Gτp(1−e^(−t/τp))는 시상수 τp로 정상값 Gτp에 지수적으로 접근한다. 빛을 끄면 δp(t)=Gτp·e^(−t/τp)로 같은 시상수로 감쇠한다. 따라서 과도응답을 지배하는 것은 소수캐리어 수명 τp이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '표면 재결합 속도(surface recombination velocity) s는 표면에서의 캐리어 유속(flux)과 과잉농도를 연결하는 경계조건 −D(∂δp/∂x)|surface = s·δp(surface) 로 정의된다. s → ∞ 인 ''이상적 재결합 표면''에서 표면의 과잉캐리어 농도는?'
    choices:
      - '무한대로 발산한다'
      - '벌크 값과 같다'
      - '표면에서 0이 된다 (δp_surface = 0)'
      - '생성률 G와 같아진다'
    answer: 2
    glossary:
      - '표면 재결합 속도｜｜표면 결함을 통한 과잉캐리어 소멸의 빠르기를 속도 단위(cm/s)로 나타낸 양'
    explanation: '경계조건에서 유한한 유속을 유지하려면 s→∞일 때 δp(surface)→0이어야 한다. 즉 재결합이 매우 빠른 표면은 과잉캐리어를 즉시 소멸시켜 표면 농도를 0으로 고정한다. 반대로 s=0이면 표면에서 ∂δp/∂x=0(유속 없음)이 된다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '표면 재결합 속도 s의 단위와 그 물리적 기원에 대한 설명으로 가장 적절한 것은?'
    choices:
      - '단위는 cm²/s 이며, 표면 확산계수를 나타낸다'
      - '단위는 1/s 이며, 표면에서의 생성률을 의미한다'
      - '단위는 cm⁻³ 이며, 표면의 캐리어 농도를 의미한다'
      - '단위는 cm/s 이며, 표면의 dangling bond 등 표면 상태(준위)가 재결합 중심으로 작용한다'
    answer: 3
    glossary:
      - 'dangling bond｜｜표면에서 짝을 이루지 못해 끊어진 결합'
      - '패시베이션｜｜표면 결함을 화학적으로 채워 재결합을 줄이는 처리'
    explanation: 's는 유속(cm⁻²s⁻¹)을 농도(cm⁻³)로 나눈 형태이므로 cm/s 단위를 갖는다. 결정 표면에서 끊어진 결합(dangling bond)이 만드는 표면 상태가 밴드갭 내 재결합 중심으로 작용해 표면 재결합을 일으킨다. 패시베이션은 이 표면 상태 밀도를 줄여 s를 낮춘다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'Haynes-Shockley 실험은 반도체 시료에 펄스로 소수캐리어를 주입하고 전계로 드리프트시켜 떨어진 지점에서 검출한다. 이 실험으로 직접 측정할 수 있는 물리량으로 묶인 것은?'
    choices:
      - '소수캐리어의 이동도, 확산계수, 수명'
      - '밴드갭, 유전상수, 격자상수'
      - '도핑 농도, 페르미 준위, 일함수'
      - '공핍층 폭, 내장전위, 접합 커패시턴스'
    answer: 0
    glossary:
      - 'Haynes-Shockley 실험｜｜소수캐리어를 펄스 주입·드리프트시켜 μ, D, τ를 측정하는 고전 실험'
    explanation: 'Haynes-Shockley 실험은 소수캐리어 펄스의 비행시간(drift), 가우시안 퍼짐(diffusion), 면적 감쇠(recombination)로부터 각각 이동도 μ, 확산계수 D, 수명 τ를 직접 측정한다. 밴드갭이나 접합 정전특성을 측정하는 실험이 아니다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'Haynes-Shockley 실험에서 주입된 펄스가 검출기에 도달했을 때 관측되는 가우시안 펄스의 폭이 점점 넓어지는 현상은 무엇에 의한 것이며, 그로부터 어떤 양을 얻는가?'
    choices:
      - '드리프트에 의한 것이며, 이동도 μ를 얻는다'
      - '확산에 의한 것이며, 확산계수 D를 얻는다'
      - '재결합에 의한 것이며, 수명 τ를 얻는다'
      - '전계 산란에 의한 것이며, 유전상수를 얻는다'
    answer: 1
    glossary:
      - '반치폭｜｜펄스 최대값의 절반이 되는 지점 사이의 폭'
    explanation: '펄스의 가우시안 퍼짐(반치폭 증가)은 캐리어가 확산으로 퍼지기 때문이며, 그 폭으로부터 확산계수 D를 구한다. 비행시간(피크 위치)은 드리프트→이동도 μ를, 펄스 면적의 감쇠는 재결합→수명 τ를 준다. 세 양이 신호의 서로 다른 특징에 대응한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '평형 상태 pn 접합의 내장전위(built-in potential) Vbi = (kT/q)·ln(NA·ND / ni²) 에 대한 설명으로 옳은 것은?'
    choices:
      - '외부 도선으로 전압계를 연결하면 Vbi를 직접 측정할 수 있다'
      - '온도가 올라갈수록 Vbi는 항상 증가한다'
      - '도핑 농도가 높을수록, ni가 작을수록(밴드갭 클수록) Vbi가 커진다'
      - 'Vbi는 인가 전압에 비례한다'
    answer: 2
    glossary:
      - '내장전위｜｜평형 pn 접합 양단에 형성되는 전위차(전위장벽)'
    explanation: 'Vbi=(kT/q)ln(NA·ND/ni²)는 양쪽 도핑이 클수록, ni가 작을수록(밴드갭 큰 재료) 커진다. 평형 내장전위는 닫힌 회로에서 다른 접촉전위와 상쇄되어 전압계로 직접 측정되지 않는다. 온도 상승 시 ni²가 지수적으로 급증해 일반적으로 Vbi는 감소한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'Si pn 접합에서 NA = ND = 10¹⁵ cm⁻³, ni = 10¹⁰ cm⁻³, kT/q = 0.0259 V(300K) 일 때 내장전위 Vbi는 약 얼마인가? (ln10 ≈ 2.30)'
    choices:
      - '약 0.30 V'
      - '약 0.90 V'
      - '약 1.12 V'
      - '약 0.60 V'
    answer: 3
    explanation: 'Vbi=(kT/q)ln(NA·ND/ni²)=0.0259×ln(10¹⁵·10¹⁵/10²⁰)=0.0259×ln(10¹⁰)=0.0259×(10×2.30)=0.0259×23.0≈0.596≈0.60 V. 1.12 V는 Si 밴드갭(Eg/q)으로 혼동한 오답이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'pn 접합 정전특성 해석에 쓰이는 공핍 근사(depletion approximation)의 핵심 가정으로 옳은 것은?'
    choices:
      - '공간전하영역 내부에는 가동 캐리어가 거의 없고 이온화된 불순물 전하만 존재한다'
      - '공간전하영역 내부에서 전계가 0이다'
      - '중성영역에서 전하 밀도가 가장 크다'
      - '공핍영역의 경계가 점진적으로 변한다'
    answer: 0
    glossary:
      - '공간전하영역(SCR)｜｜이온화된 불순물 전하만 남아 전계가 존재하는 접합 부근 영역'
    explanation: '공핍 근사는 공간전하영역(SCR) 내에서 가동 캐리어(전자·정공)가 모두 비워졌다고 보고, 고정된 이온화 불순물 전하(+ND, −NA)만 남아 직사각형 전하분포를 형성한다고 가정한다. 이때 SCR 내부 전계는 0이 아니며(오히려 가장 큼), 경계는 급격(abrupt)하다고 본다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '급준(abrupt) pn 접합에서 평형 공핍층 전체 폭 W는 W = √(2ε·Vbi/q · (1/NA + 1/ND)) 로 주어진다. 양쪽 도핑을 모두 증가시키면 W는?'
    choices:
      - '증가한다'
      - '감소한다'
      - '변하지 않는다'
      - '도핑과 무관하게 Vbi만으로 결정된다'
    answer: 1
    glossary:
      - '급준 접합｜｜도핑이 접합면에서 계단처럼 급격히 바뀌는 이상적 접합'
    explanation: 'W ∝ √(1/NA + 1/ND) 이므로 도핑을 높이면 1/NA, 1/ND가 작아져 W가 줄어든다. 비록 Vbi는 도핑 증가로 조금 커지지만(로그 의존), 1/N 항의 감소가 지배적이어서 전체적으로 공핍층은 얇아진다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '한쪽이 매우 높게 도핑된 단측(one-sided) p⁺n 접합(NA >> ND)에서 공핍층은 주로 어느 쪽으로 확장되는가?'
    choices:
      - 'p⁺ 측(고농도 측)으로 거의 전부 확장된다'
      - '양쪽으로 정확히 같게 확장된다'
      - 'n 측(저농도 측)으로 거의 전부 확장된다'
      - '확장되지 않고 폭이 0이다'
    answer: 2
    glossary:
      - '단측 접합｜｜한쪽 도핑이 다른 쪽보다 훨씬 높은 비대칭 접합'
    explanation: '전하중성(NA·xp = ND·xn)에 의해 공핍층은 저농도 측으로 더 넓게 확장된다. NA>>ND인 p⁺n 접합에서는 xn>>xp가 되어 공핍층이 거의 전부 n측(저농도)으로 들어간다. 따라서 단측 접합의 정전특성은 저농도 측 도핑 ND가 지배한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '급준 pn 접합에서 p측과 n측 공핍폭 xp, xn 사이에는 전하중성 조건이 성립한다. NA·xp = ND·xn 일 때, NA = 4·ND 라면 xp와 xn의 관계는?'
    choices:
      - 'xp = 4·xn'
      - 'xp = xn'
      - 'xp = 2·xn'
      - 'xp = xn / 4'
    answer: 3
    explanation: '전하중성 NA·xp=ND·xn 에서 xp/xn = ND/NA = 1/4 이므로 xp = xn/4 이다. 즉 고농도 측(NA가 큰 p측)으로의 공핍 침투가 더 얕다. 도핑이 높을수록 같은 전하량을 더 좁은 폭에 담을 수 있기 때문이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '공핍 근사 하의 급준 pn 접합에서 공간전하밀도는 직사각형(계단형) 분포다. Poisson 방정식 dE/dx = ρ/ε 을 적분하면 공핍영역 내 전계 E(x)의 분포 형태는?'
    choices:
      - '접합면(x=0)에서 최대이고 양쪽 경계로 갈수록 0이 되는 삼각형 분포'
      - '공핍영역 전체에서 일정한(평탄한) 분포'
      - '접합면에서 0이고 경계에서 최대인 분포'
      - '공핍영역에서 포물선(2차) 분포'
    answer: 0
    glossary:
      - 'Poisson 방정식｜｜전하밀도와 전위·전계를 연결하는 정전기 기본식'
    explanation: '직사각형 전하분포를 적분(dE/dx=ρ/ε)하면 전계는 위치에 따라 1차(선형)로 변하며, 접합면에서 크기가 최대이고 공핍영역 양쪽 경계(−xp, xn)에서 0이 되는 삼각형 분포를 이룬다. 전위는 전계를 한 번 더 적분하므로 포물선 형태가 된다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '급준 pn 접합에서 접합면의 최대 전계 |Emax|는 전계 삼각형의 넓이가 전체 전위차와 같다는 관계(Vbi = ½·|Emax|·W)로부터 구할 수 있다. 이로부터 |Emax|는?'
    choices:
      - '|Emax| = Vbi / W'
      - '|Emax| = 2·Vbi / W'
      - '|Emax| = Vbi · W'
      - '|Emax| = Vbi / (2W)'
    answer: 1
    explanation: '전계 분포가 밑변 W, 높이 |Emax|인 삼각형이고 그 넓이가 전위차 Vbi와 같으므로 Vbi=½·|Emax|·W → |Emax|=2·Vbi/W 이다. 즉 최대 전계는 평균 전계(Vbi/W)의 2배다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '급준 단측 접합에서 최대 전계 |Emax| = √(2q·ND·(Vbi+VR)/ε) (저농도 측 ND)로 주어진다. 역방향 바이어스 VR을 키우거나 도핑 ND를 높이면 |Emax|는?'
