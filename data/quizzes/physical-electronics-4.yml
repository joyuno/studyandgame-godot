      - '전자친화도 χ 가 금속 종류에 따라 바뀌기 때문'
      - '계면준위(gap states)에 의한 페르미준위 핀닝'
    answer: 3
    glossary:
      - '페르미준위 핀닝｜｜계면준위 때문에 페르미준위가 특정 에너지에 고정되어 장벽이 금속 일함수에 둔감해지는 현상'
    explanation: '계면에 존재하는 금속유도 갭상태(MIGS)나 결함준위가 전하를 흡수해 페르미준위를 밴드갭 내 특정 에너지에 ''핀닝''시키면, Φ_Bn이 금속 일함수에 거의 무관해져 Schottky-Mott 예측에서 벗어난다. χ는 반도체 고유값이라 금속에 따라 바뀌지 않는다.'
    tags: [engineering, semiconductor]
