  source: '대학 학부 전공 표준 범위(공개 강의목차·교재 기반, exa 리서치 + 멀티에이전트 생성). 특정 상용 교재 본문 미복제.'

questions:
  - type: mcq
    q: 'BJT의 얼리전압 V_A를 크게(출력저항을 높게) 만들려는 설계 방향으로 옳은 것은?'
    choices:
      - '베이스 도핑을 높여 베이스폭 변조에 대한 W_B의 상대적 변화를 줄인다'
      - '베이스 도핑을 낮추고 베이스폭을 매우 얇게 한다'
      - '컬렉터 도핑을 베이스보다 훨씬 높여 공핍층이 베이스 쪽으로 퍼지게 한다'
      - '에미터 면적을 줄여 주입 전류를 낮춘다'
    answer: 0
    glossary:
      - 'N_AB｜｜베이스 영역의 받개(acceptor) 도핑 농도'
    explanation: 'V_A는 ΔW_B/W_B를 작게 할수록 커진다. 베이스 도핑(N_AB)을 높이면 같은 V_CB에서 베이스 쪽 공핍층 침투가 줄어 유효 베이스폭 변화가 작아진다. 컬렉터 도핑을 베이스보다 높이면 공핍층이 오히려 베이스로 더 퍼져 V_A가 작아지므로, 보통 N_DC < N_AB로 설계한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '에버스-몰(Ebers-Moll) 모델이 BJT를 모든 동작영역에서 기술할 수 있도록 사용하는 등가회로 구성요소로 가장 정확한 것은?'
    choices:
      - '다이오드 1개와 저항 2개'
      - 'BE·BC 접합을 나타내는 다이오드 2개와 결합을 나타내는 전류원 2개'
      - 'MOSFET 2개와 커패시터 2개'
      - '전압원 1개와 다이오드 1개'
    answer: 1
    glossary:
      - '등가회로｜｜소자의 단자 거동을 동일하게 재현하는 이상 소자들의 회로 모델'
    explanation: '에버스-몰 모델은 BE 접합과 BC 접합을 각각 다이오드로, 베이스를 가로지르는 소수캐리어 수송을 각 다이오드 전류에 의존하는 전류원으로 표현한다. 다이오드 2개 + 전류원 2개 구조로 순방향활성·역방향활성·포화·차단을 모두 다룬다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '에버스-몰 모델의 네 파라미터 사이에는 상반정리(reciprocity relation)가 성립한다. α_F, α_R가 순방향·역방향 전송계수, I_ES, I_CS가 각 접합의 포화전류일 때 옳은 관계는?'
    choices:
      - 'α_F · I_CS = α_R · I_ES'
      - 'α_F / I_ES = α_R / I_CS'
      - 'α_F · I_ES = α_R · I_CS'
      - 'α_F + α_R = I_ES + I_CS'
    answer: 2
    glossary:
      - '전송계수 α｜｜에미터에서 주입된 캐리어 중 컬렉터에 도달하는 비율, β와는 α=β/(1+β) 관계'
      - '상반정리｜｜두 방향의 결합 계수가 대칭 관계를 가진다는 정리'
    explanation: '상반정리는 α_F·I_ES = α_R·I_CS = I_S 이며, 이 공통량을 전송 포화전류 I_S로 정의한다. 베이스를 가로지르는 소수캐리어 전류의 공통 성분에서 유도되며, 덕분에 4개 파라미터가 독립 3개로 줄어든다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '실제 npn BJT는 보통 α_R ≪ α_F (역방향 전류이득이 매우 작음)이다. 에버스-몰 관점에서 이런 비대칭의 주된 이유는?'
    choices:
      - '에미터와 컬렉터의 면적이 정확히 같기 때문'
      - '베이스 도핑이 양쪽 접합에서 서로 다르기 때문'
      - '역방향에서는 BC 접합이 항상 절연체처럼 동작하기 때문'
      - '컬렉터 도핑이 에미터보다 낮아, 역방향 동작 시 주입효율이 떨어지기 때문'
    answer: 3
    glossary:
      - '주입효율｜｜에미터 전류 중 베이스로 주입되는 소수캐리어가 차지하는 비율'
    explanation: '도핑 순위는 보통 N_DE > N_AB > N_DC 이다. 역방향활성에서는 도핑이 낮은 컬렉터가 에미터 역할을 하므로 주입효율이 낮아 α_R가 작다. 얼리효과를 줄이려 컬렉터를 낮게 도핑한 결과로, BJT는 구조상 한 방향 사용이 정해진 비대칭 소자가 된다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'BJT의 차단주파수(전이주파수) f_T의 정의로 옳은 것은?'
    choices:
      - '전류이득의 크기 |h_fe|가 1이 되는 주파수'
      - '전압이득이 1이 되는 주파수'
      - '최대 발진 주파수 f_max'
      - '전력이득이 3 dB 떨어지는 주파수'
    answer: 0
    glossary:
      - 'h_fe｜｜공통에미터 소신호 단락 전류이득(β의 소신호 값)'
      - 'f_max｜｜전력이득이 1이 되는 최대 발진 주파수'
    explanation: 'f_T는 공통에미터 단락출력 전류이득 |h_fe|(=|β|)의 크기가 1(0 dB)로 떨어지는 주파수로 정의된다. 전압이득 1이나 전력이득 기준은 각각 다른 척도(예: f_max)이며 f_T와 혼동하면 안 된다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'BJT에서 베이스를 가로지르는 소수캐리어의 베이스 수송시간 τ_B가 길어지면 차단주파수 f_T는 어떻게 되는가?'
    choices:
      - 'f_T가 높아진다'
      - 'f_T가 낮아진다'
      - 'f_T는 변하지 않는다'
      - 'f_T가 두 배로 된다'
    answer: 1
    glossary:
      - '베이스 수송시간 τ_B｜｜소수캐리어가 확산으로 베이스를 통과하는 데 걸리는 평균 시간'
      - 'D_n｜｜전자의 확산계수'
    explanation: 'f_T = 1/(2π·τ_F)이고 총 지연 τ_F는 베이스 수송시간 τ_B를 포함한다. τ_B = W_B²/(2·D_n)로 베이스폭의 제곱에 비례하므로, τ_B가 커지면 τ_F가 늘어 f_T가 낮아진다. 고속 소자가 베이스폭을 얇게 만드는 이유다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'BJT의 f_T를 컬렉터 전류 I_C에 대해 측정하면, 중간 전류 영역에서 평탄한 최대를 보이다가 매우 큰 I_C에서 다시 감소한다. 대전류에서 f_T가 떨어지는 주된 원인은?'
    choices:
      - '얼리전압이 음수가 되기 때문'
      - '에미터 접합이 역바이어스로 바뀌기 때문'
      - '고전류 주입으로 유효 베이스폭이 넓어지는 커크 효과(base push-out) 때문'
      - '산화막이 두꺼워지기 때문'
    answer: 2
    glossary:
      - '커크 효과｜｜대전류에서 베이스가 컬렉터 쪽으로 확장되어 수송시간이 늘어나는 현상(base push-out)'
    explanation: '대전류에서는 컬렉터의 주입 캐리어 농도가 도핑을 넘어서면서 유효 베이스폭이 컬렉터 쪽으로 밀려 넓어진다(커크 효과/base push-out). τ_B ∝ W_B²가 커져 f_T가 감소한다. 저전류 쪽 감소는 접합 커패시턴스 충전시간 지배가 원인으로 메커니즘이 다르다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'BJT에서 V_CB(역바이어스)를 매우 크게 올렸을 때 발생하는 펀치스루(punch-through)를 가장 정확히 설명한 것은?'
    choices:
      - 'BC 접합에서 사태항복(avalanche)으로 전자-정공 쌍이 폭증하는 현상'
      - '산화막을 통한 터널링으로 게이트 누설이 급증하는 현상'
      - '에미터에서 정공이 역주입되어 전류이득이 무한대가 되는 현상'
      - 'CB 공핍층이 베이스 전체로 퍼져 EB 공핍층과 맞닿아 중성 베이스가 사라지는 현상'
    answer: 3
    glossary:
      - '사태항복(avalanche)｜｜높은 전계에서 캐리어가 충돌 이온화로 증배되어 전류가 급증하는 항복'
      - '펀치스루｜｜두 공핍층이 만나 중성 베이스가 사라지는 항복 모드'
    explanation: '펀치스루는 충분히 큰 V_CB에서 CB 공핍층이 얇은 베이스를 가로질러 EB 공핍층과 만나 중성 베이스가 소멸하고 전류가 베이스 제어 없이 급증하는 현상이다. 이는 캐리어 증배에 의한 사태항복과는 메커니즘이 다르며, 보통 사태항복보다 낮은 전압에서 일어날 수 있다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '동일 BJT에서 보통 BV_CEO(베이스 개방, CE 항복)와 BV_CBO(에미터 개방, CB 항복)의 대소 관계와 그 이유로 옳은 것은?'
    choices:
      - 'BV_CEO < BV_CBO, CE 구조에서는 전류이득 β에 의한 캐리어 증배 되먹임이 항복을 앞당기기 때문'
      - 'BV_CEO > BV_CBO, 베이스 개방이 더 안정하기 때문'
      - 'BV_CEO = BV_CBO, 둘은 같은 접합이므로'
      - 'BV_CEO < BV_CBO, 에미터가 컬렉터보다 항상 고도핑이기 때문'
    answer: 0
    glossary:
      - 'BV_CEO｜｜베이스 개방 조건에서 컬렉터-에미터 항복전압'
      - 'BV_CBO｜｜에미터 개방 조건에서 컬렉터-베이스 항복전압'
    explanation: 'BV_CEO ≈ BV_CBO / β^(1/n) 형태로 BV_CEO가 더 낮다. 베이스 개방 상태에서는 CB 접합에서 사태 증배로 생긴 캐리어가 베이스 전류처럼 작용해 β배 증폭되는 되먹임이 생겨 더 낮은 전압에서 항복한다. 두 전압은 서로 다른 단자 조건의 항복이라 같지 않다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'CMOS 인버터에서 입력이 논리 HIGH(V_DD에 가까움)일 때 출력이 LOW가 되는 과정을 옳게 설명한 것은?'
    choices:
      - 'nMOS가 꺼지고 pMOS가 켜져 출력이 V_DD로 끌려간다'
      - 'nMOS가 켜지고 pMOS가 꺼져 출력이 접지로 끌려간다'
      - '두 트랜지스터가 모두 켜져 출력이 V_DD/2가 된다'
      - '두 트랜지스터가 모두 꺼져 출력이 부동(floating)이 된다'
    answer: 1
    glossary:
      - '풀다운｜｜출력을 접지(LOW)로 끌어내리는 경로'
      - '관통전류｜｜두 소자가 동시에 켜진 순간 V_DD에서 접지로 직접 흐르는 전류'
    explanation: '입력 HIGH에서는 nMOS의 V_GS가 커서 켜지고(풀다운), pMOS는 V_GS가 0에 가까워 꺼진다. 따라서 출력은 접지(LOW)로 연결된다. 정상 정적 상태에서 두 소자가 동시에 켜지지 않으므로 관통전류가 거의 흐르지 않는다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'CMOS 인버터에서 동적 스위칭 중 입력이 천천히 천이할 때 V_DD에서 접지로 흐르는 관통(short-circuit)전류가 가장 큰 입력 전압 구간은?'
    choices:
      - '입력이 0 V 근처일 때'
      - '입력이 V_DD 근처일 때'
      - '입력이 대략 V_DD/2 부근(두 소자가 동시에 도통)일 때'
      - '관통전류는 입력 전압과 무관하게 일정하다'
    answer: 2
    glossary:
      - '천이｜｜입력이 LOW와 HIGH 사이를 오가는 과도 구간'
      - 'V_Tn｜｜nMOS의 문턱전압'
    explanation: '입력이 대략 V_Tn과 (V_DD-|V_Tp|) 사이, 즉 V_DD/2 부근일 때 nMOS와 pMOS가 동시에 도통해 V_DD에서 접지로 직접 흐르는 관통전류가 최대가 된다. 입력 천이가 느릴수록 이 구간에 머무는 시간이 길어 관통전력 손실이 커진다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'CMOS 회로의 동적 스위칭 전력은 P_dyn = α·C·V_DD²·f 로 근사된다. 이 식이 알려주는 가장 직접적인 저전력 설계 전략은?'
    choices:
      - '동작주파수 f를 두 배로 올린다'
      - '부하 커패시턴스 C를 키운다'
      - '스위칭 활동도 α를 1로 고정한다'
      - '공급전압 V_DD를 낮춘다(전력이 V_DD의 제곱에 비례하므로 효과가 큼)'
    answer: 3
    glossary:
      - 'α｜｜스위칭 활동도(activity factor), 한 클럭당 노드가 천이하는 평균 비율'
      - 'C｜｜노드의 부하 커패시턴스'
    explanation: 'P_dyn ∝ V_DD² 이므로 전압을 낮추면 동적 전력이 제곱으로 감소해 가장 효과적이다(예: V_DD 절반 → 동적 전력 1/4). f·C·α를 키우면 오히려 전력이 늘고, 전압 강하는 속도 저하의 부작용이 있어 균형이 필요하다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '이상적 CMOS는 정적 상태에서 거의 전력을 쓰지 않는다. 그러나 미세공정에서 정적(누설) 전력이 무시할 수 없게 된 주된 원인은?'
    choices:
      - '문턱전압 저하로 인한 서브문턱 누설과 얇은 산화막의 게이트 터널링 누설 때문'
      - '정상 동작 시 nMOS와 pMOS가 항상 동시에 켜져 있기 때문'
      - '관통전류가 정적 상태에서도 최대로 흐르기 때문'
      - '부하 커패시턴스의 충방전이 정적 상태에서도 계속되기 때문'
    answer: 0
    glossary:
      - '서브문턱 누설｜｜문턱전압 이하에서도 OFF 트랜지스터로 흐르는 작은 전류'
      - '게이트 터널링｜｜얇은 산화막을 양자 터널링으로 통과하는 누설'
    explanation: '미세화로 V_DD와 함께 문턱전압이 낮아지면 OFF 상태에서도 서브문턱 누설(subthreshold leakage)이 지수적으로 커지고, 게이트 산화막이 얇아지면 게이트 터널링(FN/직접 터널링) 누설이 생긴다. 이것이 미세공정 정적 전력의 주범이다. 정적 상태에서는 충방전·관통전류가 흐르지 않는다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'CMOS에서 래치업(latch-up)을 일으키는 기생 구조를 가장 정확히 설명한 것은?'
    choices:
