meta:
  title: '반도체 신뢰성·불량분석 1'
  version: '1.0.0'
  default_time: 45
  set_time: 1750
  tags: [engineering, semiconductor, reliability]
  source: '대학 학부 전공 표준 범위(공개 강의목차·교재 기반, exa 리서치 + 멀티에이전트 생성). 특정 상용 교재 본문 미복제.'

questions:
  - type: mcq
    q: '신뢰성 공학에서 ''고장모드(failure mode)''와 ''고장메커니즘(failure mechanism)''의 관계를 가장 옳게 설명한 것은?'
    choices:
      - '고장모드는 관측되는 고장의 외형적 형태이고, 고장메커니즘은 그 고장을 일으킨 물리·화학적 과정이다'
      - '두 용어는 동의어로, 단지 산업 분야에 따라 다르게 부를 뿐이다'
      - '고장모드는 고장의 물리적 원인이고, 고장메커니즘은 사용자가 관측하는 증상이다'
      - '고장모드는 수리 가능한 고장, 고장메커니즘은 수리 불가능한 고장을 가리킨다'
    answer: 0
    explanation: '고장모드는 ''개방(open)'', ''단락(short)'' 처럼 겉으로 드러나는 고장의 형태를 말하고, 고장메커니즘은 electromigration·TDDB 같은 그 형태를 만들어낸 물리·화학적 열화 과정을 뜻한다. 둘은 증상-원인 관계로 별개의 개념이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '다음 중 본질적(intrinsic) 고장이 아니라 외인성(extrinsic) 고장으로 분류되는 것은?'
    choices:
      - '게이트 산화막의 고유 절연파괴(intrinsic breakdown)'
      - '산화막 내 파티클·핀홀 등 공정 결함에 의한 조기 절연파괴'
      - '결정 결함 없는 재료의 진성 electromigration'
      - '재료 고유의 시간의존 유전체파괴(TDDB) 본질 분포'
    answer: 1
    glossary:
      - 'TDDB｜｜시간의존 유전체파괴, 전계 인가 시간이 누적되며 산화막이 파괴되는 현상'
    explanation: '외인성 고장은 파티클·오염·핀홀 등 외부에서 유입된 결함(defect)에 기인하며 주로 초기고장으로 나타난다. 나머지 보기들은 재료·소자 고유 한계로 발생하는 본질적 고장이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '신뢰도함수 R(t)와 누적고장분포함수 F(t) 사이의 관계로 옳은 것은?'
    choices:
      - 'R(t) = F(t), 두 함수는 항상 같다'
      - 'R(t) = 1 + F(t), R(0)=2'
      - 'R(t) = 1 - F(t), 그리고 R(0)=1, R(∞)=0'
      - 'R(t) = dF(t)/dt'
    answer: 2
    explanation: 'F(t)는 시각 t까지 고장 날 확률, R(t)는 t까지 생존할 확률이므로 둘의 합은 1이다. 따라서 R(t)=1-F(t)이며 t=0에서 R=1, t→∞에서 R→0이다. dF/dt는 고장밀도함수 f(t)이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '고장밀도함수 f(t)를 R(t), F(t)로 바르게 표현한 것은?'
    choices:
      - 'f(t) = dR(t)/dt'
      - 'f(t) = R(t)·F(t)'
      - 'f(t) = 1 - R(t)'
      - 'f(t) = dF(t)/dt = -dR(t)/dt'
    answer: 3
    explanation: 'f(t)는 F(t)의 도함수다. R(t)=1-F(t)이므로 dF/dt = -dR/dt이며, 따라서 f(t)=dF/dt=-dR/dt가 성립한다. f(t)를 0~∞ 적분하면 1이 된다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '순간고장률(hazard rate) λ(t)를 f(t), R(t)로 옳게 나타낸 것은?'
    choices:
      - 'λ(t) = f(t)/R(t) = -d[ln R(t)]/dt'
      - 'λ(t) = f(t)·R(t)'
      - 'λ(t) = R(t)/f(t)'
      - 'λ(t) = f(t)/F(t)'
    answer: 0
    explanation: 'λ(t)는 t까지 생존한 것을 조건으로 한 순간 고장확률이므로 f(t)/R(t)로 정의된다. f(t)=-dR/dt를 대입하면 λ(t)=-(dR/dt)/R = -d[ln R]/dt가 되어 R(t)=exp(-∫λ dt)와 연결된다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '순간고장률 λ(t)가 주어졌을 때 신뢰도함수 R(t)를 옳게 표현한 것은? (단 R(0)=1)'
    choices:
      - 'R(t) = 1 - ∫₀ᵗ λ(u) du'
      - 'R(t) = exp(-∫₀ᵗ λ(u) du)'
      - 'R(t) = ∫₀ᵗ λ(u) du'
      - 'R(t) = exp(+∫₀ᵗ λ(u) du)'
    answer: 1
    explanation: 'λ(t)=-d[ln R]/dt를 0~t로 적분하면 ln R(t) = -∫λ du가 되고, 양변에 지수를 취해 R(t)=exp(-∫₀ᵗ λ(u)du)를 얻는다. ∫λdu를 누적고장률(cumulative hazard)이라 한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '욕조곡선(bathtub curve)의 세 구간에 대한 설명으로 옳은 것은?'
    choices:
      - '초기고장기는 고장률이 증가하고, 마모고장기는 감소한다'
      - '세 구간 모두 고장률이 일정하게 유지된다'
      - '초기고장기는 고장률이 감소(DFR), 우발고장기는 일정(CFR), 마모고장기는 증가(IFR)한다'
      - '우발고장기에는 고장률이 가장 급격히 증가한다'
    answer: 2
    glossary:
      - 'DFR｜｜decreasing failure rate, 시간이 지날수록 고장률이 감소'
      - 'IFR｜｜increasing failure rate, 시간이 지날수록 고장률이 증가'
    explanation: '욕조곡선은 초기(번인으로 걸러지는 외인성 결함, 고장률 감소 DFR), 우발(랜덤 고장, 고장률 일정 CFR), 마모(노후 열화, 고장률 증가 IFR)의 세 구간으로 나뉜다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '욕조곡선의 초기고장(infant mortality) 구간 제품을 출하 전에 걸러내기 위해 주로 사용하는 기법은?'
    choices:
      - '마모 부품의 주기적 교체'
      - '정기 예방정비(preventive maintenance)'
      - '재설계(redesign)를 통한 고장률 하향'
      - '번인(burn-in) 및 환경 스트레스 스크리닝'
    answer: 3
    explanation: '초기고장은 공정 결함을 가진 외인성 약체 소자에서 발생하므로, 일정 시간 스트레스를 주는 번인·스크리닝으로 출하 전에 도태시킨다. 예방정비·부품교체는 마모고장 대책, 재설계는 우발고장 저감책이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '품질(quality)과 신뢰성(reliability)의 차이를 가장 정확히 설명한 것은?'
    choices:
      - '품질은 어느 한 시점(출하 시)의 규격 적합도, 신뢰성은 시간에 걸친 기능 유지능력이다'
      - '품질은 시간에 따른 성능 유지능력, 신뢰성은 출하 시점의 합격 여부다'
      - '둘은 같은 개념이며 측정 단위만 다르다'
      - '신뢰성이 높으면 품질은 자동으로 낮아진다'
    answer: 0
    explanation: '품질은 ''출하 시점''의 규격 적합 정도(정적 개념)이고, 신뢰성은 ''시간에 걸쳐'' 기능을 유지하는 능력(시간 함수)이다. 흔히 신뢰성을 ''시간 축으로 확장된 품질''이라 부른다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '품질과 신뢰성의 상관관계에 대한 설명으로 가장 옳은 것은?'
    choices:
      - '출하 시 품질검사를 통과하면 마모고장도 절대 발생하지 않는다'
      - '초기 품질이 높으면 외인성 초기고장이 줄어 신뢰성에 긍정적 영향을 주지만, 둘이 항상 일치하지는 않는다'
      - '품질과 신뢰성은 서로 완전히 독립이라 영향을 주지 않는다'
      - '품질이 높을수록 우발고장률(CFR)이 반드시 0이 된다'
    answer: 1
    explanation: '공정 품질이 좋으면 결함성 약체 소자가 줄어 초기고장이 감소하므로 신뢰성에 유리하다. 그러나 본질적 마모고장은 품질검사로 막을 수 없어 둘이 항상 일치하지는 않는다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'MTTF, MTBF, MTTR의 정의와 적용에 대한 설명으로 옳은 것은?'
    choices:
      - 'MTTF는 수리계, MTBF는 비수리계에 쓴다'
      - 'MTBF = MTTF - MTTR 로 항상 정의된다'
      - 'MTTF는 비수리계의 평균수명, MTBF는 수리계의 평균 고장간격, MTTR은 평균 수리시간이다'
      - 'MTTR은 비수리계에서 고장까지의 평균시간을 뜻한다'
    answer: 2
    explanation: 'MTTF(Mean Time To Failure)는 교체형 비수리계의 평균수명, MTBF(Mean Time Between Failures)는 수리해 재사용하는 수리계의 평균 고장간격, MTTR(Mean Time To Repair)은 평균 수리시간이다. 일반적으로 MTBF≈MTTF+MTTR이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '온도가속 신뢰성시험에서 아레니우스 모델의 가속계수(AF) 식으로 옳은 것은? (Ea: 활성화에너지, k: 볼츠만상수, T는 절대온도)'
    choices:
      - 'AF = exp[(Ea/k)·(1/T_stress - 1/T_use)]'
      - 'AF = (T_stress/T_use)^Ea'
      - 'AF = exp[k·Ea·(T_stress - T_use)]'
      - 'AF = exp[(Ea/k)·(1/T_use - 1/T_stress)]'
    answer: 3
    glossary:
      - '활성화에너지 Ea｜｜고장메커니즘을 일으키는 데 필요한 최소 에너지, 단위 eV'
      - '볼츠만상수 k｜｜약 8.617e-5 eV/K'
    explanation: '수명 t_f∝exp(Ea/kT)이므로 AF=t_use/t_stress=exp[(Ea/k)(1/T_use - 1/T_stress)]다. 스트레스 온도 T_stress가 높을수록 1/T_stress가 작아져 지수가 양수가 되고 AF>1, 즉 시험이 가속된다. Ea가 클수록 AF는 지수적으로 커진다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '신뢰성 수명척도에서 B10 수명의 의미로 옳은 것은?'
    choices:
      - '전체 모집단의 10%가 고장 나는 시각(F(t)=0.10이 되는 t)'
      - '전체의 10%가 생존하는 시각'
      - '고장률이 10%/시간이 되는 시각'
      - 'MTTF의 10%에 해당하는 시각'
    answer: 0
    explanation: 'B10(또는 L10) 수명은 모집단의 10%가 고장 나는 시점, 즉 F(t)=0.10이 되는 t다. 마찬가지로 B50은 50%가 고장 나는 중앙값 수명이다. 베어링·LED 수명 규격에 흔히 쓰인다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '비대칭(오른쪽으로 긴 꼬리) 수명분포에서 B50(중앙값) 수명과 MTTF(평균수명)의 관계로 가장 옳은 것은?'
    choices:
      - '어떤 분포에서도 B50과 MTTF는 항상 같다'
      - '분포가 비대칭이면 B50과 MTTF는 일반적으로 서로 다른 값을 가진다'
      - 'B50은 항상 MTTF보다 크다'
      - 'B50은 고장률, MTTF는 신뢰도라서 비교 자체가 불가능하다'
    answer: 1
    explanation: 'B50은 중앙값(median), MTTF는 평균(mean)이다. 대칭분포에서는 두 값이 일치하지만, 오른쪽 꼬리가 긴 비대칭 분포에서는 평균이 꼬리에 끌려 중앙값과 달라진다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '지수분포 수명모델의 ''무기억성(memoryless)'' 특성을 가장 잘 설명한 것은?'
    choices:
      - '사용 시간이 길수록 남은 수명의 기댓값이 점점 짧아진다'
      - '고장률이 시간에 따라 증가한다'
      - '이미 t시간 동안 동작한 부품의 잔여수명 분포가 새 부품과 동일하다 (P(T>t+s|T>t)=P(T>s))'
      - '고장이 누적될수록 다음 고장 확률이 커진다'
    answer: 2
    explanation: '지수분포는 고장률 λ가 일정하여 과거 사용이력이 잔여수명에 영향을 주지 않는다. 즉 t시간 생존한 부품이 추가로 s시간 더 버틸 확률은 새 부품이 s시간 버틸 확률과 같다(무기억성).'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '고장률 λ가 일정한 지수분포 부품의 MTTF가 10,000시간일 때, 사용시간 t=10,000시간(=MTTF)에서의 신뢰도 R(t)는 약 얼마인가?'
    choices:
      - '약 0.50'
      - '약 0.90'
      - '약 0.63'
      - '약 0.37'
    answer: 3
    explanation: '지수분포에서 MTTF=1/λ이므로 t=MTTF일 때 λt=1이다. 따라서 R=e^{-1}≈0.368, 즉 약 37%만 생존한다. 평균수명 시점에 절반이 아니라 약 1/3만 살아남는 점이 직관과 다른 부분이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'Weibull 분포의 형상모수 β 값과 고장 구간의 대응으로 옳은 것은?'
    choices:
      - 'β<1: 초기고장(DFR), β=1: 우발고장(CFR), β>1: 마모고장(IFR)'
      - 'β<1: 마모고장, β=1: 초기고장, β>1: 우발고장'
      - 'β 값과 무관하게 항상 일정한 고장률을 보인다'
      - 'β>1: 초기고장, β<1: 마모고장'
    answer: 0
    explanation: 'Weibull 고장률은 시간의 (β-1)승에 비례한다. β<1이면 고장률 감소(초기고장), β=1이면 지수분포와 같은 일정 고장률(우발고장), β>1이면 고장률 증가(마모고장)로 욕조곡선 전 구간을 표현할 수 있다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '2-모수 Weibull 분포에서 척도모수(특성수명) η의 의미로 옳은 것은? (R(t)=exp(-(t/η)^β))'
    choices:
      - 'η에서 항상 모집단의 50%가 고장 난다'
      - 't=η에서 F(t)=1-e^{-1}≈0.632, 즉 약 63.2%가 고장 나는 특성수명이다'
      - 'η는 고장률이 최대가 되는 시각이다'
      - 'η는 β와 무관하게 평균수명(MTTF)과 항상 같다'
    answer: 1
    explanation: 'Weibull에서 t=η를 대입하면 (t/η)^β=1이므로 R=e^{-1}≈0.368, 즉 F≈0.632가 된다. β와 무관하게 항상 약 63.2%가 고장 나는 시점이 특성수명 η다. MTTF는 η·Γ(1+1/β)로 β에 따라 달라진다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'Weibull 분포에서 형상모수 β=1일 때 분포는 어떤 분포로 환원되는가?'
    choices:
      - '정규분포'
      - '대수정규분포'
      - '지수분포(일정 고장률)'
      - 'Rayleigh 분포'
    answer: 2
    explanation: 'β=1이면 Weibull 고장률이 1/η으로 일정해져 지수분포(λ=1/η)와 동일해진다. 참고로 β=2이면 Rayleigh 분포가 된다. 따라서 지수분포는 Weibull의 특수한 경우다.'
    tags: [engineering, semiconductor]
  - type: mcq
