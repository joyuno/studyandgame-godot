  source: '대학 학부 전공 표준 범위(공개 강의목차·교재 기반, exa 리서치 + 멀티에이전트 생성). 특정 상용 교재 본문 미복제.'

questions:
  - type: mcq
    q: '상태밀도(Density of States, DOS) 함수 g(E)가 나타내는 물리량으로 가장 옳은 것은?'
    choices:
      - '특정 에너지에 있는 전자의 실제 수'
      - '전자의 평균 속도'
      - '단위 에너지·단위 부피당 가능한 전자 상태(자리)의 수'
      - '밴드갭의 크기'
    answer: 2
    explanation: '상태밀도 g(E)는 에너지 E 부근 단위 에너지 구간·단위 부피당 존재 가능한 양자상태의 수다. 실제 전자 수는 g(E)에 점유확률 f(E)를 곱해 적분해야 얻는다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '포물선형 밴드(자유전자 근사)를 가정한 3차원 결정에서, 전도대 가장자리(E_C) 위에서 상태밀도 g(E)의 에너지 의존성은?'
    choices:
      - 'E에 무관하게 일정'
      - '(E - E_C)에 비례'
      - '(E - E_C)의 제곱에 반비례'
      - '(E - E_C)의 제곱근에 비례'
    answer: 3
    explanation: '3차원 포물선 밴드에서 g(E) ∝ √(E - E_C)로, 밴드 가장자리에서 0이고 에너지가 커질수록 √형으로 증가한다. 참고로 2차원은 계단형(상수), 1차원은 1/√E 형이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '포물선 밴드를 가정할 때, 차원(3D, 2D, 1D)에 따른 상태밀도 g(E)의 형태를 옳게 짝지은 것은?'
    choices:
      - '3D: √E, 2D: 계단형(일정), 1D: 1/√E'
      - '3D: 일정, 2D: √E, 1D: 1/√E'
      - '3D: 1/√E, 2D: √E, 1D: 일정'
      - '모든 차원에서 동일하게 √E'
    answer: 0
    glossary:
      - '양자우물｜｜한 방향으로 전자를 가두어 2차원처럼 거동하게 만든 구조'
    explanation: '포물선 밴드 기준 g(E)는 3D에서 √E, 2D에서 에너지에 무관한 계단형(일정), 1D에서 1/√E(발산형)이다. 저차원 양자우물·양자선 소자 설계에서 핵심이 된다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '열평형에서 에너지 E인 상태가 전자에 의해 점유될 확률을 주는 페르미-디랙 분포함수 f(E)의 올바른 표현은?'
    choices:
      - 'f(E) = exp(-(E-E_F)/kT)'
      - 'f(E) = 1 / [1 + exp((E - E_F)/kT)]'
      - 'f(E) = 1 / [exp((E - E_F)/kT) - 1]'
      - 'f(E) = (E - E_F)/kT'
    answer: 1
    glossary:
      - '페르미 준위｜｜점유확률이 정확히 1/2이 되는 기준 에너지, E_F'
    explanation: '페르미-디랙 분포는 f(E)=1/[1+exp((E-E_F)/kT)]이다. 1번은 고에너지 근사(맥스웰-볼츠만), 3번은 보스-아인슈타인 분포(-1)이므로 구분해야 한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '온도가 0이 아닌 평형 상태에서, E = E_F(페르미 준위)인 상태가 전자에 의해 점유될 확률 f(E_F)의 값은?'
    choices:
      - '0'
      - '1/4'
      - '1/2'
      - '1'
    answer: 2
    explanation: 'E=E_F이면 지수항 exp(0)=1이므로 f(E_F)=1/(1+1)=1/2이다. 즉 페르미 준위는 온도와 무관하게 점유확률이 정확히 1/2이 되는 에너지로 정의된다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '페르미-디랙 분포 f(E)가 맥스웰-볼츠만 근사 f(E)≈exp(-(E-E_F)/kT)로 단순화될 수 있는 조건으로 옳은 것은?'
    choices:
      - 'E = E_F'
      - 'E - E_F ≪ -kT (페르미 준위보다 한참 낮은 에너지)'
      - 'T = 0 K'
      - 'E - E_F ≫ kT (페르미 준위보다 한참 높은 에너지)'
    answer: 3
    glossary:
      - '비축퇴 반도체｜｜페르미 준위가 밴드 가장자리에서 충분히 떨어져 볼츠만 근사가 성립하는 반도체'
    explanation: 'E-E_F ≫ kT(보통 수 kT 이상)이면 exp((E-E_F)/kT)≫1이라 분모의 1을 무시할 수 있어 f(E)≈exp(-(E-E_F)/kT)로 근사된다. 비축퇴 반도체의 전도대 캐리어 계산에서 흔히 사용한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '역방향 바이어스 pn 접합에서 애벌란치(avalanche) 항복이 일어나는 물리적 기구로 가장 옳은 것은?'
    choices:
      - '가속된 캐리어가 격자와 충돌이온화를 일으켜 캐리어가 사태처럼 증식한다'
      - '강한 전계가 공유결합을 직접 끊어 전자-정공 쌍을 생성한다'
      - '양자역학적 터널링으로 가전자대 전자가 전도대로 직접 천이한다'
      - '열적으로 들뜬 캐리어가 장벽을 넘어 확산 전류를 키운다'
    answer: 0
    glossary:
      - '충돌이온화｜｜가속된 캐리어가 격자 원자와 충돌하여 새 전자-정공 쌍을 생성하는 현상'
    explanation: '애벌란치 항복은 공핍층의 높은 전계에서 가속된 캐리어가 격자 원자와 충돌해 충돌이온화(impact ionization)로 새 전자-정공 쌍을 만들고, 이들이 다시 가속·이온화하여 캐리어가 사태처럼 증식하는 과정이다. 결합을 직접 끊거나 터널링하는 것은 제너 항복 쪽 묘사이며, 마지막 보기는 항복이 아닌 누설 전류 메커니즘이다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '제너(Zener) 항복이 지배적으로 나타나는 접합 조건으로 가장 적절한 것은?'
    choices:
      - '양쪽이 가볍게 도핑되어 공핍층이 두꺼운 접합'
      - '양쪽이 무겁게 도핑되어 공핍층이 매우 얇은 접합'
      - '한쪽만 진성(intrinsic)인 PIN 구조'
      - '접합 면적이 매우 큰 대전류 다이오드'
    answer: 1
    glossary:
      - '밴드-투-밴드 터널링｜｜얇은 장벽을 전자가 양자역학적으로 통과하여 가전자대에서 전도대로 천이하는 현상'
    explanation: '제너 항복은 밴드-투-밴드 터널링이므로 공핍층이 매우 얇아야(수 nm) 일어나며, 이는 양쪽을 무겁게 도핑할 때 충족된다. 가볍게 도핑하면 공핍층이 두꺼워 터널링 대신 애벌란치가 지배한다. PIN이나 면적은 항복 종류를 직접 결정하지 않는다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '실리콘 다이오드의 항복전압을 측정했더니 온도가 올라갈수록 항복전압이 커졌다. 이로부터 추정되는 항복 종류와 이유로 옳은 것은?'
    choices:
      - '제너 항복 — 온도가 오르면 밴드갭이 줄어 터널링이 쉬워지므로'
      - '애벌란치 항복 — 온도가 오르면 캐리어 이동도가 커져 가속이 쉬워지므로'
      - '애벌란치 항복 — 온도가 오르면 격자 산란이 늘어 충돌 전 평균자유행정이 짧아지므로'
      - '제너 항복 — 온도가 오르면 캐리어 농도가 늘어 전계가 강해지므로'
    answer: 2
    glossary:
      - '평균자유행정｜｜캐리어가 산란 없이 이동하는 평균 거리'
      - '온도계수｜｜온도 변화에 대한 물리량의 변화 부호와 크기'
    explanation: '양(+)의 온도계수는 애벌란치 항복의 특징이다. 온도가 오르면 격자 진동(포논 산란)이 증가해 캐리어의 평균자유행정이 짧아지고, 충돌이온화에 필요한 에너지를 얻으려면 더 높은 전계(더 큰 항복전압)가 필요해진다. 제너 항복은 밴드갭 축소로 음(-)의 온도계수를 보인다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '실리콘 제너 다이오드에서 일반적으로 항복전압이 약 6V를 경계로 그 이하/이상에서 지배적인 항복 기구가 바뀐다. 옳게 짝지은 것은?'
    choices:
      - '약 6V 이하: 애벌란치 / 약 6V 이상: 제너'
      - '전 영역에서 항상 제너만 작용'
      - '전 영역에서 항상 애벌란치만 작용'
      - '약 6V 이하: 제너 / 약 6V 이상: 애벌란치'
    answer: 3
    explanation: '실리콘에서 항복전압이 낮을수록(약 6V 이하) 공핍층이 얇아 터널링 기반 제너 항복이 지배하고, 6V 이상에서는 공핍층이 두꺼워 애벌란치가 지배한다. 6V 부근에서는 두 기구가 공존하며 온도계수가 거의 0이 되도록 설계할 수 있다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '이상적(Schottky-Mott) 모델에서 금속(일함수 Φm)과 n형 반도체(전자친화도 χ)가 접합할 때 전자에 대한 쇼트키 장벽 높이 qΦB는?'
    choices:
      - 'qΦB = q(Φm - χ)'
      - 'qΦB = q(χ - Φm)'
      - 'qΦB = q(Φm + χ)'
      - 'qΦB = qE_g - q(Φm - χ)'
    answer: 0
    glossary:
      - '전자친화도｜｜진공준위와 전도대 바닥 사이의 에너지 차이(χ)'
      - '일함수｜｜진공준위와 페르미 준위 사이의 에너지 차이(Φ)'
    explanation: '이상적 쇼트키-모트 규칙에서 n형 반도체에 대한 장벽 높이는 금속 일함수에서 반도체 전자친화도를 뺀 qΦB = q(Φm - χ)이다. p형의 경우 qΦBp = E_g - q(Φm - χ)가 되어 두 장벽의 합이 밴드갭과 같다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: 'n형 반도체에 금속을 접합할 때, 정류성 쇼트키 접합이 형성되는 일함수 조건은? (단순 이상 모델 기준)'
    choices:
      - 'Φm < Φs (금속 일함수가 반도체보다 작을 때)'
      - 'Φm > Φs (금속 일함수가 반도체보다 클 때)'
      - 'Φm = χ (금속 일함수가 전자친화도와 같을 때)'
      - '일함수와 무관하게 항상 쇼트키 접합'
    answer: 1
    explanation: 'n형에서 Φm > Φs이면 전자가 반도체에서 금속으로 빠져나가 반도체 표면이 공핍되고 전위 장벽(정류성 쇼트키)이 생긴다. 반대로 Φm < Φs이면 표면이 축적되어 장벽 없는 오믹 접촉이 된다. p형은 부등호가 반대로 적용된다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '쇼트키 장벽 다이오드가 동일 정격의 pn 접합 다이오드보다 고속 스위칭에 유리한 가장 주된 이유는?'
    choices:
      - '역방향 누설 전류가 거의 0이기 때문'
      - '순방향 전압 강하가 pn 접합보다 크기 때문'
      - '다수 캐리어 소자라 소수 캐리어 저장(축적) 시간이 거의 없기 때문'
      - '공핍층이 없어 접합 커패시턴스가 0이기 때문'
    answer: 2
    glossary:
      - '소수 캐리어 저장｜｜순방향 도통 중 중성 영역에 축적된 소수 캐리어로, 역회복을 느리게 만드는 전하'
      - '역회복 시간｜｜순방향에서 역방향으로 전환 시 다이오드가 차단되기까지 걸리는 시간'
    explanation: '쇼트키 다이오드는 다수 캐리어 소자로 동작하므로 pn 접합에서 문제되는 소수 캐리어 축적(저장) 전하가 거의 없어 역회복 시간이 짧고 스위칭이 빠르다. 누설은 오히려 더 크고, 순방향 강하는 더 작으며, 접합 커패시턴스도 존재한다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '실제 실리콘 금속-반도체 접합에서 쇼트키 장벽 높이가 금속 일함수에 거의 둔감하게 나타나는 현상의 원인은?'
    choices:
      - '금속의 전기전도도가 매우 높기 때문'
      - '반도체 도핑 농도가 장벽을 결정하기 때문'
      - '온도가 장벽 높이를 평균화하기 때문'
      - '계면 갭 상태가 페르미 준위를 고정(pinning)하기 때문'
    answer: 3
    glossary:
      - '페르미 준위 핀닝｜｜계면 상태가 페르미 준위를 특정 에너지에 고정시켜 장벽 높이가 일함수에 둔감해지는 현상'
    explanation: '반도체 결정이 금속과 접하는 계면에 밴드갭 내 계면 상태(metal-induced gap states)가 다량 형성되어 페르미 준위를 특정 에너지에 고정시키는 페르미 준위 핀닝이 일어난다. 그 결과 장벽 높이가 쇼트키-모트 예측과 달리 금속 일함수에 거의 의존하지 않게 된다.'
    tags: [engineering, semiconductor]
  - type: mcq
    q: '쇼트키 다이오드의 순방향 전류는 열전자 방출 이론에서 J = J_s[exp(qV/nkT) - 1]로 표현된다. 포화 전류밀도 J_s가 가장 강하게 의존하는 인자는?'
    choices:
      - '장벽 높이 ΦB에 대해 exp(-qΦB/kT)로 의존'
      - '인가 전압 V에 지수적으로 비례'
      - '다이오드 면적에 반비례'
      - '직렬 저항에 비례'
    answer: 0
    glossary:
      - '열전자 방출｜｜캐리어가 열에너지로 장벽을 넘어 흐르는 전류 메커니즘'
      - '이상계수｜｜실제 I-V가 이상적 지수에서 벗어난 정도를 나타내는 인자 n'
    explanation: '열전자 방출 모델에서 포화 전류밀도는 J_s = A*T² exp(-qΦB/kT)로, 장벽 높이 ΦB에 지수적으로(exp(-qΦB/kT)) 강하게 의존한다. 장벽이 낮을수록 J_s가 커져 순방향 전압 강하가 작아진다. V 의존성은 지수항 전체이지 J_s가 아니다.'
